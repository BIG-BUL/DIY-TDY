<div id="root"><div class="boot" id="boot">Loading…</div></div>
<script>
/* Show failures instead of hanging on "Loading…". A silent boot failure is
   undiagnosable from a phone, which is exactly where this app is used. */
(function () {
  var boot = document.getElementById("boot");
  function show(title, detail) {
    if (!boot) return;
    boot.innerHTML = '<div style="color:#C8102E;font-weight:600;margin-bottom:8px">' + title + "</div>" +
      '<div style="color:#8A929C;font-size:12px;line-height:1.5;word-break:break-word">' + detail + "</div>" +
      '<div style="color:#6B747D;font-size:11px;margin-top:14px">' +
      "page " + Math.round(document.documentElement.innerHTML.length / 1024) + " KB loaded</div>";
  }
  window.addEventListener("error", function (e) {
    show("Startup failed", (e.message || "unknown error") + (e.lineno ? " (line " + e.lineno + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    show("Startup failed", "unhandled promise: " + ((e.reason && e.reason.message) || e.reason));
  });
  /* If nothing has rendered after five seconds, the app never mounted and no
     error fired — which usually means the file arrived incomplete. */
  setTimeout(function () {
    if (document.getElementById("boot")) {
      var kb = Math.round(document.documentElement.innerHTML.length / 1024);
      show("App did not start",
        "No error was raised, so the file is probably incomplete. A full copy is about 850 KB; " +
        "this page is " + kb + " KB. If that number is well under 850, the upload truncated — " +
        "re-upload index.html.");
    }
  }, 5000);
})();
</script>

<script data-inject="app">
const{useState,useEffect,useMemo,useRef,useCallback,useReducer}=React,CSS=`
/* ============================================================
   DESIGN SYSTEM  \xB7  chalk and iron
   ------------------------------------------------------------
   Every colour, size, space and tap target in the app resolves
   to a token declared here. Nothing below this block may use a
   raw hex value \u2014 test_design enforces that, because the palette
   had already drifted to 54 colours, 34 of which were invisible
   duplicates of another (five separate near-identical chalks,
   fourteen near-identical dark surfaces). Tokens are the only
   way that stays fixed.
   ============================================================ */

.cs-root {
  /* -- surfaces: iron, darkest to lightest ------------------ */
  --s0:#0E1116;          /* page */
  --s1:#151A20;          /* panel, plate */
  --s2:#1D242C;          /* raised, selected */
  --s3:#262E37;          /* raised-high, unlit muscle */
  --s-sunk:#0B0E12;      /* inset wells, inputs */

  /* -- lines ------------------------------------------------ */
  --line:#2C343E;        /* primary rule */
  --line-soft:#222933;   /* secondary rule, internal divider */
  --line-hi:#3C4650;     /* hover / emphasis rule */

  /* -- text: chalk, brightest to faintest ------------------- */
  --t0:#EAE8E3;          /* primary */
  --t1:#C7CBD1;          /* secondary */
  --t2:#959DA7;          /* muted \u2014 labels, descriptions */
  /* Raised from #6B747D, which measured 3.3\u20134.0:1 and failed AA everywhere it
     was used \u2014 and it was used for the SMALLEST type in the app, the 10px
     uppercase mono labels. Small text needs more contrast, not less.
     There used to be a fourth, fainter tier below this one. It carried two
     placeholders and the equipment count, all of them text someone has to
     read, so it had to meet AA too \u2014 at which point it was this colour. Two
     tiers that must be the same colour are one tier. */
  --t3:#838B92;          /* dim \u2014 meta, keys, stamps, placeholders */

  /* -- accents ---------------------------------------------- */
  /* --red is a FILL and a border. As text on a dark surface it measures
     2.7\u20133.2:1 and fails AA, so reading red gets its own lighter value \u2014 the
     same split --green/--green-txt already uses. */
  --red:#C8102E;         --red-soft:#8A3A2E;    --red-txt:#DC6679;
  --yellow:#EFBE12;      --yellow-edge:#4A3C1E;   --yellow-bg:#17150E;
  --yellow-txt:#C6BA8C;  --yellow-line:#5A4A12;
  --green:#159652;       --green-edge:#2A4E3F;    --green-bg:#101713;
  --green-txt:#8DB49F;   --green-hi:#B6D4C3;
  --blue:#0B62C4;
  --ink:#0E1116;         /* text on a yellow or chalk fill */
  --stab:rgba(237,234,226,.5);     /* stabiliser hatch stroke */
  --stab-soft:rgba(237,234,226,.45);
  --dash:rgba(231,229,224,.55);    /* lattice collision outline */

  /* IWF competition disc colours, used to code load intensity. These name
     real objects, so they keep their identity across themes \u2014 except the
     white plate, which has to become a visible neutral in daylight. */
  --pl-red:#C8102E; --pl-blue:#0B62C4; --pl-yellow:#EFBE12;
  --pl-green:#159652; --pl-white:#EDEAE2;
  /* Text sitting ON a lit plate cell. Red and blue are dark enough to need
     chalk (ink on them is 3.2:1); yellow, green and white need ink. */
  --on-plate-deep:var(--t0); --on-plate-bright:var(--ink);
  /* And the plate colours used AS text, which is a different job again: the
     red fill reads 3.0:1 as type on a panel. Lightened until each clears AA
     on every surface it appears on. */
  --plt-red:#DC6679; --plt-blue:#508FD5; --plt-yellow:#EFBE12;
  --plt-green:#289E60; --plt-white:#EDEAE2;

  /* -- type scale: nine steps, each with a job -------------- */
  --f7:10px;             /* micro mono \u2014 lattice cells, stamps */
  --f6:11px;             /* small mono \u2014 tags, metadata */
  --f5:12px;             /* caption \u2014 cues, descriptions */
  --f4:13px;             /* body-small \u2014 prose, notes */
  --f3:15px;             /* body \u2014 default */
  --f-input:16px;        /* never lower: under 16px iOS zooms the page on focus */
  --f2:17px;             /* card heading */
  --f1:20px;             /* panel / section heading */
  --fx:22px;             /* exercise name \u2014 the loudest thing on a slot */
  --f0:clamp(30px,8.5vw,40px);  /* masthead, fluid instead of a breakpoint jump */

  /* -- spacing: 4px base ------------------------------------ */
  --x0:2px; --x1:4px; --x2:8px; --x3:12px; --x4:16px;
  --x5:24px; --x6:32px; --x7:48px;

  /* -- tap targets ------------------------------------------ */
  --tap:44px;            /* Apple's floor */
  --tap-lg:48px;         /* Android's floor \u2014 primary actions */

  /* -- depth: square-cornered, so depth comes from a top
        highlight and a cast shadow, never a radius --------- */
  --e1:inset 0 1px 0 rgba(255,255,255,.045);
  --e2:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.7);

  /* -- motion ----------------------------------------------- */
  --fast:.12s; --med:.2s; --ease:cubic-bezier(.2,.7,.3,1);

  /* -- families --------------------------------------------- */
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --code:'IBM Plex Mono',ui-monospace,monospace;

  background:var(--s0); color:var(--t0);
  min-height:100vh; min-height:100dvh;
  font-family:var(--sans); font-size:var(--f3); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
}

/* Light theme is a token swap and nothing else. It exists now so the
   token set is provably complete \u2014 any raw hex left behind shows up
   immediately in daylight. The toggle that selects it comes later. */
.cs-root[data-theme="light"]{
  --s0:#F7F6F3; --s1:#FFFFFF; --s2:#EFEDE8; --s3:#E4E1DA; --s-sunk:#FFFFFF;
  --line:#D6D2C9; --line-soft:#E6E3DC; --line-hi:#A9A49A;
  --t0:#17191C; --t1:#3A4047; --t2:#5E666F; --t3:#666C74;
  --red:#A80D26; --red-soft:#8A3A2E;
  /* Darkened from #8A6A09, which cleared AA on white but not on the raised
     surface the active tab uses. An accent has to meet the bar on every
     surface it lands on, not the lightest one. */
  --yellow:#7C5F08; --yellow-edge:#D8CBA4; --yellow-bg:#FBF6E4;
  --yellow-txt:#6B5411; --yellow-line:#C2AE6A;
  --green:#0E6E3C; --green-edge:#AFCCBC; --green-bg:#EFF6F1;
  --green-txt:#2C6A4C; --green-hi:#1C5038;
  --ink:#FFFFFF;
  --stab:rgba(23,25,28,.42); --stab-soft:rgba(23,25,28,.38); --dash:rgba(23,25,28,.5);
  --pl-red:#A80D26; --pl-blue:#0A4F9E; --pl-yellow:#8A6A09;
  --pl-green:#0E6E3C; --pl-white:#6B7280;
  /* In daylight every plate fill is a dark colour, so white clears AA on all
     five (4.8\u20138.0:1) and the split collapses. */
  --on-plate-deep:#FFFFFF; --on-plate-bright:#FFFFFF;
  --red-txt:#A80D26;
  --plt-red:#A80D26; --plt-blue:#0A4F9E; --plt-yellow:#846609;
  --plt-green:#0E6E3C; --plt-white:#646A77;
  --e1:inset 0 1px 0 rgba(255,255,255,.7);
  --e2:0 1px 2px rgba(16,20,24,.07), 0 10px 28px -16px rgba(16,20,24,.22);
}

.cs-root *{box-sizing:border-box}
.wrap{max-width:880px;margin:0 auto;padding:0 var(--x4) 120px}

.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.045em;font-weight:600;line-height:1.05}
.mono{font-family:var(--code);font-variant-numeric:tabular-nums}

/* ---- tap floor -------------------------------------------------
   Every control reaches 44px. Two techniques, chosen per control:

   .tapfloor   grows the control itself. Used wherever the control
               owns its line or sits in a wrapping row, so growing
               it is free apart from height.

   .tapinline  holds the visual size and pushes the HIT BOX out
               with padding that negative margin cancels. Used only
               for links inside running prose, where a 44px tall
               box would wreck the line height. Safe only because
               these appear singly in a paragraph \u2014 in a tight
               stack the boxes would overlap and steal each other's
               taps, which is why the dense lists grow instead.
   ---------------------------------------------------------------- */
.tapfloor{min-height:var(--tap);display:inline-flex;align-items:center;gap:var(--x2)}
.tapinline{padding-top:14px;padding-bottom:14px;margin-top:-14px;margin-bottom:-14px}
.cs-root button,.cs-root a,.cs-root input,.cs-root label{touch-action:manipulation}

/* Hover only where a pointer exists. Unguarded :hover sticks after a
   tap on a touch screen, so a tapped chip stayed lit until you tapped
   something else. :active is what a finger should get. */
@media (hover:hover) and (pointer:fine){
  .chip:hover{border-color:var(--line-hi);color:var(--t0)}
  .opt:hover{border-color:var(--line-hi)}
  .btn.ghost:hover{color:var(--t0);border-color:var(--line-hi)}
  .swap:hover{color:var(--t0);border-color:var(--line-hi)}
  .swap.q:hover{border-color:var(--yellow);color:var(--yellow)}
  .exlink:hover{text-decoration-color:var(--yellow);color:var(--t0)}
  .lib a:hover{border-color:var(--yellow)}
  .foldhd:hover .foldval{color:var(--t2)}
  .whytoggle:hover{color:var(--t2);border-left-color:var(--green-edge)}
  .mmbtn:hover{border-color:var(--line-hi);color:var(--t1)}
  .bwbtn:hover{border-color:var(--line-hi)}
  .preset:hover{border-color:var(--yellow-line)}
}
.chip:active,.opt:active,.swap:active,.mmbtn:active,.bwbtn:active,
.preset:active,.rail button:active,.foldhd:active,.btn:active{
  transform:translateY(1px)}
.btn:active{filter:brightness(.93)}

/* One focus ring, everywhere, so keyboard and switch control can see
   where they are. Eleven controls had none at all. */
.cs-root :focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.cs-root input:focus-visible,.libsearch:focus-visible{outline-offset:-2px}

/* ---- masthead -------------------------------------------------- */
.mast{padding:var(--x5) 0 var(--x3);border-bottom:1px solid var(--line);margin-bottom:var(--x4)}
.mast h1{margin:0;font-size:var(--f0)}
.mast .sub{color:var(--t2);font-size:var(--f4);margin-top:var(--x1);max-width:54ch}
.stamp{display:inline-block;border:1px solid var(--line);padding:var(--x0) var(--x2);
  font-size:var(--f7);letter-spacing:.16em;color:var(--t3);margin-bottom:var(--x2)}

.mastrow{display:flex;justify-content:space-between;align-items:center;gap:var(--x3)}
.mastrow .stamp{margin-bottom:0}
.themebtn{display:inline-flex;align-items:center;gap:var(--x2);background:none;
  border:1px solid var(--line);color:var(--t2);font-family:var(--code);font-size:var(--f6);
  letter-spacing:.08em;text-transform:uppercase;padding:0 var(--x3);min-height:var(--tap);
  cursor:pointer;white-space:nowrap;flex:0 0 auto}

/* ---- tab rail -------------------------------------------------- */
.rail{display:flex;gap:var(--x0);overflow-x:auto;margin-bottom:var(--x4);padding-bottom:var(--x0);
  scrollbar-width:none;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-bottom:2px solid var(--line);
  color:var(--t3);padding:0 var(--x3);min-height:var(--tap);font-size:var(--f6);cursor:pointer;
  white-space:nowrap;scroll-snap-align:start;transition:color var(--fast),background var(--fast)}
.rail button .n{font-family:var(--code);margin-right:var(--x1);color:var(--t3)}
.rail button.done{color:var(--t2);border-bottom-color:var(--t3)}
.rail button.on{color:var(--t0);background:var(--s2);border-bottom-color:var(--yellow);box-shadow:var(--e1)}
.rail button.on .n{color:var(--yellow)}
.railcut{display:inline-block;flex:0 0 auto;align-self:stretch;width:1px;margin:0 var(--x2);
  background:linear-gradient(to bottom,transparent,var(--red) 22%,var(--red) 78%,transparent)}
.rail .notneeded{opacity:.34}
.railnote{font-size:var(--f4);line-height:1.55;color:var(--t2);border-left:2px solid var(--line);
  padding:var(--x0) 0 var(--x0) var(--x3);margin:0 0 var(--x3)}

/* ---- panels ---------------------------------------------------- */
.panel{border:1px solid var(--line);background:var(--s1);margin-bottom:var(--x3);box-shadow:var(--e2)}
/* Title and aside both wrapped mid-word fighting for 311px \u2014 every one of the
   seven panels rendered its heading as two ragged lines. Wrapping the flex
   line instead drops the aside cleanly onto its own row only when it has to. */
.panel > h2{margin:0;font-size:var(--f1);padding:var(--x3) var(--x4);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 var(--x3)}
.panel > h2 .aside{margin-left:auto}
.panel > h2 .aside{font-size:var(--f6);letter-spacing:.1em;color:var(--t3);font-family:var(--code);text-transform:none}
.body{padding:var(--x4)}
.lede{color:var(--t2);font-size:var(--f4);margin:0 0 var(--x4)}
.klabel{display:block;font-size:var(--f6);letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:var(--x2)}
/* The .aside spans were already in the markup; only the panel heading styled
   them, so inside a label they inherited 11px uppercase at .14em tracking \u2014
   "optional \u2014 the builder routes around it" set as though it were a heading. */
.klabel .aside{text-transform:none;letter-spacing:.01em;color:var(--t3);font-size:var(--f5)}
.secthead{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:var(--f4);
  color:var(--t3);border-bottom:1px solid var(--line);padding:var(--x4) 0 var(--x2);margin-bottom:var(--x0)}
.divider{display:flex;align-items:center;gap:var(--x3);margin:var(--x4) 0 var(--x3)}
.divider .ln{flex:1;height:1px;background:var(--line)}
.divider .lb{font-family:var(--code);font-size:var(--f7);letter-spacing:.18em;text-transform:uppercase;color:var(--t3)}

/* ---- inputs ---------------------------------------------------- */
label.fld{display:block;margin-bottom:var(--x3)}
label.fld .k{display:block;font-size:var(--f6);letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:var(--x1)}
input[type=number],input[type=text]{width:100%;background:var(--s-sunk);border:1px solid var(--line);color:var(--t0);
  padding:0 var(--x3);min-height:var(--tap);font-family:var(--code);font-size:var(--f-input);border-radius:0}
input:focus{outline:2px solid var(--yellow);outline-offset:-2px}
input[type=text]::placeholder{color:var(--t3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--x3)}
.libsearch{width:100%;background:var(--s-sunk);border:1px solid var(--line);color:var(--t0);font-family:inherit;
  font-size:var(--f-input);padding:0 var(--x3);min-height:var(--tap);margin-bottom:var(--x3);outline:none}
.libsearch:focus{border-color:var(--line-hi)}
.libsearch::placeholder{color:var(--t3)}
.optin{display:flex;gap:var(--x3);align-items:flex-start;font-size:var(--f4);color:var(--t2);
  border:1px solid var(--line);background:var(--s-sunk);padding:var(--x3);margin:var(--x3) 0;cursor:pointer;min-height:var(--tap)}
.optin input{margin-top:var(--x0);accent-color:var(--yellow);width:22px;height:22px;flex:0 0 auto}
.optin span{line-height:1.45}

/* ---- chips and options ----------------------------------------- */
/* Content-sized chips in a flex wrap produced a ragged wall: the emphasis
   selector was 22 chips in 18 rows, nearly one per row and about 940px of
   scroll for a single choice, with every row a different length. A grid lays
   them on a common measure. Two densities, because the groups are two kinds:
   long option names (quality, emphasis, equipment) want a readable column,
   short tokens (durations, body regions) want four across. */
/* 132px, not 140: the Focus panel's chip containers are 281px wide, and
   auto-fill fits two columns only when 2*min + gap <= 281. At 140 it missed
   by seven pixels and dropped to a SINGLE column, turning a 18-row selector
   into a 22-row one. Measured, not guessed. */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:var(--x2);align-items:stretch}
.chips.narrow{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
/* Short uniform tokens: centred, and never broken across two lines. "10 min"
   needs 47px of mono and had exactly 47 after the default padding, so every
   duration chip was wrapping onto a second line by a hair. */
.chips.narrow .chip{padding:var(--x2);justify-content:center;text-align:center;white-space:nowrap}
.chip{background:var(--s-sunk);border:1px solid var(--line);color:var(--t2);padding:var(--x2) var(--x3);
  font-size:var(--f4);cursor:pointer;text-align:left;min-height:var(--tap);display:flex;
  align-items:center;flex-wrap:wrap;gap:0 var(--x2);line-height:1.25;
  transition:border-color var(--fast),color var(--fast)}
.chip.on{background:var(--s2);border-color:var(--t0);color:var(--t0);box-shadow:var(--e1)}
.chip .pc{font-family:var(--code);font-size:var(--f6);margin-left:auto;color:var(--t3)}
.chip.sm{padding:var(--x1) var(--x3);font-size:var(--f5);min-height:var(--tap)}
.opt{display:flex;flex-direction:column;justify-content:center;width:100%;text-align:left;
  background:var(--s-sunk);border:1px solid var(--line);color:var(--t0);padding:var(--x3);
  margin-bottom:var(--x2);cursor:pointer;min-height:var(--tap);transition:border-color var(--fast)}
.opt.on{border-color:var(--t0);background:var(--s2);box-shadow:var(--e1)}
.opt .t{font-size:var(--f3)}
.opt .d{font-size:var(--f5);color:var(--t2);margin-top:var(--x0)}
.opt .tag{float:right;font-family:var(--code);font-size:var(--f6);color:var(--t2)}
.optwrap{display:flex;flex-direction:column}
.optwrap .opt{width:100%}
.optwrap>.mmbtn{align-self:flex-start;margin:var(--x2) 0 var(--x0)}

/* ---- buttons --------------------------------------------------- */
.btn{background:var(--yellow);color:var(--ink);border:none;padding:0 var(--x5);min-height:var(--tap-lg);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-size:var(--f2);font-weight:600;
  cursor:pointer;width:100%;transition:filter var(--fast)}
.btn:disabled{background:var(--line);color:var(--t3);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--t2);border:1px solid var(--line)}
.btn.ghost.sm{padding:0 var(--x3);font-size:var(--f5);min-height:var(--tap)}
/* A flex item will not shrink below its own min-content width, so a row of
   three buttons simply ran off the side of the phone once Layer 1 widened
   the padding \u2014 "Log session" was sitting entirely off-screen at x=376.
   Wrapping is the safety net; the narrower in-row padding is what makes
   three fit on one line in the first place. */
.btnrow{display:flex;flex-wrap:wrap;gap:var(--x2);margin-top:var(--x4)}
.btnrow .btn{flex:1 1 auto;width:auto;min-width:0;padding:0 var(--x3)}
.swap{background:transparent;border:1px solid var(--line);color:var(--t2);font-size:var(--f6);
  padding:0 var(--x3);min-height:var(--tap);cursor:pointer;font-family:var(--code);white-space:nowrap;
  display:inline-flex;align-items:center;transition:color var(--fast),border-color var(--fast)}
.swap.q{color:var(--yellow);border-color:var(--yellow-edge)}
.swap.join{color:var(--green-txt);border-color:var(--green-edge)}
.swap.spent{opacity:.4;cursor:default}
.hdtools{display:flex;flex-wrap:wrap;gap:var(--x2);align-items:center}
.mmbtn{background:none;border:1px solid var(--line);color:var(--t2);border-radius:999px;font:inherit;
  font-size:var(--f5);padding:0 var(--x3);min-height:var(--tap);margin-top:var(--x2);cursor:pointer;
  display:inline-flex;align-items:center;transition:color var(--fast),border-color var(--fast)}
.mmbtn.on{border-color:var(--red);color:var(--t0)}
.bwbtn{display:inline-flex;align-items:center;gap:var(--x2);background:none;border:1px solid var(--line);
  color:var(--t2);font-family:var(--code);font-size:var(--f5);padding:0 var(--x3);min-height:var(--tap);
  cursor:pointer;white-space:nowrap}
.bwbtn.on{color:var(--green-txt);border-color:var(--green-edge)}
.bwbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--line-hi)}
.bwbtn.on .dot{background:var(--green-txt)}
.preset{display:inline-flex;align-items:center;gap:var(--x2);background:var(--yellow-bg);
  border:1px solid var(--yellow-edge);color:var(--yellow-txt);font-family:var(--code);font-size:var(--f5);
  padding:0 var(--x3);min-height:var(--tap);margin:0 var(--x2) var(--x2) 0;cursor:pointer}
.preset.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:500}
.preset .pc{font-size:var(--f7);opacity:.7}
.sizer{display:inline-flex;align-items:center;gap:var(--x1);border:1px solid var(--line);
  padding:0 var(--x1);margin-right:var(--x2);min-height:var(--tap)}
.sizer button{background:none;border:none;color:var(--t2);font-size:var(--f2);line-height:1;
  min-width:var(--tap);min-height:var(--tap);cursor:pointer;font-family:inherit}
.sizer button:disabled{opacity:.25;cursor:default}
.sizer .lbl{font-family:var(--code);font-size:var(--f6);color:var(--t3);min-width:52px;text-align:center}

/* Links inside running prose \u2014 hit box out, visual size held. */
.linkname{background:none;border:none;color:var(--t0);font:inherit;font-weight:500;cursor:pointer;
  text-align:left;text-decoration:underline;text-decoration-color:var(--line-hi);
  padding:15px 2px;margin:-15px 0}
.bwlink{background:none;border:none;color:var(--yellow);font:inherit;font-size:var(--f4);
  cursor:pointer;text-decoration:underline;padding:15px 2px;margin:-15px 0}
.whytoggle{background:none;border:0;border-left:2px solid var(--line);color:var(--t3);font:inherit;
  font-size:var(--f5);letter-spacing:.02em;padding:13px 0 13px var(--x2);margin-top:var(--x2);
  cursor:pointer;text-align:left;display:block;min-height:var(--tap)}
/* The underline belongs to the TEXT, not the box. As a border-bottom it was
   drawn at the foot of the padding the tap target needs \u2014 8px clear of the
   glyphs \u2014 and the negative bottom margin then pulled the pattern line up
   into it, striking it through. text-decoration tracks the words instead,
   so the hit box can be any height without the rule moving. */
.exlink{background:none;border:none;padding:10px 0;margin:-10px 0 var(--x1);cursor:pointer;
  color:inherit;text-align:left;font:inherit;display:inline-block;max-width:100%;
  text-decoration:underline dotted;text-decoration-color:var(--t3);
  text-underline-offset:5px;text-decoration-thickness:1px;min-height:var(--tap)}

/* ---- session slots --------------------------------------------- */
.slot{border:1px solid var(--line);border-left:3px solid var(--line);background:var(--s1);
  margin-bottom:var(--x2);box-shadow:var(--e2)}
.slot .hd{display:flex;justify-content:space-between;align-items:center;gap:var(--x3);
  padding:var(--x2) var(--x3);border-bottom:1px solid var(--line);flex-wrap:wrap}
.slot .role{font-size:var(--f7);letter-spacing:.16em;text-transform:uppercase;color:var(--t2);font-family:var(--code)}
.slot .bd{padding:var(--x3)}
.slot .ex{font-family:var(--disp);text-transform:uppercase;font-size:var(--fx);letter-spacing:.03em;line-height:1.1}
.slot.corner{border-left-width:5px}
.slot.paired{background:var(--green-bg)}
.rx{display:flex;flex-wrap:wrap;gap:var(--x4);margin-top:var(--x2)}
.rx div{min-width:58px}
.rx .k{font-size:var(--f7);letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.rx .v{font-family:var(--code);font-size:var(--f3);margin-top:var(--x0)}
.cue{font-size:var(--f5);color:var(--t2);margin-top:var(--x2);padding-top:var(--x2);border-top:1px dashed var(--line)}
.blockcard{border:1px solid var(--line);border-left:3px solid var(--line);background:var(--s-sunk);
  padding:var(--x3);margin-bottom:var(--x3)}
.blockcard .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--x3)}
.blockcard .bt{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:var(--f4)}
.explain{font-size:var(--f5);color:var(--t2);border-left:2px solid var(--line);padding-left:var(--x2);margin:var(--x2) 0 var(--x3)}
.blockhead{display:flex;align-items:baseline;gap:var(--x3);margin:var(--x5) 0 var(--x2);
  padding-bottom:var(--x2);border-bottom:1px solid var(--line)}
.blockhead .bn{font-family:var(--disp);font-size:var(--f1);font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;color:var(--t0)}
.blockhead .bm{font-family:var(--code);font-size:var(--f6);color:var(--t3)}
.detailbar{display:flex;gap:var(--x2);align-items:center;margin:0 0 var(--x3)}

.adjust{background:none;border:1px solid var(--line-soft);color:var(--t3);font-family:var(--code);
  font-size:var(--f6);letter-spacing:.04em;padding:0 var(--x2);
  min-height:var(--tap);cursor:pointer;flex:0 0 auto;white-space:nowrap}
.adjust.on{color:var(--yellow);border-color:var(--yellow-edge)}
.toolrow{display:flex;flex-wrap:wrap;gap:var(--x2);align-items:center;
  margin:var(--x3) 0;padding:var(--x3) 0;border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft)}
.slot .hd .gtag{margin-left:var(--x2)}
.ex .exn{font-family:var(--code);font-size:var(--f5);letter-spacing:0;
  text-transform:none;color:var(--t3)}

/* The two tiers of prescription. Primary is what you read from arm's length
   with a bar in your hands; secondary is what you check once while setting up. */
.rx.prim{display:flex;flex-wrap:wrap;gap:var(--x4) var(--x5);margin-top:var(--x3)}
.rx.prim div{min-width:auto}
.rx.prim .k{font-size:var(--f7);letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.rx.prim .v{font-family:var(--code);font-size:var(--f1);line-height:1.1;margin-top:var(--x1);color:var(--t0)}
.rx.sec{display:flex;flex-wrap:wrap;gap:var(--x1) var(--x3);margin-top:var(--x3);
  padding-top:var(--x2);border-top:1px dashed var(--line-soft)}
.rx.sec div{display:inline-flex;align-items:baseline;gap:var(--x1);min-width:auto}
.rx.sec .k{font-size:var(--f7);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.rx.sec .v{font-family:var(--code);font-size:var(--f5);color:var(--t2);margin-top:0}

/* ---- folds ----------------------------------------------------- */
.foldhd{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;
  border:0;border-top:1px solid var(--line-soft);padding:var(--x2) 0;margin-top:var(--x1);
  min-height:var(--tap);cursor:pointer;text-align:left;font:inherit}
.foldlabel{font-family:var(--disp);font-size:var(--f5);letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.foldval{font-family:var(--code);font-size:var(--f6);color:var(--t3);max-width:58%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldbody{padding-bottom:var(--x2)}

/* ---- notes, flags, tolerances ---------------------------------- */
.note{border:1px solid var(--line);border-left:3px solid var(--yellow);background:var(--s1);
  padding:var(--x3);font-size:var(--f4);color:var(--t2);margin-bottom:var(--x3)}
.note b{color:var(--t0);font-weight:600}
.warn{border-left-color:var(--red)}
.ok{border-left-color:var(--green)}
.honest{border-left:2px solid var(--line-hi);padding:var(--x2) 0 var(--x2) var(--x3);margin-top:var(--x3);
  font-size:var(--f4);color:var(--t2);line-height:1.6}
.tolerance{border-left:2px solid var(--yellow-line);background:var(--yellow-bg);padding:var(--x2) var(--x3);
  margin-top:var(--x3);font-size:var(--f4);color:var(--yellow-txt);line-height:1.6}
.redflag{border-left:2px solid var(--red-soft);padding:var(--x2) 0 var(--x2) var(--x3);margin-top:var(--x3);
  font-size:var(--f4);color:var(--t2);line-height:1.6}
.flagcard{border:1px solid var(--line);background:var(--s1);padding:var(--x3) var(--x4);margin:var(--x2) 0}
.flagcard .fh{font-family:var(--disp);font-size:var(--f2);font-weight:600;text-transform:uppercase;
  letter-spacing:.01em;margin-bottom:var(--x2);color:var(--t0)}
.flagask{border:1px solid var(--yellow-edge);background:var(--yellow-bg);padding:var(--x3);
  margin-bottom:var(--x3);font-size:var(--f4);color:var(--yellow-txt);display:flex;flex-wrap:wrap;
  gap:var(--x2);align-items:center}
.flagchip{display:inline-block;border:1px solid var(--yellow-line);color:var(--yellow);background:var(--yellow-bg);
  font-family:var(--code);font-size:var(--f6);padding:var(--x0) var(--x2);margin:0 var(--x2) var(--x2) 0}
.pairnote{border-left:2px solid var(--green-edge);background:var(--green-bg);padding:var(--x2) var(--x3);
  margin-top:var(--x2);font-size:var(--f4);color:var(--green-txt);line-height:1.55}
.pairnote b{color:var(--green-hi)}
.carrybox{margin:var(--x3) 0 var(--x1);padding:var(--x3);border:1px solid var(--line);background:var(--s1)}
.carryd{font-size:var(--f4);color:var(--t2);line-height:1.55}
.carryflag{border-left:2px solid var(--yellow-line);background:var(--yellow-bg);padding:var(--x2) var(--x3);
  margin-top:var(--x2);font-size:var(--f4);color:var(--yellow-txt);line-height:1.55}
.cornertag{font-family:var(--code);font-size:var(--f7);color:var(--yellow);border:1px solid var(--yellow-line);
  padding:1px var(--x2);margin-left:var(--x2);white-space:nowrap}
.gtag{font-family:var(--code);font-size:var(--f7);color:var(--green-txt);border:1px solid var(--green-edge);
  background:var(--green-bg);padding:var(--x0) var(--x2);white-space:nowrap}
.bwtag{display:inline-block;font-family:var(--code);font-size:var(--f6);color:var(--green-txt);
  border:1px solid var(--green-edge);background:var(--green-bg);padding:var(--x0) var(--x2);margin:var(--x2) 0 0}
.aside-panel{border-style:dashed;border-color:var(--line-hi);background:var(--s-sunk);position:relative}
.notpart{position:absolute;top:-9px;left:var(--x4);background:var(--s0);color:var(--t3);
  font-family:var(--code);font-size:var(--f6);letter-spacing:.06em;padding:0 var(--x2)}

/* ---- readouts, ledgers, lattice -------------------------------- */
/* A grid leaves empty tracks whenever the item count does not divide by the
   column count \u2014 four readouts in three columns left a cell-shaped hole next
   to the last one, which reads as something that failed to load. Flex items
   that grow have no such thing as an empty track: the last row just shares
   the width out. The 1px gap over the container's own background draws the
   rules, so there is nothing to paint where no cell exists. */
.readout{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:var(--x3)}
.readout > div{background:var(--s1);padding:var(--x2) var(--x3);flex:1 1 96px;min-width:96px}
.readout .k{font-size:var(--f7);letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.readout .v{font-family:var(--code);font-size:var(--f2);margin-top:var(--x0)}
.ledger{display:flex;flex-wrap:wrap;gap:var(--x1)}
.led{font-family:var(--code);font-size:var(--f6);border:1px solid var(--line);padding:var(--x1) var(--x2);color:var(--t3)}
.led.stale{border-color:var(--red);color:var(--red-txt)}
.led.fresh{border-color:var(--green);color:var(--green)}
.lat{border:1px solid var(--line);background:var(--s1);margin-bottom:var(--x3)}
.latscroll{overflow-x:auto;overscroll-behavior-x:contain}
.latinner{min-width:540px;padding:var(--x3) var(--x4) var(--x4)}
.latrow{display:flex;align-items:stretch;margin-bottom:var(--x0)}
.latkey{flex:0 0 62px;font-size:var(--f7);letter-spacing:.12em;text-transform:uppercase;color:var(--t3);
  display:flex;align-items:center;font-family:var(--code);background:none;border:0;padding:0;
  text-align:left;cursor:pointer;min-height:var(--tap)}
.latkey.on{color:var(--yellow)}
.latfelt{padding:var(--x3) var(--x4) 0}
.latfelt .lf{display:flex;gap:var(--x2);align-items:baseline;margin-bottom:var(--x2)}
.latfelt .lfk{font-size:var(--f6);flex:0 0 auto;letter-spacing:.04em}
.latfelt .lfv{font-size:var(--f4);line-height:1.5;color:var(--t1)}
.latwhat{margin:0 var(--x4) var(--x3);padding:var(--x3);border-left:2px solid var(--yellow-line);
  background:var(--yellow-bg);font-size:var(--f4);line-height:1.55;color:var(--yellow-txt)}
.latwhat b{color:var(--t0)}
.latfoot{display:flex;flex-wrap:wrap;gap:var(--x2) var(--x3);align-items:center;
  padding:0 var(--x4) var(--x3)}
.latfh{font-size:var(--f7);color:var(--t3);letter-spacing:.06em}
.lattrack{flex:1;display:flex;gap:var(--x0)}
.latcell{flex:1;font-family:var(--code);font-size:var(--f7);padding:var(--x1);text-align:center;
  color:var(--t2);background:var(--s-sunk);border-top:2px solid transparent;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.latcell.hot{font-weight:600}
.latcell.hot2{outline:1px dashed var(--dash);outline-offset:-2px}
.latcap{display:flex;justify-content:space-between;gap:var(--x2);font-size:var(--f7);color:var(--t3);
  font-family:var(--code);margin-top:var(--x2);padding-top:var(--x2);border-top:1px solid var(--line)}

/* ---- ramps, rungs, primers ------------------------------------- */
.ramp{margin:var(--x3) 0 var(--x1);padding:var(--x3);border:1px solid var(--line);background:var(--s1)}
.rampline{display:flex;flex-wrap:wrap;gap:var(--x2);align-items:center}
.rampstep{font-family:var(--code);font-size:var(--f5);color:var(--t2);background:var(--s-sunk);
  border:1px solid var(--line);padding:var(--x1) var(--x2);white-space:nowrap}
.rampstep b{color:var(--t0);font-weight:500}
.rampstep.work{color:var(--yellow);border-color:var(--yellow-line)}
.rung{margin:var(--x3) 0 var(--x1);padding:var(--x3);border:1px solid var(--line);background:var(--s1)}
.rungline{display:flex;flex-wrap:wrap;gap:var(--x1);margin-bottom:var(--x2)}
.rungstep{font-family:var(--code);font-size:var(--f6);color:var(--t3);border:1px solid var(--line);
  padding:var(--x0) var(--x2);white-space:nowrap}
.rungstep.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow);font-weight:500}
.rungrx{font-size:var(--f4);color:var(--t1);line-height:1.55}
.rungrx b{color:var(--t0)}
.rungprog{font-size:var(--f4);color:var(--t2);margin-top:var(--x1);line-height:1.55}
.rungnote{font-size:var(--f4);color:var(--yellow-txt);margin-top:var(--x2);border-left:2px solid var(--yellow-line);
  padding-left:var(--x2);line-height:1.55}
.primelist{margin:var(--x3) 0 var(--x1);display:flex;flex-direction:column;gap:var(--x2)}
.primeitem{border-left:2px solid var(--line);padding-left:var(--x3)}
.primeitem .n{display:block;font-size:var(--f4);color:var(--t0);font-weight:500}
.primeitem .d{display:block;font-size:var(--f4);color:var(--t2);line-height:1.55;margin-top:var(--x0)}
.restore{margin-top:var(--x4)}
.restore .ri{border-left:2px solid var(--line);padding:var(--x2) 0 var(--x2) var(--x3);margin-bottom:var(--x3)}
.restore .rn{font-size:var(--f3);color:var(--t0);font-weight:500}
.restore .rx{font-family:var(--code);font-size:var(--f4);color:var(--yellow);margin:var(--x0) 0}
.restore .rd{font-size:var(--f4);color:var(--t2);line-height:1.55}

/* ---- template blocks ------------------------------------------- */
.tblock{border:1px solid var(--line);background:var(--s1);padding:var(--x3) var(--x4);margin-bottom:var(--x3)}
.tbh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--x3);margin-bottom:var(--x0)}
.tbn{font-family:var(--disp);font-size:var(--f2);font-weight:600;text-transform:uppercase;color:var(--t0)}
.tbs{font-family:var(--code);font-size:var(--f7);color:var(--t3);white-space:nowrap}
.tbd{font-size:var(--f5);color:var(--t3);line-height:1.5;margin-bottom:var(--x2)}
.twork{display:flex;justify-content:space-between;gap:var(--x3);align-items:baseline;padding:var(--x1) 0;
  border-top:1px solid var(--line-soft);font-size:var(--f4);color:var(--t1)}
.twork.fill{color:var(--green-txt);padding-left:var(--x3);border-left:2px solid var(--green-edge)}
.twork .tc{font-family:var(--code);font-size:var(--f6);color:var(--yellow);white-space:nowrap}
.shortmove{border-left:2px solid var(--line);padding:var(--x2) 0 var(--x2) var(--x3);margin-bottom:var(--x3)}
.sm-n{font-size:var(--f3);color:var(--t0);font-weight:500;display:flex;gap:var(--x2);align-items:baseline}
.sm-i{font-family:var(--code);font-size:var(--f6);color:var(--yellow);min-width:14px}
.sm-d{font-size:var(--f4);color:var(--t2);line-height:1.55;margin-top:var(--x0)}

/* ---- equipment ------------------------------------------------- */
.eqgroup{margin-bottom:var(--x3)}
.eqhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--x1);
  padding-bottom:var(--x0);border-bottom:1px solid var(--line-soft)}
.eqhead span:first-child{font-family:var(--code);font-size:var(--f6);color:var(--t3);
  letter-spacing:.06em;text-transform:uppercase}
.eqhead .eqn{font-family:var(--code);font-size:var(--f6);color:var(--t3)}
.bwtoggle{display:flex;flex-wrap:wrap;gap:var(--x3);align-items:center;margin:var(--x3) 0 var(--x1);
  padding:var(--x3);border:1px solid var(--line);background:var(--s1)}
.bwnote{font-size:var(--f4);color:var(--t2);line-height:1.55;flex:1;min-width:200px}

/* ---- library --------------------------------------------------- */
.lib{border-bottom:1px solid var(--line);padding:var(--x3) 0;scroll-margin-top:var(--x5)}
.lib:last-child{border-bottom:none}
.lib.target{background:var(--s2);border-left:3px solid var(--yellow);padding-left:var(--x3);margin-left:calc(var(--x3) * -1)}
.lib.target h3{color:var(--yellow)}
.lib .ln{display:flex;justify-content:space-between;align-items:baseline;gap:var(--x3)}
.lib h3{margin:0;font-family:var(--disp);text-transform:uppercase;font-size:var(--f1);letter-spacing:.03em;font-weight:600}
.lib .meta{font-family:var(--code);font-size:var(--f7);color:var(--t3);letter-spacing:.08em;
  text-transform:uppercase;margin-top:var(--x0)}
.lib p{margin:var(--x1) 0 0;font-size:var(--f4);color:var(--t2)}
.lib a{color:var(--yellow);font-family:var(--code);font-size:var(--f6);text-decoration:none;
  border:1px solid var(--line);padding:0 var(--x3);min-height:var(--tap);display:inline-flex;
  align-items:center;white-space:nowrap;flex:0 0 auto}
.backbar{display:flex;justify-content:space-between;align-items:center;gap:var(--x3);
  border:1px solid var(--line);border-left:3px solid var(--yellow);background:var(--s2);
  padding:var(--x3);margin-bottom:var(--x3)}
.backbar span{font-size:var(--f4);color:var(--t2)}
.backbar b{color:var(--t0)}
.princ{margin:0 0 var(--x3);padding-left:18px}
.princ li{font-size:var(--f4);color:var(--t2);line-height:1.6;margin-bottom:var(--x2)}

/* ---- muscle map ------------------------------------------------ */
.mm{display:block;width:100%;height:auto;border-radius:10px;background:var(--s0)}
.mm-body{fill:var(--s2)}
.mm-unlit{fill:var(--s3);stroke:var(--line);stroke-width:.7}
.mm-agonist{fill:var(--red);stroke:var(--red);stroke-width:.8}
.mm-synergist{fill:var(--red);fill-opacity:.42;stroke:var(--red);stroke-opacity:.75;stroke-width:.8}
.mm-stabilizer{fill:var(--s3);stroke:var(--t0);stroke-opacity:.45;stroke-width:.8}
.mm-hatch{fill:url(#mm-hatch)}
.mm-antagonist{fill:var(--s3);stroke:var(--t2);stroke-width:1.4;stroke-dasharray:3 2.4}
.mm-vl{fill:var(--t2);font:10px 'IBM Plex Sans',sans-serif}
.mm-block{margin-top:var(--x3)}
.mm-cap{font-size:var(--f5);color:var(--t2);margin-top:var(--x2);line-height:1.45}
.mm-roles{display:flex;flex-direction:column;gap:var(--x1);margin-top:var(--x3)}
.mm-row{display:grid;grid-template-columns:15px 84px 1fr;gap:var(--x2);align-items:start;
  font-size:var(--f4);line-height:1.4}
.mm-rk{color:var(--t2)}
.mm-rv{color:var(--t0)}
.mm-sw{width:15px;height:15px;border-radius:4px;display:inline-block;margin-top:1px}
.mm-sw-agonist{background:var(--red)}
.mm-sw-synergist{background:var(--red);opacity:.42;box-shadow:inset 0 0 0 1.5px var(--red)}
.mm-sw-stabilizer{background:repeating-linear-gradient(45deg,var(--stab) 0 1.5px,transparent 1.5px 3.4px);
  box-shadow:inset 0 0 0 1px var(--stab-soft)}
.mm-sw-antagonist{border:1.6px dashed var(--t2)}
.mm-deep{font-size:var(--f5);line-height:1.5;color:var(--t2);border-top:1px solid var(--line);
  margin-top:var(--x2);padding-top:var(--x2)}
.mm-deep b{color:var(--t0);font-weight:500}
.mm-none{font-size:var(--f4);color:var(--t2);margin-top:var(--x2);font-style:italic}
.mm-detail{font-size:var(--f4);line-height:1.55;color:var(--t2);border-top:1px solid var(--line);
  margin-top:var(--x2);padding-top:var(--x2)}
.mm-detail b{color:var(--t0);font-weight:500}
.mm-detail .princ{margin:var(--x2) 0 0;padding-left:18px}
.mm-detail .princ li{margin-bottom:var(--x1)}
.mm-tilewrap{display:grid;grid-template-columns:96px 1fr;gap:var(--x3);align-items:center;margin-top:var(--x2)}
.mm-tilefig .mm{border-radius:8px}
.mm-tiletxt{font-size:var(--f5);line-height:1.5;color:var(--t0)}
.mm-tiletxt .mm-rk{color:var(--t2);margin-right:var(--x1)}
.mm-tiledetail{color:var(--t2);margin-top:var(--x0);font-size:var(--f5);line-height:1.45}
.mm-drills{margin-top:var(--x3);border-top:1px solid var(--line);padding-top:var(--x2)}
.mm-drill{padding:var(--x1) 0}
.mm-drilln{font-size:var(--f4);color:var(--t1);margin-right:var(--x2)}
.mm-drill .mmbtn{margin-top:0}

.estfix{margin-top:var(--x2)}
.estbody{border-left:2px solid var(--yellow-line);background:var(--yellow-bg);padding:var(--x3);margin-top:var(--x2)}
.estnote{margin:0 0 var(--x3);font-size:var(--f4);line-height:1.55;color:var(--yellow-txt)}
.estrow{display:flex;flex-wrap:wrap;gap:var(--x2);align-items:center}
.estrow input{flex:0 0 120px;width:120px}
.recstack{font-family:var(--code);font-size:var(--f6);color:var(--t2);white-space:pre-wrap;
  margin:0;line-height:1.5;overflow-x:auto}

.carryled{border:1px solid var(--line);background:var(--s1);padding:var(--x3) var(--x4);margin-top:var(--x3)}
.clhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--x2)}
.clnum{font-size:var(--f3);color:var(--t0)}
.clbar{height:6px;background:var(--s-sunk);border:1px solid var(--line);margin-top:var(--x2)}
.clbar span{display:block;height:100%;background:var(--green)}
.clbar.near span{background:var(--yellow)}
.clbar.over span{background:var(--red)}
.clrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--x3);margin-top:var(--x3)}

/* ---- live session ---------------------------------------------
   A full-viewport takeover. Nothing from the sheet is on screen, because the
   point is that there is one thing to look at. */
.live{position:fixed;inset:0;z-index:70;background:var(--s0);display:flex;flex-direction:column;
  overscroll-behavior:contain}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:var(--x3);
  padding:max(var(--x2),env(safe-area-inset-top,0px)) var(--x4) var(--x2);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.livex{background:none;border:1px solid var(--line);color:var(--t2);font-family:var(--code);
  font-size:var(--f6);padding:0 var(--x3);min-height:var(--tap);cursor:pointer;white-space:nowrap}
.livecount{font-size:var(--f6);color:var(--t3);letter-spacing:.1em}
.livetime{font-size:var(--f4);color:var(--t2)}
.liveprog{height:3px;background:var(--line-soft);flex:0 0 auto}
.liveprog span{display:block;height:100%;background:var(--yellow);transition:width var(--med) var(--ease)}

.livebody{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:var(--x5) var(--x4) var(--x4)}
.liverole{font-size:var(--f7);letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
.liveex{font-size:clamp(26px,8vw,34px);margin-top:var(--x2);color:var(--t0)}
.livesetof{font-size:var(--f4);color:var(--yellow);margin-top:var(--x3);letter-spacing:.08em;
  text-transform:uppercase}
/* The two numbers you act on, at the size you can read them from arm's length
   with a loaded bar in your hands. Everything else on this screen is smaller
   than these on purpose. */
.livenums{display:flex;flex-wrap:wrap;gap:var(--x4) var(--x6);margin-top:var(--x4)}
.livenums .k{font-size:var(--f7);letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.livenums .v{font-family:var(--code);font-size:clamp(28px,9vw,38px);line-height:1.05;
  margin-top:var(--x1);color:var(--t0)}
.livesec{display:flex;flex-wrap:wrap;gap:var(--x1) var(--x3);margin-top:var(--x4);
  padding-top:var(--x3);border-top:1px dashed var(--line-soft)}
.livesec div{display:inline-flex;align-items:baseline;gap:var(--x1)}
.livesec .k{font-size:var(--f7);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.livesec .v{font-family:var(--code);font-size:var(--f5);color:var(--t2)}
.livenext{font-size:var(--f5);color:var(--t3);margin-top:var(--x5);padding-top:var(--x3);
  border-top:1px solid var(--line-soft);letter-spacing:.04em}

.livefoot{flex:0 0 auto;padding:var(--x3) var(--x4) max(var(--x4),env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--s1)}
.liverest{margin-bottom:var(--x3)}
.liverest .lrt{font-family:var(--code);font-size:clamp(30px,10vw,42px);line-height:1;color:var(--t0)}
.liverest .lrl{font-size:var(--f5);color:var(--t2);margin-top:var(--x1)}
.liverest .lrbar{height:3px;background:var(--line-soft);margin-top:var(--x2)}
.liverest .lrbar span{display:block;height:100%;background:var(--t3)}
.liverest.ready .lrt{color:var(--green-txt)}
.liverest.ready .lrbar span{background:var(--green)}
.liverest.over .lrt{color:var(--yellow)}
.liverest.over .lrbar span{background:var(--yellow)}
/* Where the prescription declines to give a number, so does the app. */
.liverest.judge .lrl{color:var(--t2);font-style:italic}
.liveblock{margin-top:var(--x4);padding-top:var(--x3);border-top:1px dashed var(--line-soft)}
.liveblock .lbt{font-family:var(--code);font-size:clamp(28px,9vw,38px);line-height:1;color:var(--t0)}
.liveblock .lbl{font-size:var(--f5);color:var(--t2);margin-top:var(--x1)}
.liveblock.done .lbt{color:var(--green-txt)}
.liveblock.done .lrbar span{background:var(--green)}
.livedone{min-height:60px;font-size:var(--f1)}
.liveminor{display:flex;flex-wrap:wrap;gap:var(--x2);margin-top:var(--x3)}
.liveminor .swap:disabled{opacity:.35;cursor:default}

/* ---- toast ----------------------------------------------------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--s2);color:var(--t0);border:1px solid var(--line);border-left:3px solid var(--green);
  padding:var(--x3) var(--x4);font-size:var(--f4);box-shadow:var(--e2);
  max-width:calc(100vw - 32px);text-align:center}
.toast.bad{border-left-color:var(--red)}

/* ---- motion ---------------------------------------------------- */
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastin var(--med) var(--ease)}
  .panel{animation:rise var(--med) var(--ease) both}
  /* Slots fade only. A generated session mounts eight at once, and eight
     things sliding up together reads as a glitch rather than a reveal. */
  .slot{animation:fade var(--fast) linear both}
}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(6px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:560px){
  .latcap{flex-direction:column;gap:var(--x0)}
  .grid2{gap:var(--x2)}
}

biases the chest; a vertical torso biases the triceps."},{i:"pushup",n:"Push-Up",p:"hpush",m:"calisthenics",e:[],d:"Closed-chain horizontal press with the body held in one rigid line from ear to ankle. Scapulae must be allowed to protract at the top, which the bench press does not permit."},{i:"ringpush",n:"Ring Push-Up",p:"hpush",m:"calisthenics",e:["rings"],d:"Push-up on unstable rings. The rotational freedom lets the shoulder find its own path and demands far more serratus and rotator cuff control than a floor push-up."},{i:"plyopush",n:"Plyometric Push-Up",p:"hpush",m:"power",e:[],c:1,d:"Push-up driven hard enough that the hands leave the floor. Trains rate of force development in the press pattern. Land with soft, unlocked elbows and reset between reps."},{i:"mbchest",n:"Med Ball Chest Pass",p:"hpush",m:"power",e:["medball"],c:1,d:"Two-handed med ball drive off the chest into a wall or partner. Because the ball leaves the hands there is no deceleration phase, so intent stays maximal all the way through."},{i:"bandpress",n:"Band Chest Press",p:"hpush",m:"band",e:["bands"],d:"Standing press against band tension anchored behind you. Resistance rises as you approach lockout, which matches the strength curve of the press and spares the shoulder at the bottom."},{i:"cablefly",n:"Cable Fly",p:"hpush",m:"strength",e:["cable"],d:"Single-joint pec isolation with the elbows held at a fixed soft angle. Constant cable tension keeps load on the muscle at end-range, where free weights unload."},{i:"ohp",n:"Standing Overhead Press",p:"vpush",m:"strength",e:["barbell"],r:"press",f:1,c:1,d:"Strict press from the front rack to overhead with no leg drive. Ribs stay down and glutes stay tight; the head moves through as the bar passes the forehead so the bar finishes over the mid-foot."},{i:"pushpress",n:"Push Press",p:"vpush",m:"power",e:["barbell"],r:"press",f:1.25,c:1,d:"Overhead press initiated with a short vertical dip and aggressive leg drive. The legs move the bar past the sticking point, allowing roughly 20\u201330% more load than a strict press."},{i:"dbshoulder",n:"Seated DB Shoulder Press",p:"vpush",m:"strength",e:["db","bench"],d:"Seated vertical press with dumbbells. Removing the legs and lower back isolates the deltoid and lets each shoulder press in its own plane. Load is per hand."},{i:"kbpress",n:"Single-Arm KB Press",p:"vpush",m:"strength",e:["kb"],u:1,d:"One-arm overhead press with the bell resting on the back of the forearm. The offset load turns it into an anti-lateral-flexion trunk exercise as much as a shoulder press."},{i:"landmine",n:"Half-Kneeling Landmine Press",p:"vpush",m:"strength",e:["barbell"],u:1,d:"Barbell in a landmine pressed from a half-kneeling stance. The arcing bar path sits between horizontal and vertical, which is friendlier to shoulders that do not tolerate true overhead work."},{i:"hspu",n:"Pike / Handstand Push-Up",p:"vpush",m:"calisthenics",e:[],d:"Inverted vertical press, feet elevated for the pike version or against a wall for the full version. Demands overhead range of motion and heavy trunk bracing before load is ever added."},{i:"mbslam",n:"Overhead Med Ball Throw",p:"vpush",m:"power",e:["medball"],c:1,d:"Ball taken overhead and thrown forward or down with full body extension. Trains the finish of an overhead press pattern with no braking demand."},{i:"bandohp",n:"Band Overhead Press",p:"vpush",m:"band",e:["bands"],d:"Overhead press against a band anchored under the feet. Accommodating resistance loads the lockout and lets you train the pattern with negligible joint compression."},{i:"bbrow",n:"Barbell Bent-Over Row",p:"hpull",m:"strength",e:["barbell"],r:"bench",f:.78,c:1,d:"Bar rowed to the lower ribs from a hinged torso held near 45\xB0. The hinge position is the limiting factor: when the back rounds or the torso rises, the set is over."},{i:"pendlay",n:"Pendlay Row",p:"hpull",m:"strength",e:["barbell"],r:"bench",f:.72,c:1,d:"Row from a dead stop on the floor with the torso parallel to the ground. Every rep restarts from zero velocity, which removes momentum and makes it a genuine concentric strength exercise."},{i:"dbrow",n:"Single-Arm DB Row",p:"hpull",m:"strength",e:["db","bench"],u:1,d:"One-arm row supported on a bench. The free range of motion allows full scapular protraction and retraction, and the unilateral load exposes side-to-side differences."},{i:"csrow",n:"Chest-Supported Row",p:"hpull",m:"strength",e:["db","bench"],d:"Row from an inclined bench with the chest supported. Removing the lower back from the equation makes this the safest way to accumulate pulling volume late in a session."},{i:"invrow",n:"Inverted Row",p:"hpull",m:"calisthenics",e:["rings"],d:"Bodyweight row hanging beneath rings or a bar with the body rigid. Load is adjusted by changing foot position. The most direct horizontal counterbalance to push-up volume."},{i:"cablerow",n:"Seated Cable Row",p:"hpull",m:"strength",e:["cable"],d:"Seated row with constant cable tension. The torso should stay quiet; the movement is scapular retraction followed by elbow flexion, not a repeated hinge."},{i:"facepull",n:"Face Pull",p:"hpull",m:"band",e:["bands"],d:"High rope or band pulled to the face with the elbows above the wrists, finishing in external rotation. Targets the lower trap, rear delt, and external rotators that pressing volume tends to outpace."},{i:"bandrow",n:"Band Row",p:"hpull",m:"band",e:["bands"],d:"Horizontal row against band tension. Load rises through the contraction, so the hardest point is full retraction, which is where most lifters are weakest."},{i:"pullup",n:"Weighted Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],c:1,d:"Pronated-grip pull from a full dead hang to chin over bar, with load added at the waist. Initiate by depressing the scapulae before the elbows bend."},{i:"chinup",n:"Chin-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"Supinated-grip vertical pull. More biceps involvement and a generally stronger position than the pull-up, which makes it the better choice when accumulating volume."},{i:"pulldown",n:"Lat Pulldown",p:"vpull",m:"strength",e:["cable"],d:"Machine vertical pull that allows sub-bodyweight loading and precise progression. Useful for high-rep lat work or for lifters who cannot yet perform pull-ups."},{i:"bandpd",n:"Band Lat Pulldown",p:"vpull",m:"band",e:["bands"],d:"Vertical pull against a band anchored overhead. Best used as scapular activation before pressing or pulling, or for pulling volume with no equipment."},{i:"backsquat",n:"Back Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:1,c:1,d:"Bar on the upper back, hips descending to at least parallel and driving back up. The bar stays over the mid-foot the whole time; where the torso angle sits depends on high-bar versus low-bar placement."},{i:"frontsquat",n:"Front Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.85,c:1,d:"Bar racked on the anterior deltoids with elbows high. The upright torso shifts demand toward the quads and upper back, and the rack position self-limits load once posture fails."},{i:"boxsquat",n:"Box Squat",p:"squat",m:"strength",e:["barbell","rack","box"],r:"squat",f:.95,c:1,d:"Squat to a controlled touch on a box, then drive up. The box standardizes depth and can be used to pause and kill the stretch reflex, training pure starting strength out of the hole."},{i:"goblet",n:"Goblet Squat",p:"squat",m:"strength",e:["kb"],d:"Squat holding a kettlebell at the chest. The front-loaded position acts as a counterweight that makes depth and an upright torso easier, which is why it teaches the pattern so well."},{i:"bwsquat",n:"Tempo Bodyweight Squat",p:"squat",m:"calisthenics",e:[],d:"Unloaded squat performed on a deliberate count, typically 3 seconds down with a pause at the bottom. Builds position and tissue tolerance without any spinal load."},{i:"jumpsquat",n:"Loaded Jump Squat",p:"squat",m:"power",e:["db"],c:1,d:"Countermovement jump holding light load, roughly 20\u201330% of squat max or a pair of moderate dumbbells. Trains the speed-strength end of the squat pattern; stop the set when jump height drops."},{i:"boxjump",n:"Box Jump",p:"squat",m:"power",e:["box"],c:1,d:"Maximal jump onto a box, then step down. Landing on the box removes the eccentric cost, so it develops concentric power with little soreness. Never jump down."},{i:"rfess",n:"Rear-Foot-Elevated Split Squat",p:"lunge",m:"strength",e:["db","bench"],u:1,c:1,d:"Split squat with the rear foot on a bench. Roughly 85% of the load goes through the front leg, making it the highest-yield unilateral knee-dominant exercise available."},{i:"stepup",n:"Loaded Step-Up",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Step onto a knee-height box driving through the lead heel with no push-off from the trailing leg. Directly transferable to sprinting and stair work."},{i:"deadlift",n:"Conventional Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:1,c:1,d:"Bar pulled from the floor to standing with hips and knees locking together. The bar stays in contact with the legs; the back angle set at the start should not change until the bar clears the knee."},{i:"trapbar",n:"Trap Bar Deadlift",p:"hinge",m:"strength",e:["traps"],r:"dead",f:1.05,c:1,d:"Deadlift with the load centred around the body in a hex bar. Shorter moment arm on the spine and more knee flexion make it easier to load heavily with less technical risk."},{i:"rdl",n:"Romanian Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.72,c:1,d:"Hinge from standing with soft knees, lowering under control until the hamstrings reach end range, then returning. The bar drags the thighs; the set ends when the low back starts to round."},{i:"dbrdl",n:"Dumbbell RDL",p:"hinge",m:"strength",e:["db"],d:"RDL with dumbbells, which allows the load to travel slightly outside the legs and reach a deeper stretch. A good way to keep hinging when grip or low back limits barbell volume."},{i:"hipthrust",n:"Barbell Hip Thrust",p:"hinge",m:"strength",e:["barbell","bench"],r:"dead",f:.8,c:1,d:"Shoulders on a bench, bar across the hips, driving to full hip extension. Peak tension occurs at lockout rather than in the stretch, which is the opposite of the RDL."},{i:"goodmorning",n:"Good Morning",p:"hinge",m:"strength",e:["barbell","rack"],r:"dead",f:.5,d:"Bar on the back, hinging forward against a long lever arm. Extremely demanding on the spinal erectors and hamstrings relative to the load on the bar \u2014 start much lighter than expected."},{i:"swing",n:"Kettlebell Swing",p:"hinge",m:"power",e:["kb"],c:1,d:"Ballistic hip snap that projects the bell forward. The arms are ropes; all force comes from a violent hip extension and an equally hard glute and abdominal lockout at the top."},{i:"sldl",n:"Single-Leg RDL",p:"lunge",m:"strength",e:["kb"],u:1,d:"Hinge on one leg with the free leg extending behind as a counterbalance. Trains hamstring strength at length plus hip rotational stability, which no bilateral hinge covers."},{i:"nordic",n:"Nordic Hamstring Curl",p:"hinge",m:"calisthenics",e:[],d:"Kneeling with ankles anchored, lowering the torso under hamstring control as slowly as possible. One of the strongest interventions for hamstring strain risk. Regress with a band until control is possible."},{i:"backext",n:"Back Extension",p:"hinge",m:"calisthenics",e:[],d:"Hip or spinal extension from a bench, GHD, or floor. Trains the posterior chain in the low-load, high-rep range that heavy hinging leaves untouched."},{i:"pullthrough",n:"Band Pull-Through",p:"hinge",m:"band",e:["bands"],d:"Hinge with a band pulled between the legs from behind. Resistance is horizontal, so it teaches the hip drive of a deadlift with almost no spinal compression."},{i:"broadjump",n:"Standing Broad Jump",p:"hinge",m:"power",e:[],c:1,d:"Maximal horizontal jump for distance from a two-foot start. A clean field test of hip extension power and a useful potentiator before heavy hinging."},{i:"walklunge",n:"Walking Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Continuous forward lunges. The forward travel adds a deceleration demand each step that a stationary split squat does not have."},{i:"revlunge",n:"Reverse Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Stepping backward into the lunge. Easier on the knee than a forward lunge and biases the glute of the front leg because the shin stays more vertical."},{i:"latlunge",n:"Lateral Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Lunge in the frontal plane, sitting into one hip while the other leg stays straight. Trains adductors and frontal-plane hip control that sagittal-only training misses."},{i:"skater",n:"Skater Bound",p:"lunge",m:"power",e:[],u:1,d:"Lateral bound from one leg to the other with a stuck landing. Trains single-leg elastic power and frontal-plane deceleration, which is where most non-contact knee injuries occur."},{i:"cossack",n:"Cossack Squat",p:"lunge",m:"mobility",e:[],u:1,d:"Deep lateral squat shifting side to side with one leg extended. Doubles as adductor and ankle mobility work and as a frontal-plane strength exercise at end range."},{i:"powerclean",n:"Power Clean",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:1,c:1,d:"Bar pulled from the floor and received on the shoulders in a partial squat. The highest-power full-body expression available with a barbell; technique degrades fast under fatigue, so keep sets short."},{i:"hangclean",n:"Hang Power Clean",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.9,c:1,d:"Clean initiated from above the knee rather than the floor. Removing the first pull shortens the learning curve and concentrates the work in the explosive second pull."},{i:"powersnatch",n:"Power Snatch",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.78,c:1,d:"Wide-grip pull from floor to overhead in one movement, received in a partial squat. The highest bar velocity of any lift, and the most demanding of overhead mobility."},{i:"pushjerk",n:"Push Jerk",p:"triple",m:"olympic",e:["barbell","rack"],r:"clean",f:1.05,c:1,d:"Dip, drive, and re-bend under the bar to receive it overhead with locked arms. Trains overhead power and the ability to accept force in a fixed position."},{i:"cleanpull",n:"Clean Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:1.15,d:"The pull of a clean taken to full extension with no catch. Allows supramaximal loading of the pull without the technical demand of receiving the bar."},{i:"highpull",n:"Barbell High Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.85,d:"Explosive pull finishing with elbows high and the bar near chest height. A useful bridge for lifters who need the extension pattern but not the catch."},{i:"kbclean",n:"Single-Arm KB Clean",p:"triple",m:"olympic",e:["kb"],u:1,d:"Bell swung and received in the front rack in one motion. Teaches triple extension and a soft receiving position with far less technical risk than a barbell clean."},{i:"mbscoop",n:"Med Ball Rotational Scoop Toss",p:"triple",m:"power",e:["medball"],c:1,d:"Ball swung low across the body and released up and out. Combines hip extension with rotation, which is how most sporting power is actually produced."},{i:"farmer",n:"Farmer Carry",p:"carry",m:"core",e:["db"],d:"Walk with heavy load in both hands, ribs stacked over pelvis. Trains grip, trap, and trunk endurance simultaneously and is nearly impossible to perform with bad technique."},{i:"suitcase",n:"Suitcase Carry",p:"carry",m:"core",e:["kb"],u:1,d:"Carry with load in one hand only. The offset load forces the opposite-side obliques and quadratus lumborum to resist lateral flexion for the whole walk."},{i:"frontrack",n:"Front-Rack Carry",p:"carry",m:"core",e:["kb"],d:"Carry with bells racked at the shoulders. The anterior load drives the ribs up, so the abdominals must work continuously to keep them down."},{i:"ohcarry",n:"Overhead Carry",p:"carry",m:"core",e:["kb"],d:"Carry with load locked out overhead. Demands the most shoulder stability and the most rib-down control of any carry variation. Start very light."},{i:"sledpush",n:"Sled Push",p:"carry",m:"conditioning",e:["sled"],d:"Horizontal push against a loaded sled. Pure concentric work with no eccentric component, so it produces conditioning and leg drive with minimal soreness."},{i:"abwheel",n:"Ab Wheel Rollout",p:"antiext",m:"core",e:[],d:"Rolling forward while resisting lumbar extension, then returning. Range should only extend as far as the ribs can stay down and the low back flat."},{i:"hollow",n:"Hollow Body Hold",p:"antiext",m:"core",e:[],d:"Supine hold with the low back pressed flat and the limbs extended. The foundational anti-extension position; shorten the levers by tucking the knees to regress."},{i:"deadbug",n:"Weighted Dead Bug",p:"antiext",m:"core",e:[],d:"Supine alternating limb lowering with the low back kept flat throughout. Adding load or a band increases the anti-extension demand without adding spinal motion."},{i:"plankreach",n:"Plank with Reach",p:"antiext",m:"core",e:[],d:"Front plank with one arm reaching forward. The reach turns a static hold into an anti-rotation and anti-extension task at the same time."},{i:"plankjack",n:"Plank Jack",p:"antiext",m:"core",e:[],d:"Front plank with the feet jumping wide and back. The hips want to rise and rotate with every jump, so the anti-extension demand is dynamic rather than static \u2014 a harder version of the same job the plank does, and one that survives being put under a clock."},{i:"planktap",n:"Plank Shoulder Tap",p:"antiext",m:"core",e:[],d:"Front plank, one hand tapping the opposite shoulder. Removing a hand halves the base of support, so the cost is almost entirely anti-rotation. Slower is harder here; speed hides the fault."},{i:"mtnclimber",n:"Mountain Climber",p:"antiext",m:"conditioning",e:[],d:"Plank position with alternating knee drive. Anti-extension held while the hips cycle, which is why it holds up as conditioning filler where a static plank would simply stop being a stimulus."},{i:"bicyclecrunch",n:"Bicycle Crunch",p:"rot",m:"core",e:[],d:"Supine alternating elbow-to-opposite-knee with the legs cycling. Trunk rotation under flexion with a long lever, which the library otherwise only covers with loaded or standing rotation."},{i:"popsquat",n:"Pop Squat",p:"squat",m:"calisthenics",e:[],d:"Repeated low-amplitude squat jump, feet landing wide then narrow. The amplitude is small on purpose: it keeps the reactive quality available for reps at a density a maximal jump squat cannot survive, which is what makes it usable inside a conditioning block."},{i:"dbpullover",n:"Dumbbell Pullover",p:"vpull",m:"strength",e:["db"],any:["bench"],d:"Supine, one dumbbell lowered behind the head with the elbows barely bending. The lats and serratus are loaded at close to full length, which is where the hypertrophy and transfer evidence is strongest and where the rest of the pulling library does not reach."},{i:"ohtriext",n:"Overhead Triceps Extension",p:"vpush",m:"strength",e:[],any:["db","kb","cable","bands"],d:"Elbows overhead, load lowered behind the head. The long head crosses the shoulder, so only an overhead position loads it at length \u2014 a pushdown trains the same muscle in the shortest position it has."},{i:"dbcurl",n:"Dumbbell Biceps Curl",p:"hpull",m:"strength",e:[],any:["db","kb","cable","bands"],d:"Direct elbow flexion. Worth having on its own terms for a population that carries, drags and climbs, where elbow flexion is held for long stretches rather than produced once."},{i:"hlr",n:"Hanging Leg Raise",p:"antiext",m:"core",e:["pullup"],d:"Legs raised from a dead hang with a deliberate posterior pelvic tilt at the top. Without the tilt it becomes a hip flexor exercise rather than an abdominal one."},{i:"sideplank",n:"Side Plank with Row",p:"antiext",m:"core",e:["bands"],u:1,d:"Side plank while rowing a band with the top arm. Anti-lateral-flexion under an added rotational challenge \u2014 a strong pairing with any unilateral carry."},{i:"copenhagen",n:"Copenhagen Plank",p:"antiext",m:"core",e:["bench"],u:1,d:"Side plank with the top leg supported on a bench, adductors holding the hips up. One of the few loaded adductor exercises and a well-supported groin injury reducer."},{i:"pallof",n:"Pallof Press",p:"rot",m:"core",e:["bands"],d:"Band or cable pressed straight out from the sternum while resisting the pull toward the anchor. The trunk does not move; the work is entirely in refusing to rotate."},{i:"chop",n:"Half-Kneeling Cable Chop",p:"rot",m:"core",e:["cable"],u:1,d:"Diagonal pull from high to low in a half-kneeling stance. Trains rotation through the thoracic spine while the pelvis stays locked by the kneeling position."},{i:"lift",n:"Half-Kneeling Cable Lift",p:"rot",m:"core",e:["cable"],u:1,d:"The chop reversed: a diagonal drive from low to high. Pairs with the chop to train both rotational directions across the full diagonal."},{i:"mbrot",n:"Med Ball Rotational Throw",p:"rot",m:"power",e:["medball"],u:1,c:1,d:"Ball thrown sideways into a wall with hip drive leading and the arms last. The clearest way to train rotational power because the ball leaves the hands at peak velocity."},{i:"birddog",n:"Bird Dog",p:"rot",m:"core",e:[],d:"Quadruped opposite arm and leg extension with the spine held still. Low-load anti-rotation and a reliable way to re-establish trunk control between heavy sets."},{i:"ergint",n:"Erg / Bike Intervals",p:"loco",m:"conditioning",any:["bike","rower","ski","tread"],e:[],c:1,d:"Timed intervals on a rower, bike, or ski erg. The work-to-rest ratio decides the system: 1:5 or longer stays phosphagen, 1:2 to 1:1 is glycolytic, and continuous work is oxidative."},{i:"tempo",n:"Tempo Runs",p:"loco",m:"conditioning",e:[],c:1,d:"Submaximal runs at roughly 70\u201380% of top speed with walk-back recovery. Builds aerobic capacity and running mechanics without the soreness of true sprinting."},{i:"rope",n:"Jump Rope Intervals",p:"loco",m:"conditioning",e:[],c:1,d:"Timed skipping intervals. Low equipment cost, high ankle stiffness benefit, and easily scaled by changing interval length or adding double-unders."},{i:"kbcomplex",n:"Kettlebell Complex",p:"loco",m:"conditioning",e:["kb"],c:1,d:"A fixed sequence of kettlebell lifts performed without setting the bell down. Loaded conditioning that also accumulates hinge and press volume. Choose a weight the weakest lift can handle."},{i:"sleddrag",n:"Sled Drag Intervals",p:"loco",m:"conditioning",e:["sled"],c:1,d:"Forward, backward, or lateral sled drags in timed intervals. Backward drags load the quads concentrically and are widely used for knee rehabilitation and conditioning at once."},{i:"9090",n:"90/90 Hip Switch",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","hinge","lunge","triple"],d:"Seated rotation between 90/90 hip positions, switching sides without using the hands. Trains internal and external hip rotation, which limits squat depth more often than ankles do."},{i:"couch",n:"Couch Stretch",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","hinge","lunge","triple"],d:"Rear foot elevated against a wall in a half-kneeling position with the pelvis tucked. Opens hip flexors and quads; the pelvic tuck is what makes it work."},{i:"ankle",n:"Banded Ankle Rock",p:"mob",m:"mobility",ph:"am",e:["bands"],for:["squat","lunge","triple"],d:"Knee driven forward over the toes with a band pulling the ankle back into the joint. Improves dorsiflexion, the most common hard limit on squat depth."},{i:"tspine",n:"Thoracic Extension over Bench",p:"mob",m:"mobility",ph:"am",e:[],for:["hpush","vpush","vpull","triple"],d:"Elbows on a bench, sinking the chest toward the floor while exhaling. Restores the thoracic extension needed for overhead positions and front rack."},{i:"wallslide",n:"Wall Slide with Exhale",p:"mob",m:"mobility",ph:"am",e:[],for:["hpush","vpush","vpull"],d:"Forearms sliding up a wall while exhaling fully and keeping the ribs down. Trains upward scapular rotation, the missing piece in most cranky overhead shoulders."},{i:"dislocate",n:"Band Shoulder Pass-Through",p:"mob",m:"mobility",ph:"am",e:["bands"],for:["vpush","vpull","hpush","triple"],d:"Band taken from in front of the body to behind with straight arms. Narrow the grip gradually over weeks. Best used as a warm-up rather than a static stretch."},{i:"catcow",n:"Segmental Cat-Cow",p:"mob",m:"mobility",ph:"am",e:[],for:["hinge","antiext","rot","hpull"],d:"Quadruped spinal flexion and extension moved one segment at a time. Restores the ability to move the spine deliberately, which heavy bracing tends to erode."},{i:"hipflow",n:"World's Greatest Stretch",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","hinge","lunge","loco","hpull"],d:"Deep lunge with a thoracic rotation and a hamstring sweep. Covers hip flexors, adductors, hamstrings, and thoracic rotation in one sequence."},{i:"cgbench",n:"Close-Grip Bench Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:.88,d:"Bench with hands roughly shoulder-width. Shifts load to the triceps and shortens the bar path, which usually makes it the strongest bench variation for lockout work."},{i:"spoto",n:"Spoto Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:.9,d:"Bench paused an inch off the chest without touching. Kills the stretch reflex and exposes control in the exact range most lifters rush."},{i:"pinpress",n:"Pin Press",p:"hpush",m:"strength",e:["barbell","rack"],r:"bench",f:.95,c:1,d:"Press starting from dead stop on pins set at the sticking point. Pure concentric strength with no elastic contribution."},{i:"kbfloor",n:"KB Floor Press",p:"hpush",m:"strength",e:["kb"],u:1,d:"Floor press with a kettlebell, the mass hanging behind the wrist. The offset load demands far more shoulder packing than a dumbbell."},{i:"archerpush",n:"Archer Push-Up",p:"hpush",m:"calisthenics",e:[],u:1,d:"Push-up shifting weight onto one arm while the other stays straight. The most accessible bridge toward a one-arm push-up."},{i:"bandpushup",n:"Band-Resisted Push-Up",p:"hpush",m:"band",e:["bands"],d:"Push-up with a band across the back. Resistance climbs toward lockout, so it loads the top of the press without loading the shoulder at the bottom."},{i:"deficitpush",n:"Deficit Push-Up",p:"hpush",m:"calisthenics",e:["db"],d:"Push-up with hands elevated on dumbbells so the chest drops below them. Adds the stretched range a floor push-up can't reach."},{i:"sbfloor",n:"Sandbag Floor Press",p:"hpush",m:"strongman",e:["sandbag"],d:"Floor press with a shifting, unstable load. Grip and stabilizers fail well before the pecs do, which is the point."},{i:"zpress",n:"Z Press",p:"vpush",m:"strength",e:["barbell"],r:"press",f:.7,d:"Overhead press seated on the floor with legs straight. With no lower body to brace against, it ruthlessly exposes thoracic extension and trunk control."},{i:"logpress",n:"Log Clean & Press",p:"vpush",m:"strongman",e:["log"],c:1,d:"Log cleaned to the chest and pressed overhead. The neutral grip and thick diameter change the rack position entirely \u2014 expect well below your barbell press."},{i:"bupress",n:"KB Bottoms-Up Press",p:"vpush",m:"strength",e:["kb"],u:1,d:"Press with the bell inverted, handle squeezed hard. Irreplaceable for rotator cuff and grip reflexes; the load stays trivial and that's fine."},{i:"arnold",n:"Arnold Press",p:"vpush",m:"strength",e:["db"],d:"Dumbbell press rotating from palms-in to palms-out. Adds humeral rotation under load and hits all three deltoid heads in one path."},{i:"sbg2o",n:"Sandbag Ground-to-Overhead",p:"vpush",m:"strongman",e:["sandbag"],c:1,d:"Bag taken from floor to overhead by any means. A full-body expression that doubles as conditioning when done for reps."},{i:"hshold",n:"Wall-Supported Handstand Hold",p:"vpush",m:"calisthenics",e:[],d:"Inverted hold against a wall, ribs down and shoulders pushed to the ears. Builds the overhead position isometrically before pressing strength is there."},{i:"sealrow",n:"Seal Row",p:"hpull",m:"strength",e:["barbell","bench"],r:"bench",f:.7,d:"Row lying prone on an elevated bench. Removes every ounce of body english, so the back does exactly as much as it can and no more."},{i:"meadows",n:"Meadows Row",p:"hpull",m:"strength",e:["barbell","landmine"],u:1,d:"Single-arm row on the end of a landmine from a staggered stance. The arcing path reaches a strong stretch at the bottom."},{i:"kroc",n:"Kroc Row",p:"hpull",m:"strength",e:["db","bench"],u:1,d:"Heavy, high-rep single-arm dumbbell row with controlled body english. Built for grip, upper back mass, and work capacity rather than strict form."},{i:"pullapart",n:"Band Pull-Apart",p:"hpull",m:"band",e:["bands"],d:"Band pulled apart at chest height with straight arms. Cheap, high-rep rear delt and mid-trap work that offsets almost any pressing volume."},{i:"sbrow",n:"Sandbag Bent Row",p:"hpull",m:"strongman",e:["sandbag"],d:"Bent row hugging a sandbag. The wide, shifting load forces a stronger brace than a barbell row at the same weight."},{i:"ytw",n:"Prone Y-T-W Raise",p:"hpull",m:"core",e:[],d:"Prone scapular raises through three arm positions. Low load, high value for the lower trap, which quietly limits overhead work."},{i:"ngpullup",n:"Neutral-Grip Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"Palms facing each other. Usually the most shoulder-comfortable vertical pull and the best default for high-volume weeks."},{i:"scappull",n:"Scapular Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"From a dead hang, depress the shoulder blades without bending the elbows. Teaches where a pull-up actually starts."},{i:"archerpull",n:"Archer Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],u:1,d:"Pull toward one hand with the other arm straight along the bar. The practical step toward a one-arm chin."},{i:"sapulldown",n:"Straight-Arm Pulldown",p:"vpull",m:"band",e:["bands"],d:"Lat work with the elbow locked, so the biceps can't take over. Excellent as a pre-activation before heavy pulling."},{i:"pausesquat",n:"Pause Back Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.88,c:1,d:"Squat with a two to three second pause at depth. Removes e
