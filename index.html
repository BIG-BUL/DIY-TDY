lastic energy and builds confidence in the bottom position."},{i:"pinsquat",n:"Pin Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.85,d:"Squat starting from a dead stop on pins. The hardest possible way to train the bottom, and honest about weak points."},{i:"zercher",n:"Zercher Squat",p:"squat",m:"strongman",e:["barbell"],r:"squat",f:.65,c:1,d:"Bar carried in the crooks of the elbows. Brutal on the upper back and trunk, and the most transferable squat to carrying awkward loads."},{i:"ohsquat",n:"Overhead Squat",p:"squat",m:"olympic",e:["barbell"],r:"squat",f:.45,d:"Squat with the bar locked out overhead. Less a strength exercise than a diagnostic \u2014 it reveals every mobility restriction you have at once."},{i:"sbfront",n:"Sandbag Front Squat",p:"squat",m:"strongman",e:["sandbag"],d:"Squat bear-hugging a bag. The anterior shifting load turns it into a trunk exercise disguised as a squat."},{i:"dkbfront",n:"Double KB Front Squat",p:"squat",m:"strength",e:["kb"],d:"Front squat with two bells racked. The rack position limits load before the legs do, which makes it self-regulating."},{i:"heelsel",n:"Heels-Elevated Goblet Squat",p:"squat",m:"strength",e:["kb"],d:"Goblet squat with heels on a plate. Biases the quads and lets lifters with stiff ankles reach real depth today rather than in six weeks."},{i:"pistol",n:"Pistol Squat",p:"lunge",m:"calisthenics",e:[],u:1,d:"Full single-leg squat with the free leg extended. Demands ankle range, single-leg strength, and balance simultaneously."},{i:"wallsit",n:"Wall Sit",p:"squat",m:"calisthenics",e:[],d:"Isometric hold at ninety degrees. Cheap quad endurance and a useful finisher when no load is available."},{i:"sissy",n:"Sissy Squat",p:"squat",m:"calisthenics",e:[],d:"Knees travel forward while hips stay extended. Loads the quads and the patellar tendon at long lengths \u2014 build up slowly."},{i:"deficitdl",n:"Deficit Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.88,c:1,d:"Deadlift standing on a one to two inch platform. Lengthens the pull and directly attacks weakness off the floor."},{i:"rackpull",n:"Rack Pull",p:"hinge",m:"strength",e:["barbell","rack"],r:"dead",f:1.15,c:1,d:"Deadlift from pins above the knee. Allows supramaximal loading of the lockout and heavy upper-back exposure."},{i:"sgdl",n:"Snatch-Grip Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.82,d:"Deadlift with a wide grip. Increases range of motion and upper back demand at a lower absolute load."},{i:"sumodl",n:"Sumo Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:1,c:1,d:"Wide stance, hands inside the knees. Shorter range and a more upright torso; strong hips and adductors favour it."},{i:"glutebridge",n:"Glute Bridge",p:"hinge",m:"calisthenics",e:[],d:"Floor-based hip extension. The regression that lets you keep training the pattern when the low back has had enough."},{i:"slhipthrust",n:"Single-Leg Hip Thrust",p:"lunge",m:"strength",e:["bench"],u:1,d:"Hip thrust on one leg. Exposes glute asymmetry that the bilateral version hides completely."},{i:"ghr",n:"Glute-Ham Raise",p:"hinge",m:"strength",e:["ghd"],d:"Knee-flexion hamstring work under body weight. Trains the hamstring at the knee, which every hip-hinge variation neglects."},{i:"backext45",n:"45\xB0 Back Extension",p:"hinge",m:"strength",e:["ghd"],d:"Hip extension from an angled bench. Loads the posterior chain with minimal compression and is easy to progress by holding a plate."},{i:"kbswing1",n:"Single-Arm KB Swing",p:"hinge",m:"power",e:["kb"],u:1,d:"Swing with one hand. Adds a rotational resistance demand to the hip snap and doubles as conditioning."},{i:"kbsnatch",n:"Kettlebell Snatch",p:"hinge",m:"power",e:["kb"],u:1,c:1,d:"Bell driven from between the legs to overhead in one motion. The backbone of kettlebell conditioning tests; punishing on grip and lungs together."},{i:"sbshoulder",n:"Sandbag Shouldering",p:"hinge",m:"strongman",e:["sandbag"],c:1,d:"Bag lifted from the ground onto one shoulder, alternating sides. As close as training gets to lifting a casualty or an awkward load."},{i:"staggerdl",n:"Staggered-Stance RDL",p:"lunge",m:"strength",e:["db"],u:1,d:"RDL with one foot back on the toe for balance only. A bridge between bilateral and true single-leg hinging."},{i:"jeffcurl",n:"Jefferson Curl",p:"hinge",m:"mobility",e:[],for:["hinge","antiext"],d:"Slow segmental spinal flexion under a light load. Trains loaded spinal range deliberately. Start with almost nothing and progress over months."},{i:"ffess",n:"Front-Foot-Elevated Split Squat",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Split squat with the front foot raised. Deepens the front-leg range while staying far easier to balance than a rear-foot-elevated version."},{i:"deficitlunge",n:"Deficit Reverse Lunge",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Reverse lunge stepping off a plate or box. Extra range at the hip makes it a strong glute builder."},{i:"curtsy",n:"Curtsy Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Lunge stepping diagonally behind. Loads the glute medius in a way sagittal lunges never reach."},{i:"latstepup",n:"Lateral Step-Up",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Step up sideways onto a box. Frontal-plane single-leg strength, valuable for anyone who changes direction under load."},{i:"slboxsquat",n:"Single-Leg Box Squat",p:"lunge",m:"strength",e:["box"],u:1,d:"Sit to a box on one leg and stand. The controllable regression on the way to a pistol."},{i:"hangsnatch",n:"Hang Power Snatch",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.7,c:1,d:"Snatch from above the knee. Highest-velocity lift most athletes can learn safely, and less technical than from the floor."},{i:"splitjerk",n:"Split Jerk",p:"triple",m:"olympic",e:["barbell","rack"],r:"clean",f:1.1,c:1,d:"Jerk receiving the bar in a split stance. More overhead stability than a push jerk and heavier loads, at the cost of footwork."},{i:"cleanjerk",n:"Clean & Jerk",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.95,c:1,d:"Full lift, floor to overhead in two movements. The most complete single expression of barbell power."},{i:"snatchpull",n:"Snatch Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.95,d:"Snatch-grip pull to full extension without a catch. Allows heavy extension work without overhead demand."},{i:"jumpshrug",n:"Jump Shrug",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.7,d:"Explosive extension and shrug with the feet leaving the floor. The simplest entry point to triple extension training."},{i:"dbsnatch",n:"Dumbbell Snatch",p:"triple",m:"power",e:["db"],u:1,c:1,d:"Single dumbbell floor to overhead in one motion. Nearly all the power benefit of a barbell snatch with a fraction of the learning curve."},{i:"kbjerk",n:"Kettlebell Jerk",p:"triple",m:"power",e:["kb"],d:"Bells driven overhead with leg drive from the rack. Built for repeat efforts, which makes it conditioning as much as power."},{i:"sbclean",n:"Sandbag Clean to Shoulder",p:"triple",m:"strongman",e:["sandbag"],c:1,d:"Bag cleaned from floor to chest. Awkward, gripless, and about as sport-specific as tactical lifting gets."},{i:"yokewalk",n:"Yoke Walk",p:"carry",m:"strongman",e:["yoke"],c:1,d:"Heavy frame carried across the upper back for distance. Trains whole-body rigidity under load better than anything else. Short distances, heavy."},{i:"sbcarry",n:"Sandbag Bear-Hug Carry",p:"carry",m:"strongman",e:["sandbag"],d:"Bag hugged to the chest and carried. Constant anterior load makes breathing hard and the brace non-negotiable."},{i:"ruckmarch",n:"Ruck March",p:"carry",m:"conditioning",e:["ruck"],any:["road","track","hill","tread"],c:1,d:"Loaded walking for distance. The most transferable tactical conditioning there is, and the most commonly overdone \u2014 treat load and distance as separate progressions."},{i:"waiter",n:"Waiter Walk",p:"carry",m:"core",e:["kb"],u:1,d:"Single-arm overhead carry. Ruthless on overhead stability and shoulder endurance; keep the load light and the ribs down."},{i:"bucarry",n:"Bottoms-Up KB Carry",p:"carry",m:"core",e:["kb"],u:1,d:"Carry with the bell inverted at the rack. Grip and cuff work with almost no systemic cost."},{i:"logcarry",n:"Log Carry",p:"carry",m:"strongman",e:["log"],d:"Thick, front-loaded implement carried for distance. Breathing under an anterior load is the limiting factor."},{i:"tgu",n:"Turkish Get-Up",p:"carry",m:"core",e:["kb"],u:1,d:"Floor to standing and back with a bell locked overhead. Half mobility screen, half stability exercise, and it exposes exactly where you lose position."},{i:"backdrag",n:"Backward Sled Drag",p:"carry",m:"conditioning",e:["sled"],d:"Sled dragged walking backward. Purely concentric quad work, widely used for knee rehabilitation and conditioning simultaneously."},{i:"rkc",n:"RKC Plank",p:"antiext",m:"core",e:[],d:"Plank with maximal full-body tension \u2014 glutes, quads, and abs braced hard. Ten seconds done properly beats two minutes of sagging."},{i:"bodysaw",n:"Body Saw",p:"antiext",m:"core",e:[],d:"Plank sliding forward and back at the feet. Adds a moving lever to the anti-extension demand."},{i:"stirpot",n:"Stir the Pot",p:"antiext",m:"core",e:[],d:"Plank on a ball, elbows drawing circles. Anti-extension plus anti-rotation in a single continuous demand."},{i:"lsit",n:"L-Sit",p:"antiext",m:"calisthenics",e:[],d:"Supported hold with legs extended horizontally. Extreme hip flexor and abdominal demand; tuck the knees to regress."},{i:"dragonflag",n:"Dragon Flag",p:"antiext",m:"calisthenics",e:["bench"],d:"Body lowered as one rigid unit from the shoulders. Advanced anti-extension \u2014 earn it with a solid hollow hold first."},{i:"t2b",n:"Toes-to-Bar",p:"antiext",m:"calisthenics",e:["pullup"],d:"Hanging, feet driven to the bar. Combines grip endurance with a full-range abdominal contraction."},{i:"revcrunch",n:"Reverse Crunch",p:"antiext",m:"core",e:[],d:"Pelvis curled toward the ribs with the legs light. Trains posterior pelvic tilt, the piece most people miss in ab work."},{i:"shotput",n:"Med Ball Shot-Put Throw",p:"rot",m:"power",e:["medball"],u:1,c:1,d:"Ball driven from the shoulder with hip and trunk rotation. Trains the rotational power sequence with a clean release."},{i:"antirothold",n:"Anti-Rotation Hold",p:"rot",m:"core",e:["bands"],d:"Pallof position held statically rather than pressed. Time under tension exposes the trunk's endurance rather than its peak strength."},{i:"windmill",n:"Kettlebell Windmill",p:"rot",m:"strength",e:["kb"],u:1,for:["vpush","hinge","rot"],d:"Hinge and rotate under an overhead bell. Combines thoracic rotation, hamstring range, and shoulder stability in one loaded position."},{i:"sprint40",n:"Short Sprints (30\u201350 m)",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["alp"],d:"Maximal accelerations from a static start. The purest alactic stimulus available; full recovery between reps is not optional."},{i:"sprint100",n:"Sprints (60\u2013100 m)",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["alp","alc"],d:"Near-maximal runs long enough to reach and hold top speed. Requires a genuine warm-up \u2014 this is where hamstrings get hurt."},{i:"run150",n:"150 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glp"],d:"Hard runs that finish just as glycolysis peaks. Long enough to hurt, short enough to repeat with quality."},{i:"run200",n:"200 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glp","glc"],d:"The classic lactate builder. Pace should be even across all reps; a fast first rep and a crawl at the end means the pace was wrong."},{i:"run400",n:"400 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glc","aep"],d:"Deeply uncomfortable and highly effective. Rest ratio decides whether it trains lactate tolerance or aerobic power."},{i:"run800",n:"800 m Repeats",p:"loco",m:"conditioning",e:[],any:["track","road"],c:1,sup:["aep"],d:"Long intervals at roughly 90\u201395% of max heart rate. Among the most reliable ways to raise VO\u2082max."},{i:"tempo100",n:"Tempo 100s",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["tmp"],d:"Repeat 100 m runs at about 70% effort with short walk recoveries. Builds capacity and running mechanics with almost no residual soreness."},{i:"strides",n:"Strides",p:"loco",m:"conditioning",e:[],any:["track","turf","road"],sup:["alp","tmp"],d:"Relaxed accelerations of 60\u2013100 m building to near top speed. Excellent as a potentiator or a warm-down for the nervous system."},{i:"shuttle",n:"5-10-5 Shuttle",p:"loco",m:"conditioning",e:[],any:["turf","track"],c:1,sup:["alp"],d:"Change-of-direction sprint. Trains deceleration and re-acceleration, which straight-line running never touches."},{i:"shuttle25",n:"25 yd Shuttle Repeats",p:"loco",m:"conditioning",e:[],any:["turf","track"],c:1,sup:["glp","glc"],d:"Repeated down-and-backs. The turns make it far more taxing than the equivalent distance run straight."},{i:"sledsprint",n:"Sled Sprint",p:"loco",m:"conditioning",e:["sled"],any:["turf","track"],c:1,sup:["alp","glp"],d:"Maximal sprint against sled resistance. Loads acceleration mechanics; keep the load light enough that stride pattern survives."},{i:"bearcrawl",n:"Bear Crawl",p:"loco",m:"calisthenics",e:[],any:["turf"],sup:["glc"],d:"Quadrupedal locomotion with knees just off the ground. Trunk and shoulder conditioning disguised as cardio."},{i:"hillsprint",n:"Hill Sprints",p:"loco",m:"conditioning",e:[],any:["hill"],c:1,sup:["alp","alc"],d:"Uphill maximal efforts. The incline limits stride length, which makes them far safer on hamstrings than flat sprinting."},{i:"stairrepeat",n:"Stair Repeats",p:"loco",m:"conditioning",e:[],any:["hill"],c:1,sup:["glc","aep"],d:"Repeated climbs at a hard pace. High aerobic demand with low impact on the way up; walk down for recovery."},{i:"easyrun",n:"Easy Run",p:"loco",m:"conditioning",e:[],any:["road","track","tread"],c:1,sup:["aeb"],d:"Continuous running at conversational pace. Should feel almost too easy \u2014 that is the sign you are in the right zone."},{i:"threshrun",n:"Threshold Run",p:"loco",m:"conditioning",e:[],any:["road","track","tread"],c:1,sup:["aet"],d:"Sustained running at comfortably hard effort. Raises the pace you can hold before lactate accumulates faster than you clear it."},{i:"fartlek",n:"Fartlek Run",p:"loco",m:"conditioning",e:[],any:["road","track","turf"],c:1,sup:["aep","aet"],d:"Continuous run with unstructured surges. Useful when terrain or time makes precise intervals impractical."},{i:"longrun",n:"Long Run",p:"loco",m:"conditioning",e:[],any:["road","tread"],c:1,sup:["aeb"],d:"Extended easy-pace run. Builds the aerobic base that determines how fast you recover between every hard effort you do."},{i:"inclinewalk",n:"Weighted Incline Walk",p:"loco",m:"conditioning",e:["tread"],sup:["aeb","aet"],d:"Steep treadmill walking, loaded or unloaded. Ruck-march stimulus without the joint cost of pavement."},{i:"bikesprint",n:"Air Bike Sprints",p:"loco",m:"conditioning",e:["bike"],c:1,sup:["alp","glp"],d:"All-out efforts on an air bike. Resistance scales with output, so there is nowhere to hide and no eccentric cost at all."},{i:"bikeint",n:"Air Bike Intervals",p:"loco",m:"conditioning",e:["bike"],c:1,sup:["glc","aep","aet"],d:"Structured work-rest intervals. The most controllable conditioning tool available and the easiest to prescribe by the watt."},{i:"rowint",n:"Rowing Intervals",p:"loco",m:"conditioning",e:["rower"],c:1,sup:["glp","glc","aep","aet"],d:"Interval work by distance or time. Split times give objective feedback, so pacing errors show up immediately."},{i:"rowsteady",n:"Steady-State Row",p:"loco",m:"conditioning",e:["rower"],c:1,sup:["aeb","aet"],d:"Continuous rowing at a controlled rate. Full-body aerobic work with no impact, useful on days when legs need a break from running."},{i:"skiint",n:"Ski Erg Intervals",p:"loco",m:"conditioning",e:["ski"],c:1,sup:["glp","glc","aep"],d:"Upper-body-dominant intervals. Valuable when the lower body is already fatigued from lifting."},{i:"curvesprint",n:"Curved Treadmill Sprints",p:"loco",m:"conditioning",e:["curve"],c:1,sup:["alp","glp"],d:"Self-powered sprints where you set the speed. Safer than an outdoor sprint for less-trained athletes and easy to keep to strict intervals."},{i:"kbswingint",n:"KB Swing Intervals",p:"loco",m:"conditioning",e:["kb"],c:1,sup:["glp","glc"],d:"Timed swing sets on the minute. Loaded conditioning that keeps hinging volume up when running is not an option."},{i:"sbcarryint",n:"Sandbag Carry Intervals",p:"loco",m:"conditioning",e:["sandbag"],c:1,sup:["glc","aet"],d:"Repeat carries for distance or time. Grip and breathing fail first, which is exactly what makes it tactically relevant."},{i:"sledpushint",n:"Sled Push Intervals",p:"loco",m:"conditioning",e:["sled"],c:1,sup:["alp","glp","glc"],d:"Repeated heavy pushes. Purely concentric, so it delivers hard conditioning with minimal next-day soreness."},{i:"burpee",n:"Burpee Intervals",p:"loco",m:"conditioning",e:[],c:1,sup:["glc","aet"],d:"Timed sets of burpees. Requires nothing at all, which is its entire argument. Pace it \u2014 the first minute lies to you."},{i:"hipairplane",n:"Hip Airplane",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","hinge","lunge"],u:1,d:"Single-leg hinge with the pelvis rotating open and closed. Trains hip rotational control under balance demand."},{i:"deepsquathold",n:"Deep Squat Hold",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","lunge","triple"],d:"Sit in the bottom of a squat and breathe. Restores end-range comfort; hold a light counterweight if balance is the limiter."},{i:"soleus",n:"Soleus Wall Stretch",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","lunge","loco"],d:"Bent-knee calf stretch against a wall. Targets the soleus specifically, which limits both squat depth and running mechanics."},{i:"adductor",n:"Adductor Rock-Back",p:"mob",m:"mobility",ph:"am",e:[],for:["squat","lunge","hinge"],d:"Quadruped rocking with one leg abducted. Opens the adductors before wide-stance or lateral work."},{i:"scapcars",n:"Shoulder CARs",p:"mob",m:"mobility",ph:"am",e:[],for:["vpush","vpull","hpush","triple"],d:"Slow, controlled full-circle shoulder rotations. Maps and maintains active range rather than passively stretching it."},{i:"deadhang",n:"Dead Hang",p:"mob",m:"mobility",ph:"am",e:["pullup"],for:["vpull","vpush","hpush"],d:"Passive hang from a bar. Decompresses the shoulder and builds grip endurance at the same time."},{i:"couchbreath",n:"Half-Kneeling Breathing",p:"mob",m:"mobility",ph:"down",e:[],for:["*"],d:"Half-kneeling with a full exhale and a tucked pelvis. Resets rib position before overhead or hinge work."},{i:"breath",n:"90/90 Crocodile Breathing",p:"mob",m:"mobility",ph:"down",e:[],for:["*"],d:"Supine with feet on a wall, hips and knees at 90\xB0, breathing into the back and sides of the ribcage with a long exhale. Shifts you out of sympathetic drive so the session converts to adaptation."},{i:"rz_bike",n:"Easy Bike Spin",p:"mob",m:"mobility",ph:"raise",e:["bike"],d:"Three to five minutes at conversational effort. The only job is raising muscle temperature and blood flow \u2014 if you are breathing hard, you have turned the warm-up into the workout."},{i:"rz_row",n:"Easy Row",p:"mob",m:"mobility",ph:"raise",e:["rower"],d:"Low rate, long strokes, relaxed. Doubles as hinge rehearsal, which makes it a useful raise on pulling days."},{i:"rz_rope",n:"Jump Rope",p:"mob",m:"mobility",ph:"raise",e:["rope"],d:"Two to three minutes of easy skipping. Raises temperature and wakes up the foot and ankle complex better than any stationary option."},{i:"rz_skip",n:"Skip Series",p:"mob",m:"mobility",ph:"raise",e:[],d:"A-skip, B-skip and lateral skip for twenty metres each. Raises temperature while rehearsing elastic ground contact, so it earns its place before anything fast."},{i:"rz_crawl",n:"Bear Crawl Series",p:"mob",m:"mobility",ph:"raise",e:[],d:"Forward, backward and lateral crawling. Raises temperature through the shoulder and trunk rather than just the legs, which makes it the better raise before upper-body days."},{i:"rz_sled",n:"Light Sled Drag",p:"mob",m:"mobility",ph:"raise",e:["sled"],d:"Light load, forward and backward. Pure concentric, so it raises temperature and drives blood to the legs without adding any eccentric cost to the session."},{i:"rz_walk",n:"Incline Walk",p:"mob",m:"mobility",ph:"raise",any:["tread","curve","hill"],e:[],d:"Five minutes at a walking pace on a grade. The lowest-cost raise available and the right choice when readiness is poor."},{i:"rz_swing",n:"Light Kettlebell Swing",p:"mob",m:"mobility",ph:"raise",e:["kb"],d:"Two or three sets of ten with a light bell. Raises temperature and rehearses the hinge at speed, which is why it belongs before pulling rather than pressing."},{i:"am_hipcar",n:"Hip CARs",p:"mob",m:"mobility",ph:"am",e:[],d:"Slow, deliberate circles at the hip through the largest range you can control without the pelvis moving. Controlled range is the point \u2014 if the low back compensates, the circle is too big."},{i:"am_frog",n:"Frog Rock-Back",p:"mob",m:"mobility",ph:"am",e:[],d:"Knees wide, hips rocking toward the heels. Opens the adductor and the deep hip in the position a wide squat actually demands."},{i:"am_cookbridge",n:"Cook Hip Lift",p:"mob",m:"mobility",ph:"am",e:[],d:"Glute bridge with the non-working hip pulled to the chest, which locks the pelvis and stops the low back doing the work. Exposes exactly how much of your bridge was lumbar extension."},{i:"am_monster",n:"Lateral Band Walk",p:"mob",m:"mobility",ph:"am",e:["bands"],d:"Band above the knees, small steps, hips low. Wakes the glute medius before any session that asks a single leg to hold a knee in line."},{i:"am_tib",n:"Tibialis Raise",p:"mob",m:"mobility",ph:"am",e:[],d:"Heels planted, toes lifted against a wall or a light band. Prepares the front of the shin, which matters on any day with heavy deceleration or a lot of knee travel."},{i:"am_anklecar",n:"Ankle CARs",p:"mob",m:"mobility",ph:"am",e:[],d:"Controlled circles at the ankle with the shin still. Cheap, quick, and a reliable way to tell whether one ankle is more restricted than the other before you load it."},{i:"am_quadrock",n:"Split-Stance Hip Flexor Reach",p:"mob",m:"mobility",ph:"am",e:[],d:"Half-kneeling, glute squeezed, same-side arm reaching overhead and slightly across. Lengthens the hip flexor with the pelvis held rather than the low back arching."},{i:"am_slbridge",n:"Single-Leg Glute Bridge",p:"mob",m:"mobility",ph:"am",e:[],d:"Bridge on one leg with the pelvis kept level. Activation and a side-to-side check in the same drill \u2014 if one side tilts, you found something worth knowing before you load it."},{i:"am_cossackreach",n:"Cossack Reach",p:"mob",m:"mobility",ph:"am",e:[],d:"Unloaded shift side to side with the trailing leg straight and the foot flat. Opens the adductor in the exact position a lateral lunge or a wide stance demands."},{i:"am_ytw",n:"Prone Y-T-W",p:"mob",m:"mobility",ph:"am",e:[],d:"Face down, arms tracing a Y then a T then a W with the thumbs up. Wakes the lower and mid trap before pressing, which is the pattern most likely to be overrun by the upper trap."},{i:"am_wallangel",n:"Wall Angel",p:"mob",m:"mobility",ph:"am",e:[],d:"Back to the wall, arms sliding overhead with the ribs down and the low back flat. Exposes whether your overhead range is real shoulder flexion or borrowed lumbar extension."},{i:"am_openbook",n:"Open Book Rotation",p:"mob",m:"mobility",ph:"am",e:[],d:"Side-lying, knees stacked, top arm opening across the body. Rotation through the mid back rather than the low back, which is where most people lose rotation in the first place."},{i:"am_scappush",n:"Scapular Push-Up",p:"mob",m:"mobility",ph:"am",e:[],d:"Push-up position, elbows locked, moving only the shoulder blades. Trains protraction and serratus control, which the bench press never asks for and most pressing shoulders need."},{i:"am_serratus",n:"Serratus Wall Slide",p:"mob",m:"mobility",ph:"am",e:[],d:"Forearms on the wall, sliding up while pushing the wall away. Couples upward rotation with serratus drive, which is what a healthy overhead position is built from."},{i:"am_banderi",n:"Band External Rotation at 90",p:"mob",m:"mobility",ph:"am",e:["bands"],d:"Elbow at shoulder height, rotating the forearm up against a light band. Prepares the cuff in the position pressing and overhead work actually load it."},{i:"am_threadneedle",n:"Thread the Needle",p:"mob",m:"mobility",ph:"am",e:[],d:"Quadruped, one arm threading under the body. Mid-back rotation with the shoulder blade allowed to move, which makes it a better rotation drill than most spinal twists."},{i:"am_wristprep",n:"Wrist Prep Series",p:"mob",m:"mobility",ph:"am",e:[],d:"Palms down then palms up on the floor, rocking gently through flexion and extension. Two minutes here is the difference between a tolerable front rack and an abandoned one."},{i:"am_frontrack",n:"Front Rack Prep",p:"mob",m:"mobility",ph:"am",e:["barbell"],d:"Empty bar held in the rack position, elbows driven up, easing into the end range. The front rack is a wrist, elbow and thoracic problem at once, so it needs rehearsing rather than stretching."},{i:"am_latstretch",n:"Lat Hang Stretch",p:"mob",m:"mobility",ph:"am",e:["pullup"],d:"Hands fixed overhead, hips sinking back, ribs pulled down. A short lat is the most common reason an overhead position turns into a low-back position."},{i:"am_pressup",n:"Prone Press-Up",p:"mob",m:"mobility",ph:"am",e:[],d:"Face down, pressing the chest up with the hips staying down. Restores extension through the mid back after a day of sitting, which is most days."},{i:"am_elbowcar",n:"Elbow and Forearm CARs",p:"mob",m:"mobility",ph:"am",e:[],d:"Controlled rotation through the forearm with the upper arm still. Quick insurance before any day with heavy pressing, chin-ups or a front rack."},{i:"pt_pogo",n:"Pogo Hops",p:"mob",m:"power",ph:"pot",e:[],d:"Short, stiff bounces off the balls of the feet, minimal knee bend. Primes elastic stiffness through the ankle without any meaningful fatigue cost."},{i:"pt_cmj",n:"Countermovement Jump",p:"mob",m:"power",ph:"pot",e:[],d:"Three to five maximal jumps with full recovery between. Maximum intent, minimum volume \u2014 this primes rate of force development, it does not train it."},{i:"pt_askip",n:"A-Skip Build",p:"mob",m:"power",ph:"pot",e:["track"],d:"Two or three builds over twenty metres, rising to near-maximum. The most specific possible preparation for sprinting, because it is sprinting."},{i:"pt_dropjump",n:"Low Depth Drop",p:"mob",m:"power",ph:"pot",e:[],d:"Step off a low box and land stiff and quiet. Primes the stretch-shortening cycle. Keep the box low and the volume tiny \u2014 this is preparation, not plyometric training."},{i:"dn_9090breath",n:"90/90 Breathing with Exhale Hold",p:"mob",m:"mobility",ph:"down",e:[],d:"Feet on a wall, hips and knees at ninety degrees, ribs pulled down. Long exhale, brief pause at the bottom. Restores the stacked rib-over-pelvis position that heavy axial loading flattens out."},{i:"dn_legsup",n:"Legs Up the Wall",p:"mob",m:"mobility",ph:"down",e:[],d:"Lie down, heels resting up the wall, nasal breathing. Unloads the spine and assists venous return after a day of standing under load."},{i:"dn_child",n:"Child's Pose Breathing",p:"mob",m:"mobility",ph:"down",e:[],d:"Hips to heels, arms long, breathing into the back of the ribs. Gentle spinal decompression with a breathing position that is hard to cheat."},{i:"dn_prone",n:"Prone Diaphragmatic Breathing",p:"mob",m:"mobility",ph:"down",e:[],d:"Face down, forehead on the hands, breathing into the floor. The position gives feedback most people cannot get lying on their back."},{i:"dn_box",n:"Seated Extended-Exhale Breathing",p:"mob",m:"mobility",ph:"down",e:[],d:"Roughly four seconds in, eight out, for eight to ten cycles \u2014 about six breaths a minute. The long exhale is what drives the parasympathetic shift; the inhale is not the active ingredient."},{i:"dn_walk",n:"Nasal-Breathing Walk",p:"mob",m:"mobility",ph:"down",e:[],d:"Three to five minutes walking with the mouth closed. Brings heart rate down while keeping blood moving, which is the one recovery claim a cool-down can actually support."},{i:"dn_flush",n:"Easy Flush Spin",p:"mob",m:"mobility",ph:"down",e:["bike"],d:"Three to five minutes of very light spinning. Best after heavy glycolytic work, where the priority is clearing the ceiling off your heart rate rather than stretching anything."},{i:"dn_latopen",n:"Supported Lat Opener",p:"mob",m:"mobility",ph:"down",e:[],d:"Forearms on a bench or rack, hips sinking back, breathing into the stretch. Restores length after overhead volume without forcing an end range into fatigued tissue."},{i:"dn_pec",n:"Supported Pec Opener",p:"mob",m:"mobility",ph:"down",e:[],d:"Forearm on a doorway or rack upright, slow rotation away. Gentle and brief \u2014 pressing volume shortens the front of the shoulder, but aggressive stretching straight after it is not the answer."},{i:"dn_twist",n:"Supine Spinal Twist",p:"mob",m:"mobility",ph:"down",e:[],d:"On your back, knees dropping to one side, shoulders staying down. Unloaded rotation after a session that loaded the trunk hard."},{i:"dn_couch",n:"Easy Couch Stretch",p:"mob",m:"mobility",ph:"down",e:[],d:"The couch stretch taken to a mild position and held with slow breathing. After heavy squatting the goal is restoring length, not winning a flexibility contest."},{i:"dn_hamstring",n:"Supine Hamstring Float",p:"mob",m:"mobility",ph:"down",e:[],d:"On your back, one leg gently raised with a strap or hands, no forcing. Deliberately gentle \u2014 freshly damaged hamstring tissue does not want an aggressive stretch."},{i:"dn_hang",n:"Passive Hang",p:"mob",m:"mobility",ph:"down",e:["pullup"],d:"Thirty to sixty seconds hanging relaxed. Decompresses the spine and the shoulder after axial loading, and requires nothing but a bar."},{i:"dn_squatsit",n:"Relaxed Deep Squat Sit",p:"mob",m:"mobility",ph:"down",e:[],d:"Sit in the bottom of a squat, fully relaxed, breathing slowly. Restores hip and ankle range while the tissue is still warm."},{i:"iso_sqpin",n:"Overcoming Squat Against Pins",p:"squat",m:"strength",e:["barbell","rack"],c:!0,r:"squat",f:1,d:"Bar set against immovable pins at your sticking point, driving maximally for 5\u20136 seconds. Trains force production exactly where you fail. Gains are specific to the angle, so pick the angle you actually miss at."},{i:"iso_sqhold",n:"Yielding Squat Hold",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.7,d:"Hold a submaximal load at or just below parallel for 20\u201330 seconds. The load is trying to fold you and you refuse. Brutal, cheap, and it builds position tolerance nothing else touches."},{i:"iso_splitiso",lowrep:!0,n:"Split Squat Isometric",p:"lunge",m:"strength",e:["db"],u:!0,d:"Hold the bottom of a split squat, rear knee just off the floor. Front leg burns, hip flexor on the back leg lengthens under load. Two problems, one hold."},{i:"iso_pullpin",n:"Overcoming Pull Against Pins",p:"hinge",m:"strength",e:["barbell","rack"],c:!0,r:"dead",f:1,d:"Bar under immovable pins, pulling maximally for 5\u20136 seconds from your weakest position. The safest way to train a maximal effort \u2014 there is no eccentric and nothing to drop."},{i:"iso_benchpin",n:"Overcoming Press Against Pins",p:"hpush",m:"strength",e:["barbell","rack","bench"],c:!0,r:"bench",f:1,d:"Press into pins set at your sticking point. Maximal intent, no bar movement, no spotter needed. Three to five singles is the whole dose."},{i:"iso_benchhold",n:"Yielding Bench Hold",p:"hpush",m:"strength",e:["barbell","rack","bench"],r:"bench",f:.75,d:"Hold the bar a few inches off the chest, elbows tucked, for 15\u201320 seconds. Exposes whether your bottom position is actually stable or just fast."},{i:"iso_chinhold",lowrep:!0,n:"Chin-Over-Bar Hold",p:"vpull",m:"calisthenics",e:["pullup"],d:"Hold at the top, chin over the bar, chest to the bar. The first rung on the pull-up ladder for anyone who cannot yet do one, and useful at the other end as a finisher."},{i:"iso_midhang",n:"Mid-Range Pull-Up Hold",p:"vpull",m:"calisthenics",e:["pullup"],d:"Hold at the hardest point \u2014 elbows at ninety \u2014 for 10\u201315 seconds. Almost everyone fails a pull-up here, and almost nobody trains it."},{i:"iso_ringsupport",n:"Ring Support Hold",p:"vpush",m:"calisthenics",e:["rings"],d:"Arms locked, rings turned out, shoulders depressed. The foundation of every ring skill and an honest test of whether your shoulders own the bottom of a dip."},{i:"iso_hipiso",n:"Hip Thrust Isometric",p:"hinge",m:"strength",e:["barbell","bench"],d:"Hold at full extension, ribs down, chin tucked, for 20\u201330 seconds. If it moves to your low back within ten seconds, the glutes were never doing the work."},{i:"iso_calfiso",n:"Loaded Calf Isometric",p:"loco",m:"strength",e:["db"],d:"Hold at the top of a calf raise under load for 30\u201345 seconds. Tendon responds to sustained high load \u2014 this is the cheapest way to deliver it."},{i:"iso_copiso",n:"Copenhagen Isometric Hold",p:"antiext",m:"core",e:["bench"],u:!0,d:"Side plank with the top leg on a bench, holding. The strongest evidence base of any adductor exercise. Start from the knee, progress to the foot."},{i:"iso_wallpush",n:"Maximal Wall Push",p:"hpush",m:"strength",e:[],d:"Drive into an immovable wall at full effort for 5\u20136 seconds in a split stance. No equipment, no load, genuinely hard. A real option in a hotel room."},{i:"iso_barhold",n:"Heavy Bar Hold",p:"carry",m:"strongman",e:["barbell","rack"],r:"dead",f:1.1,d:"Hold a supramaximal deadlift at lockout for 15\u201320 seconds. Builds grip, brace and confidence with a weight heavier than you can pull."},{i:"ecc_bench",n:"Eccentric-Accentuated Bench",p:"hpush",m:"strength",e:["barbell","bench","rack"],c:!0,r:"bench",f:1,d:"Lower a supramaximal load slowly with a spotter, who then helps the bar back up. Five seconds down is the prescription. Needs a competent partner and it is brutally fatiguing \u2014 once a week at most."},{i:"ecc_squat",n:"Eccentric-Accentuated Squat",p:"squat",m:"strength",e:["barbell","rack"],c:!0,r:"squat",f:1,d:"Slow controlled descent at or above your concentric max, then assistance or a partial concentric out. High soreness cost, so it earns a place only in a block that plans for it."},{i:"ecc_chin",lowrep:!0,n:"Eccentric Chin-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"Jump or step to the top, lower over 5 seconds. The most reliable path to a first strict pull-up, and it still builds strength once you have twenty."},{i:"ecc_dip",lowrep:!0,n:"Eccentric Dip",p:"vpush",m:"calisthenics",e:["rings","box"],d:"Step to the top, lower slowly to depth, step out. Builds the bottom position safely before you ask the shoulder to press out of it."},{i:"ecc_nordic",lowrep:!0,n:"Nordic Hamstring Lower",p:"hinge",m:"strength",e:[],d:"Kneeling with the ankles anchored, lowering as slowly as you can control, catching with the hands. One of the best-evidenced hamstring injury reducers there is, and it will make you sore for days the first time."},{i:"ecc_rdl",n:"Tempo RDL",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.7,d:"Five seconds down, normal speed up, at around 70%. Loads the hamstring at length where it both grows and gets injured."},{i:"ecc_stepdown",n:"Slow Eccentric Step-Down",p:"lunge",m:"strength",e:["box"],u:!0,d:"From a box, lowering one leg over 4 seconds until the heel kisses the floor. Builds knee control before you add any load at all."},{i:"ecc_row",n:"Eccentric-Accentuated Row",p:"hpull",m:"strength",e:["db","bench"],u:!0,d:"Pull with two hands, lower with one over 4 seconds. Doubles the eccentric load without needing a heavier dumbbell."},{i:"ecc_pushup",lowrep:!0,n:"Eccentric Push-Up",p:"hpush",m:"calisthenics",e:[],d:"Five seconds down, drop to the knees, reset. For anyone who cannot yet press from the floor, this is the rung below a knee push-up and it builds more."},{i:"ecc_calf",n:"Eccentric Calf Lower",p:"loco",m:"strength",e:["box"],u:!0,d:"Up on two, down on one over 4 seconds, off a step for full range. The standard answer for Achilles tendon work and it takes twelve weeks, not two."},{i:"acc_bandbench",n:"Banded Bench Press",p:"hpush",m:"strength",e:["barbell","bench","rack","bands"],c:!0,r:"bench",f:.55,d:"Bands anchored to the floor add tension as you press. Bar weight stays light so you can accelerate; the band punishes you for slowing down. Count bar weight only \u2014 band tension is on top."},{i:"acc_chainbench",n:"Chained Bench Press",p:"hpush",m:"strength",e:["barbell","bench","rack","chains"],c:!0,r:"bench",f:.6,d:"Chains deload at the chest and reload at lockout. Kinder to the joints than bands and it teaches you to keep driving through the top."},{i:"acc_bandsquat",n:"Banded Squat",p:"squat",m:"strength",e:["barbell","rack","bands"],c:!0,r:"squat",f:.55,d:"Band tension climbs as you stand, so there is no coasting out of the hole. Pairs naturally with dynamic effort work."},{i:"acc_chainsquat",n:"Chained Squat",p:"squat",m:"strength",e:["barbell","rack","chains"],c:!0,r:"squat",f:.6,d:"Chains pile onto the bar as you rise and unload as you descend. Lighter in the bottom position, which is why cranky hips often tolerate it better."},{i:"acc_banddead",n:"Banded Deadlift",p:"hinge",m:"strength",e:["barbell","bands"],c:!0,r:"dead",f:.55,d:"Band tension increases through the pull, so the lockout becomes the hardest part. Useful when you fail at the top rather than off the floor."},{i:"acc_revband",n:"Reverse-Band Press",p:"hpush",m:"strength",e:["barbell","bench","rack","bands"],c:!0,r:"bench",f:1.1,d:"Bands from the top assist at the chest and release at lockout. Lets you handle supramaximal weight through the range where you are strongest."},{i:"acc_bandgm",n:"Banded Good Morning",p:"hinge",m:"strength",e:["bands"],d:"Band under the feet and over the neck. Almost no spinal compression with real hamstring tension, which makes it a rare option for a back that dislikes loading."},{i:"acc_bandpushdown",n:"Banded Triceps Pushdown",p:"vpush",m:"band",e:["bands"],d:"Tension peaks at lockout where the triceps are shortest. Cheap, joint-friendly, and it travels in a pocket."},{i:"acc_bandwalk",n:"Band-Resisted March",p:"loco",m:"band",e:["bands"],d:"Band at the waist, marching or walking forward against it. Teaches forward lean and horizontal push without the skill demands of a sled."},{i:"lm_press",n:"Landmine Press",p:"vpush",m:"strength",e:["landmine","barbell"],u:!0,d:"Pressing on an arc rather than straight overhead. The angle suits shoulders that dislike true vertical pressing, which makes it the first substitution worth trying when overhead hurts."},{i:"lm_squat",n:"Landmine Squat",p:"squat",m:"strength",e:["landmine","barbell"],c:!0,r:"squat",f:.6,d:"Bar held at the chest, arc guiding the path. The counterbalance lets you sit down between your hips rather than leaning forward \u2014 a good answer for a stiff ankle or a self-conscious front rack."},{i:"lm_row",n:"Landmine Row",p:"hpull",m:"strength",e:["landmine","barbell"],d:"Chest-supported or bent, pulling the end of the bar. The arc keeps the elbow on a friendlier path than a straight-line row."},{i:"lm_rdl",n:"Landmine RDL",p:"hinge",m:"strength",e:["landmine","barbell"],u:!0,d:"Single leg, holding the bar end. The arc gives you feedback on balance that a dumbbell does not, so it is a good teaching tool for a single-leg hinge."},{i:"lm_rotate",n:"Landmine Rotation",p:"rot",m:"core",e:["landmine","barbell"],d:"Bar end held at chest height, arcing side to side. Rotation through the hips with the arms staying long. Keep the range honest \u2014 this is not a lumbar exercise."},{i:"lm_lunge",n:"Landmine Reverse Lunge",p:"lunge",m:"strength",e:["landmine","barbell"],u:!0,d:"Bar at the chest, stepping back. The counterbalance makes it far easier to stay upright than a dumbbell version."},{i:"lm_thruster",n:"Landmine Thruster",p:"vpush",m:"conditioning",e:["landmine","barbell"],sup:["glc"],d:"Squat and press in one movement on the arc. A genuinely hard conditioning piece that stays technically manageable when you are breathing hard."},{i:"lm_hack",n:"Landmine Hack Squat",p:"squat",m:"strength",e:["landmine","barbell"],d:"Straddling the bar, holding it behind you. Quad-dominant with almost no spinal loading \u2014 worth knowing when the low back is the limiter."},{i:"od_stonelift",n:"Atlas Stone Lift",p:"hinge",m:"strongman",e:["stone"],c:!0,d:"Lap the stone, reset the hands, extend to the platform. The most honest test of whole-body strength there is, and it punishes a soft brace immediately. Tacky or sleeves before you load anything heavy."},{i:"od_stoneover",n:"Stone Over Bar",p:"triple",m:"strongman",e:["stone"],d:"Stone lifted and thrown over a bar for reps. Conditioning and strength at once, and the second rep always feels heavier than the first."},{i:"od_kegclean",n:"Keg Clean and Press",p:"triple",m:"strongman",e:["stone"],d:"Shifting water makes the load argue with you mid-lift. Trains bracing against something unpredictable, which is the whole point of odd-object work."},{i:"od_kegcarry",n:"Keg Carry",p:"carry",m:"strongman",e:["stone"],d:"Bear-hug carry with the contents sloshing. Far harder than the same weight in a dumbbell and much closer to carrying anything real."},{i:"od_sbtoss",n:"Sandbag Over Shoulder",p:"triple",m:"strongman",e:["sandbag"],d:"Floor to shoulder, alternating sides. Explosive hip extension with an awkward load \u2014 the most transferable strongman movement to a job that involves lifting people or equipment."},{i:"od_logclean",n:"Log Clean",p:"triple",m:"strongman",e:["log"],d:"Roll to the lap, then to the chest, then stand. The neutral grip is kinder on the wrists than a barbell clean and the thick implement makes it harder everywhere else."},{i:"od_farmerframe",n:"Farmer's Frame Walk",p:"carry",m:"strongman",e:["yoke"],d:"Handles with a real implement rather than dumbbells. The load hangs lower and swings, which changes the grip and trunk demand completely."},{i:"od_tireflip",n:"Tyre Flip",p:"triple",m:"strongman",e:["stone"],d:"Deep hip position, drive through the chest, transition the hands. Technique matters more than strength here and a bad first rep sets the tone for the set."},{i:"cl_mace360",n:"Mace 360",p:"rot",m:"strongman",e:["club"],d:"Mace swung in a full circle behind the head and back. Builds shoulder and grip endurance in ranges nothing else reaches. Start far lighter than your ego suggests."},{i:"cl_mace102",n:"Mace 10-to-2",p:"rot",m:"strongman",e:["club"],d:"Pendulum swings between two clock positions without the full circle. The scaled version of the 360 and where everyone should start."},{i:"cl_clubmill",n:"Club Mill",p:"rot",m:"strongman",e:["club"],d:"Clubs circling in front and behind the body. Trains shoulder mobility under load rather than stretching into it, which is why it holds up better."},{i:"cl_clubswipe",n:"Club Swipe",p:"rot",m:"conditioning",e:["club"],sup:["glc"],d:"Two-handed swing from behind the head through to the front. Conditioning with a rotational and grip bias \u2014 unusual and genuinely demanding."},{i:"cl_clubcast",n:"Club Cast",p:"vpull",m:"strongman",e:["club"],d:"Controlled cast back behind the shoulder and pull to return. Eccentric loading for the shoulder in the overhead position, which almost nothing else offers."},{i:"kb_flow1",n:"Clean \xB7 Press \xB7 Squat Flow",p:"triple",m:"conditioning",e:["kb"],sup:["glc","aer"],d:"One bell, unbroken sequence, switch sides each round. Load is set by the weakest link, which is almost always the press."},{i:"kb_flow2",n:"Swing \xB7 Clean \xB7 Snatch Ladder",p:"hinge",m:"conditioning",e:["kb"],sup:["glc"],d:"Ascending ladder through the ballistic family without putting the bell down. Grip usually fails before the lungs do."},{i:"kb_armbar",n:"Kettlebell Arm Bar",p:"rot",m:"mobility",e:["kb"],d:"Lying, bell locked overhead, rolling slowly into the shoulder. Loaded thoracic rotation and shoulder stability at once. Slow, controlled, light bell."},{i:"kb_bottomsup",n:"Bottoms-Up Clean and Press",p:"vpush",m:"strength",e:["kb"],u:!0,d:"Bell inverted, handle gripped hard. Any wobble and it falls, so it forces a level of shoulder control heavy pressing lets you skip."},{i:"kb_halo",n:"Kettlebell Halo",p:"rot",m:"mobility",e:["kb"],d:"Bell circling the head close to the skull. A good shoulder and thoracic warm-up and a reliable way to find out which side is stiffer."},{i:"kb_doublefront",n:"Double Kettlebell Front Squat",p:"squat",m:"strength",e:["kb"],c:!0,r:"squat",f:.55,d:"Two bells racked on the chest. The rack position compresses your breathing, which is exactly why it builds a brace a barbell front squat does not."},{i:"kb_gobletcarry",n:"Goblet Carry",p:"carry",m:"strongman",e:["kb"],d:"Bell held at the chest, walking. Anti-flexion work disguised as a carry, and the simplest loaded carry to teach."},{i:"gr_gripper",n:"Heavy Gripper Close",p:"carry",m:"strongman",e:["grip"],d:"Crush grip against a torsion gripper. Trains a quality that carries and deadlifts only develop incidentally. Three to five hard efforts per hand."},{i:"gr_pinch",n:"Plate Pinch Hold",p:"carry",m:"strongman",e:["grip"],d:"Two plates pinched smooth-side-out and held. Pinch strength is almost entirely separate from crush strength and almost nobody trains it."},{i:"gr_thickbar",n:"Thick Bar Hold",p:"carry",m:"strongman",e:["log"],d:"Axle or thick handle held at lockout. A fat bar exposes grip weakness immediately and builds it faster than anything with a normal handle."},{i:"gr_towelhang",n:"Towel Hang",p:"vpull",m:"calisthenics",e:["pullup"],d:"Hang from towels over the bar. Crushing grip plus shoulder decompression, and it needs no equipment beyond a gym towel."},{i:"gr_extension",n:"Banded Finger Extension",p:"carry",m:"band",e:["bands"],d:"Opening the fingers against a band. The antagonist to everything else you do with your hands, and the reason a lot of elbow pain never resolves."},{i:"gr_wristroller",n:"Wrist Roller",p:"carry",m:"strongman",e:["grip"],d:"Rolling a weight up and down on a cord. Forearm endurance in both directions, and the burn arrives sooner than you expect."},{i:"oc_casualty",n:"Casualty Drag",p:"carry",m:"conditioning",e:["turf","sandbag"],sup:["alp","glc"],d:"Backward drag of a loaded bag or dummy by the handles. Trains the exact posture and grip a real drag demands, and it is far harder than the weight suggests."},{i:"oc_fireman",n:"Fireman's Carry",p:"carry",m:"strongman",e:["sandbag"],d:"Load across the shoulders, walking. Asymmetric and compressive. Build tolerance in short distances before you make it a test."},{i:"oc_ropeclimb",n:"Rope Climb",p:"vpull",m:"calisthenics",e:["rope"],d:"Legs wrapped for the efficient version, legless once you can. Pulling strength with a grip demand that no machine reproduces."},{i:"oc_ropepull",n:"Seated Rope Pull",p:"hpull",m:"conditioning",e:["rope","sled"],sup:["glc"],d:"Hand-over-hand pull of a loaded sled while seated. Grip, back and lungs at once, and unlike a rope climb anyone can do it on day one."},{i:"oc_wallclimb",n:"Wall Get-Over",p:"triple",m:"calisthenics",e:["box"],d:"Approach, jump, hook and get over. A skill as much as a fitness quality, and the technique saves more energy than the strength does."},{i:"oc_lowcrawl",n:"Low Crawl",p:"loco",m:"conditioning",e:["turf"],sup:["glc"],d:"Belly to the ground, moving on forearms and the inside of the knees. Deceptively taxing and it wrecks a grip that has already been worked."},{i:"oc_breach",n:"Sledge Strike",p:"rot",m:"conditioning",e:["stone","turf"],sup:["alp","glc"],d:"Overhead strikes onto a tyre, alternating sides. Rotational power with a real deceleration demand on the way through."},{i:"oc_loadcarry",n:"Load and Go",p:"carry",m:"conditioning",e:["sandbag","turf"],sup:["glc"],d:"Pick a bag off the floor, carry it a set distance, set it down, repeat. The most job-specific conditioning piece in the library and the least glamorous."},{i:"oc_gearruck",n:"Weighted Ruck Shuttle",p:"loco",m:"conditioning",e:["ruck","turf"],sup:["aer","thr"],d:"Ruck on, shuttling a set distance at pace. Loaded locomotion with turns, which is where load carriage actually hurts people."},{i:"oc_stairload",n:"Loaded Stair Climb",p:"loco",m:"conditioning",e:["hill","ruck"],sup:["thr","aer"],d:"Weighted ascent at a sustainable pace. The most specific preparation for anything involving stairs under load, and the eccentric coming down is the part that makes you sore."},{i:"mc_shoulderpress",n:"Seated Shoulder Press Machine",p:"vpush",m:"strength",e:["selector"],d:"Set the seat so the handles start at roughly shoulder height. A neutral grip is usually kinder if overhead pressing bothers you. Useful when you want vertical pressing volume without the stability cost."},{i:"mc_chestpress",n:"Chest Press Machine",p:"hpush",m:"strength",e:["selector"],d:"Handles should line up with the mid-chest at the start. The fixed path means you can push closer to failure safely, which makes it a good last press of a session."},{i:"mc_row",n:"Seated Row Machine",p:"hpull",m:"strength",e:["selector"],d:"Chest against the pad so the low back stays out of it. Pull to the ribs rather than the chest and pause briefly at the back."},{i:"mc_pulldownmc",n:"Lat Pulldown Machine",p:"vpull",m:"strength",e:["selector"],d:"Thighs pinned, torso near upright, pulling to the collarbone. The scalable stand-in for a pull-up when bodyweight is still too much or you want volume past your rep ceiling."},{i:"mc_legpress",n:"Leg Press",p:"squat",m:"strength",e:["lever"],d:"Feet placed so the knees track over the toes, stopping before the pelvis rolls off the pad. Quad volume with no spinal load, which is why it survives when a back does not."},{i:"mc_hacksquat",n:"Hack Squat Machine",p:"squat",m:"strength",e:["lever"],d:"Back supported, feet slightly forward. Very quad-dominant and it holds you in position, so it is a good place to chase depth without the balance demand."},{i:"mc_legext",n:"Leg Extension",p:"squat",m:"strength",e:["selector"],d:"The only common movement that loads the quad in isolation. Useful for knee tendon work at controlled angles and for quad volume when the hips are already cooked."},{i:"mc_legcurl",n:"Lying or Seated Leg Curl",p:"hinge",m:"strength",e:["selector"],d:"Trains the hamstring at the knee rather than the hip, which the RDL family never touches. The seated version loads a longer muscle length and is the better pick if you only do one."},{i:"mc_pecdeck",n:"Chest Fly Machine",p:"hpush",m:"strength",e:["selector"],d:"Loads the chest at length with no elbow or shoulder demand to speak of. Keep the range where it is comfortable \u2014 the stretched position is the point, not a contest."},{i:"mc_reardelt",n:"Rear Delt Machine",p:"hpull",m:"strength",e:["selector"],d:"Reverse fly on a fixed path. The rear delt is chronically undertrained relative to the front, and this is the easiest way to fix that."},{i:"mc_calfmc",n:"Calf Raise Machine",p:"loco",m:"strength",e:["lever"],d:"Standing for the calf, seated for the soleus. Full range, slow, and a pause at the bottom. Both need loading and the seated version almost never gets it."},{i:"mc_abduction",n:"Hip Abduction Machine",p:"lunge",m:"strength",e:["selector"],d:"Loads the lateral hip directly. Unfashionable and genuinely useful, especially if a knee tends to fall inward under fatigue."},{i:"mc_cablerowsingle",n:"Single-Arm Cable Row",p:"hpull",m:"strength",e:["cable"],u:!0,d:"One arm at a time with the torso resisting rotation. The anti-rotation demand is free and the range is longer than a bar allows."},{i:"mc_facepullmc",n:"Cable Face Pull",p:"hpull",m:"strength",e:["cable"],d:"High pulley, pulling to the forehead with the elbows above the wrists. External rotation and upper back in one movement \u2014 the most efficient shoulder-health exercise there is."},{i:"mc_pushdown",n:"Cable Triceps Pushdown",p:"vpush",m:"strength",e:["cable"],d:"Elbows pinned at the sides. Rope for a longer range, bar for heavier load. A reliable finisher after any pressing session."},{i:"mc_cablecurl",n:"Cable Biceps Curl",p:"hpull",m:"strength",e:["cable"],d:"Constant tension through the range. Worth doing for elbow health as much as for size, particularly if you do a lot of heavy pulling."},{i:"mc_pallof",n:"Cable Pallof Press",p:"antiext",m:"core",e:["cable"],d:"Cable at chest height, pressing straight out while refusing to rotate. Anti-rotation trained directly, which is what the trunk actually does under a heavy carry."},{i:"mc_cablechop",n:"Cable Chop",p:"rot",m:"core",e:["cable"],d:"High to low, rotating through the hips with the arms staying long. Power through rotation without the lumbar doing the turning."},{i:"mc_cablepullthru",n:"Cable Pull-Through",p:"hinge",m:"strength",e:["cable"],d:"Facing away, hinging with the cable between the legs. Teaches the hinge with the load pulling you into it, which is a far better cue than any verbal one."},{i:"mc_beltsquat",n:"Belt Squat",p:"squat",m:"strength",e:["belt"],c:!0,r:"squat",f:.8,d:"Load hangs from the hips, nothing on the spine. The single best squat substitution for a low back that will not tolerate axial loading, and it is not a downgrade."},{i:"mc_assisteddip",n:"Assisted Dip or Pull-Up Machine",p:"vpull",m:"calisthenics",e:["selector"],d:"Counterweight assistance you can dial down week to week. The most controllable progression toward a first unassisted rep."},{i:"ol_blocksnatch",n:"Snatch from Blocks",p:"triple",m:"olympic",e:["barbell","box"],c:!0,r:"clean",f:.78,d:"Starting above the floor removes the first pull, so you can train the second pull without the fatigue and technical noise of the full lift."},{i:"ol_blockclean",n:"Clean from Blocks",p:"triple",m:"olympic",e:["barbell","box"],c:!0,r:"clean",f:1,d:"Set the blocks at the knee or mid-thigh. Each height trains a different part of the pull, so pick the one matching where you break down."},{i:"ol_musclesnatch",n:"Muscle Snatch",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.55,d:"No re-bend of the knees, pulling the bar all the way overhead. Builds the turnover and exposes anyone relying on a fast drop to catch the bar."},{i:"ol_pushpress2",n:"Behind-the-Neck Push Press",p:"vpush",m:"olympic",e:["barbell","rack"],r:"press",f:1.15,d:"Starting behind the neck puts the bar closer to the overhead path. Demands real shoulder range \u2014 skip it if the position is uncomfortable rather than forcing it."},{i:"ol_ohsquat2",n:"Snatch Balance",p:"squat",m:"olympic",e:["barbell","rack"],r:"squat",f:.5,d:"Driving under the bar into an overhead squat. Trains speed under the bar and confidence in the bottom position, which is what most missed snatches lack."},{i:"ol_pullhigh",n:"Snatch-Grip High Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.85,d:"Wide grip, pulling to the chest with the elbows high and out. Trains the finish of the pull without any catch, so it scales to anyone."},{i:"ol_sotspress",n:"Sots Press",p:"vpush",m:"olympic",e:["barbell"],r:"press",f:.35,d:"Pressing overhead from the bottom of a front or overhead squat. Punishingly honest about thoracic and shoulder range. Start with an empty bar and expect that to be enough."},{i:"ol_jerkrecovery",n:"Jerk Recovery",p:"vpush",m:"olympic",e:["barbell","rack"],r:"press",f:1.4,d:"From the split position, recovering to standing with a supramaximal load. Builds confidence under a weight heavier than you can jerk."},{i:"rg_rowring",n:"Ring Row",p:"hpull",m:"calisthenics",e:["rings"],d:"Angle sets the difficulty, so it scales from near-vertical to feet-elevated. The most adjustable horizontal pull there is."},{i:"rg_dipring",n:"Ring Dip",p:"vpush",m:"calisthenics",e:["rings"],d:"Far harder than bar dips because the rings move. Earn a solid support hold before attempting these."},{i:"rg_faceout",n:"Ring Face Pull",p:"hpull",m:"calisthenics",e:["rings"],d:"Pulling to the forehead with external rotation at the end. Shoulder health work that scales by foot position rather than by plate."},{i:"rg_rollout",n:"Ring Rollout",p:"antiext",m:"core",e:["rings"],d:"Anti-extension with a longer lever than an ab wheel. Ribs down and stop well before the low back gives."},{i:"rg_ringrow1",n:"Archer Ring Row",p:"hpull",m:"calisthenics",e:["rings"],u:!0,d:"Pulling to one side while the other arm stays long. The bridge toward a one-arm row progression."},{i:"rg_skinthecat",n:"Skin the Cat",p:"vpull",m:"calisthenics",e:["rings"],d:"Inverting and rotating back through the shoulders. Builds range in the overhead position while loaded, which stretching alone will not."},{i:"sl_lateral",n:"Lateral Sled Drag",p:"lunge",m:"conditioning",e:["sled"],u:!0,sup:["alp","glc"],d:"Side-stepping with the strap at the waist. Loads the lateral hip concentrically with no eccentric cost at all \u2014 rare and useful."},{i:"sl_rotational",n:"Rotational Sled Pull",p:"rot",m:"conditioning",e:["sled"],sup:["glc"],d:"Hand-over-hand pull with a rotational finish. Trains the trunk to transfer force rather than just resist it."},{i:"sl_marchheavy",n:"Heavy Sled March",p:"loco",m:"conditioning",e:["sled"],sup:["glc"],d:"Heavy load, deliberate steps, hard forward lean. Builds the same positions as sprinting at a speed that anyone can control."},{i:"cy_zercher",n:"Zercher Carry",p:"carry",m:"strongman",e:["barbell"],d:"Bar in the crooks of the elbows. Uncomfortable by design and it demands a brace nothing else quite asks for."},{i:"cy_mixed",n:"Mixed Implement Carry",p:"carry",m:"strongman",e:["kb","db"],u:!0,d:"Different weight in each hand, or one racked and one hanging. Forces the trunk to solve an asymmetric problem while you walk."},{i:"cy_bearhug",n:"Bear Hug Carry",p:"carry",m:"strongman",e:["sandbag"],d:"Load squeezed against the chest. Grip is your arms rather than your hands, and the breathing restriction is part of the stimulus."},{i:"inclinepush",n:"Incline Push-Up",p:"hpush",m:"calisthenics",e:["bench"],d:"Hands on a bench, bar or rack pin. The higher the surface the easier it is, so it scales smoothly all the way down to a wall push-up and back up to the floor."},{i:"pikepush",n:"Pike Push-Up",p:"vpush",m:"calisthenics",e:[],d:"Hips high, head lowering to the floor between the hands. The bridge between a push-up and anything overhead, and the honest first step toward a handstand press."},{i:"deficitpike",n:"Elevated Pike Push-Up",p:"vpush",m:"calisthenics",e:["box"],d:"Feet on a box to steepen the angle toward vertical. Raise the box as it gets easy \u2014 that is the progression, not more reps."},{i:"pseudoplanche",n:"Pseudo-Planche Push-Up",p:"hpush",m:"calisthenics",e:[],d:"Hands beside the hips, shoulders leaning well past them. Shifts the load toward the front delt and the straight-arm strength a planche eventually needs."},{i:"bandassist",n:"Band-Assisted Pull-Up",p:"vpull",m:"calisthenics",e:["pullup","bands"],d:"Band under the foot or knee. Assistance is greatest at the bottom where you need it, and you progress by moving to a thinner band rather than doing more reps."},{i:"oneArmProg",n:"One-Arm Pull-Up Progression",p:"vpull",m:"calisthenics",e:["pullup"],u:!0,d:"Working arm on the bar, other hand gripping a towel, your own wrist, or a band \u2014 progressively lower down. A long project measured in months, not weeks."},{i:"benchdip",n:"Bench Dip",p:"vpush",m:"calisthenics",e:["bench"],d:"Hands behind you on a bench, feet on the floor then elevated. Easy to load and easy to overdo \u2014 keep the shoulders out of deep extension."},{i:"splitsq",n:"Split Squat",p:"lunge",m:"calisthenics",e:[],u:!0,d:"Both feet on the floor, rear knee to just above the ground. The first real single-leg rung and the one everything else is built on."},{i:"cal_tuckfl",n:"Tuck Front Lever",p:"vpull",m:"calisthenics",e:["pullup"],d:"Hanging, knees tucked, body horizontal, arms straight. The first real straight-arm pull. Hold for quality seconds, not maximum seconds \u2014 the moment the hips drop, the set is over."},{i:"cal_advtuck",n:"Advanced Tuck Front Lever",p:"vpull",m:"calisthenics",e:["pullup"],d:"Tuck opened toward ninety degrees at the hip. Each degree of opening is a real jump in difficulty, which is what makes it such a finely adjustable progression."},{i:"cal_strdlfl",n:"Straddle Front Lever",p:"vpull",m:"calisthenics",e:["pullup"],d:"Legs straight and wide, shortening the lever. The rung before full, and for most people a destination in its own right."},{i:"cal_backlever",n:"Back Lever Progression",p:"vpull",m:"calisthenics",e:["rings"],d:"Inverted, rotating out until the body is horizontal, face down. Loads the shoulder and biceps tendon in deep extension \u2014 progress slowly and stop the moment the elbows complain."},{i:"cal_tuckplanche",n:"Tuck Planche",p:"hpush",m:"calisthenics",e:[],d:"Knees tucked, feet off the floor, arms straight, shoulders leaning well past the hands. Straight-arm pressing strength, and the wrists usually protest before the shoulders do."},{i:"cal_strplanche",n:"Straddle Planche Progression",p:"hpush",m:"calisthenics",e:[],d:"Legs opening out of the tuck. Measured in months of consistent short holds. Wrist preparation is not optional here."},{i:"cal_hswalk",n:"Handstand Walk",p:"vpush",m:"calisthenics",e:[],d:"Balance and shoulder endurance while moving. A skill first and a strength exercise second, so it belongs early in a session while you are fresh."},{i:"cal_freehs",n:"Freestanding Handstand Hold",p:"vpush",m:"calisthenics",e:[],d:"Practice daily in short sets, never to failure. Accumulate total time rather than chasing one long hold \u2014 the balance is trained by repetitions of the correction, not by endurance."},{i:"cal_clappush",n:"Clapping Push-Up",p:"hpush",m:"power",e:[],d:"Enough air to clap and re-catch. Requires a real plyometric push-up first. Low reps, full recovery, stop the moment the height drops."},{i:"cal_depthpush",n:"Deficit Plyo Push-Up",p:"hpush",m:"power",e:["box"],d:"Hands on low boxes, dropping to the floor and driving back up. Adds a genuine stretch-shortening demand. Advanced, and the wrists take the cost."},{i:"cal_explosivepull",n:"Explosive Pull-Up",p:"vpull",m:"power",e:["pullup"],d:"Pull hard enough that the hands leave the bar, or the chest reaches the bar. The bridge toward a muscle-up and a genuine upper-body power expression."},{i:"cal_jumplunge",n:"Split Jump",p:"lunge",m:"power",e:[],u:!0,d:"Switching feet in the air from a split position. Unilateral lower-body power with no equipment at all."},{i:"cal_hollowrock",n:"Hollow Rock",p:"antiext",m:"calisthenics",e:[],d:"Low back pinned, rocking as one rigid piece. If any part of you bends, the position broke before the set did."},{i:"cal_lsitprog",n:"L-Sit Progression",p:"antiext",m:"calisthenics",e:["box"],d:"Tuck, then one leg, then both. Shoulders depressed and the hips actually lifting. Hip flexor endurance is usually the limiter, not the trunk."}],JOINTS=[["neck","Neck"],["shoulder","Shoulder"],["elbow","Elbow"],["wrist","Wrist / hand"],["thoracic","Mid back"],["lumbar","Low back"],["hip","Hip"],["groin","Groin"],["knee","Knee"],["ankle","Ankle / foot"]],JNAME=e=>{var s;return((s=JOINTS.find(r=>r[0]===e))==null?void 0:s[1])||e},POSITIONS=[["overhead","Overhead","Shoulder flexion under load"],["deepknee","Deep knee flexion","Below parallel, knee travelling forward"],["deephip","Deep hip flexion","Bottom position, hip closed under load"],["dorsi","Loaded dorsiflexion","Shin over toe with weight on it"],["frontrack","Front rack","Wrist, elbow and thoracic extension together"],["axial","Axial spinal load","Weight stacked through the spine"],["hinge","Loaded hinge","Lumbar holding neutral against shear"],["hang","Hanging","Traction through the shoulder and grip"],["er","End-range rotation","Shoulder at the edge of external rotation"],["lengthened" 14 Lower",pats:["squat","lunge","hinge"],rel:!0,d:"Single-leg and unloaded progressions. Skill-dominant work stays early and never goes to failure."},{id:"tbgen",n:"Total body \u2014 General",pats:["squat","hinge","hpush","hpull","triple"],d:"One big lift, full-body support."},{id:"tbvert",n:"Total body \u2014 Vertical lead",pats:["squat","hinge","vpush","vpull"],d:"Overhead and hanging patterns, with the legs carrying the load."},{id:"corestab",n:"Core & Stability",pats:["antiext","rot","carry"],d:"Trunk is the cornerstone, not the afterthought."},{id:"cond",n:"Conditioning",pats:["loco","carry"],d:"Work:rest sets the system."},{id:"speed",n:"Speed & Agility",pats:["loco"],d:"Sprint, change of direction, and acceleration work."},{id:"odd",n:"Strongman / Odd object",pats:["carry","triple","hinge"],d:"Sandbag, log, yoke, ruck \u2014 awkward loads carried and lifted."},{id:"restore",n:"Restoration / Mobility",pats:["mob"],d:"Leave fresher than you arrived."}],E_=e=>EMPHASES.find(s=>s.id===e),EMPH_OK=e=>!!E_(e),validBlock=e=>!!(e&&typeof e=="object"&&EMPH_OK(e.e)&&ZONES.some(s=>s.id===e.z)),METHODS=[{id:"lengthened",n:"Lengthened Partials",steps:0,needs:!0,zones:["hyp","sh","meta"],d:"Full reps to near failure, then continue with partial reps in the stretched half of the range only.",rx:e=>[["Load",`${e.lb(e.rm*.7)} lb`],["Full reps","to 1\u20132 RIR"],["Then","5\u201310 partials, bottom half only"],["Rest","2\u20133 min"],["Sets","3"]],cue:"The stretched position is where the growth stimulus lives, and it's the part you lose first when you fatigue. Partials there extend the useful part of the set rather than just adding junk reps at the top.",cost:5},{id:"onequarter",n:"1\xBC Reps",steps:0,needs:!0,zones:["hyp","sh","strength"],d:"A full rep, then a quarter rep out of the bottom, then complete the rep. Each one counts as a single repetition.",rx:e=>[["Load",`${e.lb(e.rm*.6)} lb`],["Reps","6\u20138"],["Tempo","controlled, no bounce"],["Rest","2\u20133 min"],["Sets","3\u20134"]],cue:"Doubles the time spent in the hardest, most lengthened part of the range. Expect to use noticeably less weight than you'd like \u2014 that's the method working, not you having a bad day.",cost:5},{id:"tempo",n:"Tempo",steps:0,needs:!0,zones:["sh","hyp","strength","end"],d:"The clock governs the rep rather than the load. Four digits: eccentric, pause at the bottom, concentric, pause at the top.",rx:e=>[["Load",`${e.lb(e.rm*.65)} lb`],["Tempo","3-1-1-0"],["Reps","6\u20138"],["Rest","2\u20133 min"],["Sets","3\u20134"]],cue:"Useful when the load has to stay light \u2014 a cranky joint, a deload, a movement you're still learning. The time under tension does the work the weight normally would.",cost:4},{id:"preexhaust",n:"Pre-Exhaust",steps:0,needs:!1,zones:["hyp","meta","sh"],d:"A single-joint movement taken close to failure immediately before the compound that shares the same muscle.",rx:()=>[["Isolation","1 \xD7 12\u201315 to 1 RIR"],["Rest","none"],["Compound","3 \xD7 8\u201312"],["Rest","2\u20133 min between rounds"],["Rounds","3"]],cue:"The theory is that it forces the target muscle to be the limiter in the compound. The evidence for that mechanism is weak \u2014 EMG studies generally do not show it. It's still a reasonable way to get more work into a muscle with less joint load, which is a good enough reason on its own.",cost:5},{id:"density",n:"Density",steps:0,needs:!0,zones:["hyp","meta","end","sh"],d:"Fixed time, two movements, accumulate as many good reps as possible. Progress by beating last session's total in the same time.",rx:e=>[["Time","10\u201315 min"],["Load",`${e.lb(e.rm*.6)} lb`],["Reps per set","about half your max"],["Rest","as needed, keep it short"],["Score","total reps"]],cue:"Never go to failure early \u2014 the score is the whole block, not the first set. Practice-derived rather than research-backed, but it makes progression unusually concrete: you either beat the number or you didn't.",cost:8},{id:"drop",n:"Drop Sets",steps:0,needs:!0,zones:["hyp","meta","sh","end"],d:"Take a set to near failure, cut the load and continue without rest. Extends a set past the point the original weight allows.",rx:e=>[["Top set","to 1\u20132 RIR"],["Drop 1",`\u221220% \u2192 ${e.lb(e.rm*.5)} lb, to failure`],["Drop 2",`\u221220% again \u2192 ${e.lb(e.rm*.4)} lb, to failure`],["Rest","only between full sets, 2\u20133 min"],["Sets","2\u20133"]],cue:"One or two drops, on the last set of a movement only. Three drops on every set is how you accumulate fatigue without accumulating adaptation.",cost:5},{id:"mechdrop",n:"Mechanical Drop Set",steps:0,needs:!1,zones:["hyp","meta","sh"],d:"Keep the load and change the leverage instead \u2014 move to an easier version of the same movement when the harder one fails.",rx:()=>[["Position 1","hardest variation, to failure"],["Position 2","easier angle, to failure"],["Position 3","easiest angle, to failure"],["Rest","2\u20133 min between rounds"],["Rounds","2\u20133"]],cue:"Decline to flat to incline. Deficit to floor to elevated. The load never changes, only the leverage \u2014 which makes it the version that works with fixed weights or bodyweight.",cost:5},{id:"restpause",n:"Rest-Pause",steps:0,needs:!0,zones:["hyp","sh","meta"],d:"One heavy set taken near failure, then short rests and additional mini-sets with the same load.",rx:e=>[["Load",`${e.lb(e.rm*.75)} lb`],["Set 1","to 1 RIR"],["Rest","15\u201320 s"],["Mini-sets","2\u20133 more to failure"],["Total","counts as one set"]],cue:"The short rest is the whole method \u2014 long enough to get a few more reps, short enough that you never recover. One rest-pause cluster per movement is plenty.",cost:6},{id:"superset",n:"Supersets",steps:0,needs:!1,zones:["hyp","sh","meta","end"],d:"Two movements back to back with no rest between them, then a full rest before repeating.",rx:()=>[["Pairing","antagonist, or upper with lower"],["Rest between","none"],["Rest after pair","2\u20133 min"],["Sets","3\u20134 pairs"]],cue:"Only legitimate if the two movements don't compete for the same limiter. Press with row works. Press with dip just makes the second one worse.",cost:4},{id:"giant",n:"Giant Sets",steps:0,needs:!1,zones:["meta","end","hyp"],d:"Four or more movements run back to back, then one long rest.",rx:()=>[["Movements","4\u20135"],["Reps each","8\u201315"],["Rest between","none"],["Rest after round","3\u20134 min"],["Rounds","2\u20134"]],cue:"Order matters more than selection. Put the movement needing the most control first, while you can still do it well.",cost:8},{id:"straight",n:"Straight Sets",steps:0,needs:!1,d:"The zone's own prescription. Sets across at one load."},{id:"me",n:"Max Effort",steps:0,needs:!1,zones:["max","strength"],d:"Work to a top single, double or triple in a chosen variation, then back off. Rotate the variation every one to three weeks \u2014 the method depends on novelty, and the same lift stops producing records quickly.",rx:e=>[["Top set","1\u20133RM"],["Load","90\u2013100%+"],["Ramp","singles after 90%"],["Back-off",`2 \xD7 3 @ ${e.lb(e.rm*.8)} lb`],["Rest","3\u20135 min"]],cue:"The top set is today's max, not a grind past technical failure. If bar speed dies, that was the set.",cost:6},{id:"de",n:"Dynamic Effort",steps:0,needs:!0,zones:["power_sp","power_ss","strength"],d:"Many short sets at a light load moved as fast as possible. Trains rate of force development, not fatigue tolerance \u2014 the short rest is what keeps it a speed session rather than a conditioning one.",rx:e=>[["Sets","8\u201310"],["Reps","2\u20133"],["Load",`${e.lb(e.rm*.45)}\u2013${e.lb(e.rm*.6)} lb`],["% 1RM","45\u201360%"],["Rest","45\u201360 s"],["Intent","Maximal bar speed"]],cue:"Add bands or chains if you have them. End the session the moment bar speed drops, even mid-set.",cost:9},{id:"rep",n:"Repetition Method",steps:0,needs:!1,zones:["hyp","sh","meta","end"],d:"Sets carried to or very near technical failure. The last reps of each set are the ones that count, so the load matters  and volume on a single movement \u2014 run it for the squat or bench and keep everything else in the week minimal.",rx:e=>{const s=[[6,6,70],[7,5,75],[8,4,80],[10,3,85]][e.step-1];return[["Sets",String(s[0])],["Reps",String(s[1])],["Load",`${e.lb(e.rm*s[2]/100)} lb`],["% 1RM",`${s[2]}%`],["Rest","2\u20133 min"],["Next week","add 10\u201320 lb"]]},cue:"This eats recovery. Cut accessory volume hard and don't run it alongside heavy conditioning.",cost:8},{id:"bulgarian",n:"Daily Max",steps:0,needs:!0,zones:["max","strength"],d:"Work to a heavy single for the day, every session, then take back-off work from that number. Autoregulation is the whole method \u2014 today's max is whatever today gives you.",rx:e=>[["Top set","1 @ RPE 9"],["Ramp","singles from 85%"],["Back-off","3\u20135 \xD7 1 @ 90\u201395% of today's top"],["Or","3 \xD7 3 @ 85% of today's top"],["Rest","2\u20134 min"]],cue:"A daily max is not a personal record attempt. If today's single is 85% of last week's, that is the correct load for today.",cost:6}],M_=e=>METHODS.find(s=>s.id===e)||METHODS[0],MODELS=[{id:"linear",n:"Linear",d:"Volume falls and intensity climbs week over week. Predictable and easy to run, best over four to six weeks toward a date."},{id:"dup",n:"Undulating (DUP)",d:"Quality changes day to day rather than week to week. Keeps several qualities warm at once and tolerates missed sessions well."},{id:"block",n:"Block",d:"Accumulation, then transmutation, then realization. Each block builds on the residual of the one before it."},{id:"conjugate",n:"Conjugate",d:"Max-effort and dynamic-effort days every week, with the max-effort variation rotating. Strength and speed stay trained simultaneously."}],SPLITS={2:[{l:"Total body \u2014 horizontal lead",e:"tbgen"},{l:"Total body \u2014 vertical lead",e:"tbvert"}],3:[{l:"Upper \u2014 push",e:"push"},{l:"Lower",e:"rellower"},{l:"Upper \u2014 pull",e:"pull"}],4:[{l:"Upper \u2014 push",e:"push"},{l:"Lower \u2014 knee",e:"knee"},{l:"Upper \u2014 pull",e
