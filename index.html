neck",n:"Deep Neck Flexor Hold",tier:1,rx:"3 \xD7 15\u201320 s",d:"Chin gently tucked, head just off the floor, jaw relaxed. If the front of your throat is straining, the big superficial muscles took over and the drill stopped working."},{i:"rs_neckiso",reg:"neck",n:"Four-Way Neck Isometric",tier:1,rx:"2 \xD7 10 s each way",d:"Hand to forehead, each side, then the back of the head. Press at about half effort with no movement at all. Builds tolerance without asking a cranky neck to travel."},{i:"rs_uppertrap",reg:"neck",n:"Upper Trap Lengthening",tier:1,rx:"2 \xD7 30 s each",d:"Ear toward the opposite shoulder, same-side hand anchored under your hip so the shoulder cannot rise to meet you. Slow and mild."},{i:"rs_suboc",reg:"neck",n:"Suboccipital Release",tier:2,rx:"2 min",d:"Two balls or a folded towel at the base of the skull, breathing slowly. Neck-driven headaches usually live here."},{i:"rs_eriso",reg:"shoulder",n:"External Rotation Isometric",tier:1,rx:"3 \xD7 20 s",d:"Elbow at your side, forearm pressing out against a wall or band at roughly 70% effort, no movement. Loads the cuff hard while the joint stays exactly where it is comfortable."},{i:"rs_scapretract",reg:"shoulder",n:"Scapular Retraction Hold",tier:1,rx:"3 \xD7 20 s",d:"Hanging from a bar or in a ring row, pulling the shoulder blades down and back without bending the elbows. Restores the base the arm works from."},{i:"rs_lowtrap",reg:"shoulder",n:"Prone Lower Trap Raise",tier:1,rx:"3 \xD7 10\u201312",d:"Face down, arms at roughly 45 degrees overhead, thumbs up, lifting just a few inches. Tiny range, light load \u2014 the lower trap is an endurance muscle, not a strength one."},{i:"rs_serratus",reg:"shoulder",n:"Serratus Wall Slide",tier:1,rx:"2 \xD7 8\u201310",d:"Forearms on the wall, pushing away while sliding up. Couples upward rotation with serratus drive, which is what a healthy overhead position is actually built from."},{i:"rs_bandistract",reg:"shoulder",n:"Banded Joint Distraction",tier:2,rx:"2 \xD7 45 s",d:"Band anchored, gentle traction through the joint while you move slowly in and out of a comfortable range. Traction often buys range that stretching alone will not."},{i:"rs_cuffendur",reg:"shoulder",n:"Cuff Endurance Circuit",tier:2,rx:"2 \xD7 15 each",d:"Light band, internal and external rotation, slow and continuous. The cuff fails from lack of endurance far more often than lack of strength."},{i:"rs_wristext",reg:"elbow",n:"Eccentric Wrist Extension",tier:1,rx:"3 \xD7 15, 3 s lower",d:"Lift with the other hand, lower slowly with the affected one. The standard answer for lateral elbow pain, and the slow lowering is the entire active ingredient."},{i:"rs_wristflex",reg:"elbow",n:"Eccentric Wrist Flexion",tier:1,rx:"3 \xD7 15, 3 s lower",d:"Same pattern, palm up. Targets the medial side, the one that shows up after heavy pulling and gripping."},{i:"rs_gripiso",reg:"elbow",n:"Sustained Grip Isometric",tier:1,rx:"3 \xD7 30 s",d:"Squeeze a towel or a light gripper at a steady moderate effort. Loads the forearm without the elbow moving through anything."},{i:"rs_pronsup",reg:"elbow",n:"Loaded Pronation and Supination",tier:2,rx:"2 \xD7 12 each",d:"Hammer or light dumbbell held at one end, rotating slowly. Restores the rotational tolerance that a stiff elbow quietly loses."},{i:"rs_wristload",reg:"wrist",n:"Load-Bearing Progression",tier:1,rx:"3 \xD7 20\u201330 s",d:"Fist, then knuckles, then flat palm \u2014 only progressing when the current position is genuinely painless. Rebuilds the ability to carry weight through the hand."},{i:"rs_wristcar",reg:"wrist",n:"Wrist CARs",tier:1,rx:"2 \xD7 5 each direction",d:"Slow controlled circles with the forearm still. Both a warm-up and an honest test of where the range actually stops."},{i:"rs_tendglide",reg:"wrist",n:"Tendon Glides",tier:1,rx:"2 \xD7 8 cycles",d:"Straight fingers, hook, fist, tabletop, in sequence. Keeps the tendons moving freely in their sheaths after heavy gripping."},{i:"rs_wristecc",reg:"wrist",n:"Wrist Eccentric Series",tier:2,rx:"3 \xD7 12, 3 s lower",d:"Light dumbbell, flexion and extension, lowering slowly. Build tolerance before you ask the wrist to hold a front rack again."},{i:"rs_textension",reg:"thoracic",n:"Supported Thoracic Extension",tier:1,rx:"2 \xD7 6\u20138",d:"Mid back over a roller or bench edge, ribs held down, extending only where the roller sits. Keep it segmental \u2014 if the low back is doing the bending, move the roller."},{i:"rs_openbook",reg:"thoracic",n:"Open Book Rotation",tier:1,rx:"2 \xD7 8 each",d:"Side lying, knees stacked, top arm opening across. Rotation from the mid back rather than the low back, which is where most people lose it first."},{i:"rs_threadneedle",reg:"thoracic",n:"Thread the Needle",tier:1,rx:"2 \xD7 8 each",d:"Quadruped, one arm threading under the body. Lets the shoulder blade move, which makes it a better rotation drill than most spinal twists."},{i:"rs_seatedrot",reg:"thoracic",n:"Seated Rotation Holds",tier:1,rx:"3 \xD7 20 s each",d:"Seated tall, rotating to the end of a comfortable range and holding with slow breathing. Rotation tolerance is trained by time, not by force."},{i:"rs_pressup",reg:"thoracic",n:"Prone Press-Up",tier:2,rx:"2 \xD7 10",d:"Pressing the chest up with the hips staying down. Restores extension after a day of sitting, which is most days."},{i:"rs_curlup",reg:"lumbar",n:"Modified Curl-Up",tier:1,rx:"3 \xD7 6\u20138, 8 s holds",d:"One knee bent, hands under the low back, lifting only the head and shoulders a couple of inches. The hands keep the spine from flattening, which is the whole point."},{i:"rs_sideplank",reg:"lumbar",n:"Side Plank",tier:1,rx:"3 \xD7 20\u201330 s each",d:"From the knees or the feet, hips stacked and driven up. Loads the lateral trunk without asking the spine to bend or twist under load."},{i:"rs_birddog",reg:"lumbar",n:"Bird Dog",tier:1,rx:"3 \xD7 6\u20138 each, 6 s holds",d:"Opposite arm and leg, ribs down, hips level. If the low back arches to finish the rep, shorten the reach."},{i:"rs_deadbug",reg:"lumbar",n:"Dead Bug",tier:1,rx:"3 \xD7 8 each",d:"Low back pressed flat, opposite arm and leg reaching out slowly on a long exhale. The exhale is what keeps the ribs down."},{i:"rs_hipbreath",reg:"lumbar",n:"90/90 Breathing",tier:2,rx:"5 \xD7 5 breaths",d:"Feet on a wall, hips and knees at ninety degrees, long exhale with a brief pause. Restores the stacked rib-over-pelvis position that heavy loading flattens out."},{i:"rs_hingepat",reg:"lumbar",n:"Dowel Hinge Patterning",tier:2,rx:"3 \xD7 10",d:"Dowel along the spine touching head, mid back and tailbone, hinging without losing any contact point. Rebuilds the pattern before you reload it."},{i:"rs_9090",reg:"hip",n:"90/90 Hip Switch",tier:1,rx:"3 \xD7 8 each",d:"Seated, switching the legs side to side under control. Trains internal and external rotation, which is where most stiff hips are actually stuck."},{i:"rs_hipcar",reg:"hip",n:"Hip CARs",tier:1,rx:"2 \xD7 5 each",d:"Slow circles at the largest range you control without the pelvis moving. If the low back compensates, the circle is too big."},{i:"rs_gmediso",reg:"hip",n:"Glute Medius Isometric",tier:1,rx:"3 \xD7 30 s each",d:"Side lying or in a wall lean, holding the leg out against resistance. Builds lateral hip endurance, which is what keeps a knee tracking."},{i:"rs_hipflexecc",reg:"hip",n:"Eccentric Hip Flexor Lower",tier:2,rx:"3 \xD7 8 each, 4 s",d:"From a supported tabletop position, lowering one leg slowly. Strengthens the hip flexor at length rather than just stretching it."},{i:"rs_hipairplane",reg:"hip",n:"Hip Airplane",tier:2,rx:"2 \xD7 6 each",d:"Standing on one leg, hinged, rotating the pelvis open and closed. Demanding \u2014 hold a rack for balance so the hip does the work instead of the ankle."},{i:"rs_couchmild",reg:"hip",n:"Mild Couch Stretch",tier:1,rx:"2 \xD7 45 s each",d:"Rear foot elevated, glute squeezed, pelvis tucked. The squeeze is what makes it a hip flexor stretch instead of a low back
