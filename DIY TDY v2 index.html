<script>const LS={async get(a){const r=localStorage.getItem(a);return r===null?null:{key:a,value:r}},async set(a,r){return localStorage.setItem(a,r),{key:a,value:r}}},{useState,useEffect,useMemo}=React,CSS=`
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

.cs-root {
  --iron:#0F1216; --plate:#171C22; --raised:#1E242C; --rule:#2B333D;
  --chalk:#E7E5E0; --mute:#8A929C; --dim:#5C646E;
  --red:#C8102E; --blue:#0B62C4; --yellow:#EFBE12; --green:#159652; --white:#EDEAE2;
  background:var(--iron); color:var(--chalk); min-height:100vh;
  font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.cs-root *{box-sizing:border-box;}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 120px;}

.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.045em;font-weight:600;line-height:1.05;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

.mast{padding:26px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:18px;}
.mast h1{margin:0;font-size:40px;}
.mast .sub{color:var(--mute);font-size:12.5px;margin-top:6px;max-width:54ch;}
.stamp{display:inline-block;border:1px solid var(--rule);padding:2px 7px;font-size:10px;letter-spacing:.16em;color:var(--dim);margin-bottom:10px;}

.rail{display:flex;gap:2px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px;scrollbar-width:none;}
.rail::-webkit-scrollbar{display:none;}
.rail button{flex:0 0 auto;background:var(--plate);border:1px solid var(--rule);border-bottom:2px solid var(--rule);
  color:var(--dim);padding:8px 11px;font-size:11px;cursor:pointer;white-space:nowrap;}
.rail button .n{font-family:'IBM Plex Mono',monospace;margin-right:6px;color:var(--dim);}
.rail button.done{color:var(--mute);border-bottom-color:var(--dim);}
.rail button.on{color:var(--chalk);background:var(--raised);border-bottom-color:var(--yellow);}
.rail button.on .n{color:var(--yellow);}

.panel{border:1px solid var(--rule);background:var(--plate);margin-bottom:14px;}
.panel > h2{margin:0;font-size:19px;padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.panel > h2 .aside{font-size:11px;letter-spacing:.1em;color:var(--dim);font-family:'IBM Plex Mono',monospace;text-transform:none;}
.body{padding:14px;}
.lede{color:var(--mute);font-size:13px;margin:0 0 14px;}
.klabel{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;}

label.fld{display:block;margin-bottom:12px;}
label.fld .k{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:5px;}
input[type=number],input[type=text]{width:100%;background:var(--iron);border:1px solid var(--rule);color:var(--chalk);
  padding:10px 11px;font-family:'IBM Plex Mono',monospace;font-size:16px;border-radius:0;}
input:focus{outline:2px solid var(--yellow);outline-offset:-2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--iron);border:1px solid var(--rule);color:var(--mute);padding:8px 11px;font-size:12.5px;cursor:pointer;text-align:left;}
.chip:hover{border-color:var(--dim);color:var(--chalk);}
.chip.on{background:var(--raised);border-color:var(--chalk);color:var(--chalk);}
.chip:focus-visible{outline:2px solid var(--yellow);outline-offset:1px;}
.chip .pc{font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-left:6px;}

.opt{display:block;width:100%;text-align:left;background:var(--iron);border:1px solid var(--rule);
  color:var(--chalk);padding:11px 12px;margin-bottom:6px;cursor:pointer;}
.opt:hover{border-color:var(--dim);}
.opt.on{border-color:var(--chalk);background:var(--raised);}
.opt .t{font-size:14.5px;}
.opt .d{font-size:11.5px;color:var(--mute);margin-top:3px;}
.opt .tag{float:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);}

.blockcard{border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--iron);padding:13px;margin-bottom:12px;}
.blockcard .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.blockcard .bt{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:14px;}
.explain{font-size:12px;color:var(--mute);border-left:2px solid var(--rule);padding-left:9px;margin:9px 0 13px;}

.btn{background:var(--yellow);color:#0F1216;border:none;padding:13px 20px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.09em;font-size:16px;font-weight:600;cursor:pointer;width:100%;}
.btn:disabled{background:var(--rule);color:var(--dim);cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--rule);}
.btn.ghost:hover{color:var(--chalk);border-color:var(--dim);}
.btnrow{display:flex;gap:8px;margin-top:14px;}

.lat{border:1px solid var(--rule);background:var(--plate);margin-bottom:14px;}
.latscroll{overflow-x:auto;}
.latinner{min-width:540px;padding:12px 14px 14px;}
.latrow{display:flex;align-items:stretch;margin-bottom:3px;}
.latkey{flex:0 0 62px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;}
.lattrack{flex:1;display:flex;gap:2px;}
.latcell{flex:1;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 4px;text-align:center;
  color:var(--mute);background:var(--iron);border-top:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.latcell.hot{color:#0F1216;font-weight:600;}
.latcell.hot2{outline:1px dashed rgba(231,229,224,.55);outline-offset:-2px;}
.latcap{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--dim);
  font-family:'IBM Plex Mono',monospace;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);}

.slot{border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--plate);margin-bottom:8px;}
.slot .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule);}
.slot .role{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-family:'IBM Plex Mono',monospace;}
.slot .bd{padding:11px 12px;}
.slot .ex{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:21px;letter-spacing:.03em;line-height:1.1;}
.slot.corner{border-left-width:5px;}
.rx{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;}
.rx div{min-width:58px;}
.rx .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);}
.rx .v{font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:2px;}
.cue{font-size:12px;color:var(--mute);margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);}
.swap{background:transparent;border:1px solid var(--rule);color:var(--mute);font-size:10.5px;
  padding:5px 9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.swap:hover{color:var(--chalk);border-color:var(--dim);}
.hdtools{display:flex;gap:6px;align-items:center;flex:0 0 auto;}
.swap.q{color:var(--yellow);border-color:#3A3527;}
.swap.q:hover{border-color:var(--yellow);color:var(--yellow);}
.exlink{background:none;border:none;padding:0;margin:0;cursor:pointer;color:inherit;text-align:left;
  font:inherit;display:block;border-bottom:1px dotted var(--dim);}
.exlink:hover{border-bottom-color:var(--yellow);color:#fff;}
.exlink:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;}

.divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;}
.divider .ln{flex:1;height:1px;background:var(--rule);}
.divider .lb{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}

.note{border:1px solid var(--rule);border-left:3px solid var(--yellow);background:var(--plate);padding:11px 13px;font-size:12.5px;color:var(--mute);margin-bottom:12px;}
.note b{color:var(--chalk);font-weight:600;}
.warn{border-left-color:var(--red);}
.ok{border-left-color:var(--green);}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:12px;}
.readout > div{background:var(--plate);padding:9px 10px;}
.readout .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);}
.readout .v{font-family:'IBM Plex Mono',monospace;font-size:17px;margin-top:3px;}

.optin{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--mute);
  border:1px solid var(--rule);background:var(--iron);padding:11px 12px;margin:12px 0;cursor:pointer;}
.optin input{margin-top:2px;accent-color:var(--yellow);width:17px;height:17px;flex:0 0 auto;}
.optin span{line-height:1.45;}
input[type=text]::placeholder{color:#3D444D;}
.ledger{display:flex;flex-wrap:wrap;gap:5px;}
.led{font-family:'IBM Plex Mono',monospace;font-size:10.5px;border:1px solid var(--rule);padding:5px 8px;color:var(--dim);}
.led.stale{border-color:var(--red);color:var(--red);}
.led.fresh{border-color:var(--green);color:var(--green);}

.lib{border-bottom:1px solid var(--rule);padding:12px 0;scroll-margin-top:20px;}
.lib:last-child{border-bottom:none;}
.lib.target{background:var(--raised);border-left:3px solid var(--yellow);padding-left:11px;margin-left:-11px;}
.lib.target h3{color:var(--yellow);}
.backbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:1px solid var(--rule);border-left:3px solid var(--yellow);background:var(--raised);
  padding:10px 12px;margin-bottom:12px;}
.backbar span{font-size:12.5px;color:var(--mute);}
.backbar b{color:var(--chalk);}
.lib .ln{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.lib h3{margin:0;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:19px;letter-spacing:.03em;font-weight:600;}
.lib .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
.lib p{margin:7px 0 0;font-size:13px;color:var(--mute);}
.lib a{color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-decoration:none;
  border:1px solid var(--rule);padding:5px 9px;white-space:nowrap;flex:0 0 auto;}
.lib a:hover{border-color:var(--yellow);}
.secthead{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;
  color:var(--dim);border-bottom:1px solid var(--rule);padding:16px 0 6px;margin-bottom:2px;}

@media (max-width:560px){
  .mast h1{font-size:31px;}
  .slot .ex{font-size:18px;}
  .latcap{flex-direction:column;gap:3px;}
}
@media (prefers-reduced-motion:no-preference){
  .panel,.slot{animation:rise .22s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
}
`,C={red:"#C8102E",blue:"#0B62C4",yellow:"#EFBE12",green:"#159652",white:"#EDEAE2"},plate=a=>a>=85?C.red:a>=70?C.blue:a>=55?C.yellow:a>=40?C.green:C.white,LATTICE=[{pct:"90\u2013100",reps:"1\u20133",rir:"0\u20132",rpe:"9\u201310",intent:"Grind ok",sys:"Phosphagen",rest:"3\u20135 min",lo:90,hi:100},{pct:"80\u201390",reps:"3\u20136",rir:"1\u20133",rpe:"7\u20139",intent:"Max force",sys:"Phosphagen",rest:"3\u20134 min",lo:80,hi:90},{pct:"70\u201380",reps:"6\u201310",rir:"1\u20133",rpe:"7\u20139",intent:"Fast concentric",sys:"Phos\u2192Glyc",rest:"2\u20133 min",lo:70,hi:80},{pct:"60\u201370",reps:"10\u201315",rir:"0\u20132",rpe:"8\u201310",intent:"Tension",sys:"Glycolytic",rest:"60\u201390 s",lo:60,hi:70},{pct:"50\u201360",reps:"15\u201320",rir:"0\u20131",rpe:"9\u201310",intent:"No lockout rest",sys:"Glycolytic",rest:"45\u201375 s",lo:50,hi:60},{pct:"30\u201350",reps:"20+ / ballistic",rir:"2\u20134",rpe:"6\u20138",intent:"Max velocity",sys:"Phos (ballistic)",rest:"30 s / 2\u20133 min",lo:30,hi:50}],ZONES=[{id:"power_ss",name:"Power \u2014 Strength-Speed",lo:75,hi:90,reps:[1,3],sets:[4,6],rir:"\u2014",rpe:"6\u20138",intent:"Peak velocity under heavy load. End the set when bar speed drops, not when reps run out.",sys:"Phosphagen",rest:[150,300],setSec:236,desc:"Cleans, jerks, heavy loaded jumps. Velocity is the target; fatigue is the enemy."},{id:"power_sp",name:"Power \u2014 Speed-Strength",lo:30,hi:60,reps:[3,5],sets:[4,6],rir:"\u2014",rpe:"6\u20138",intent:"Maximal intent against minimal load. Every rep is an attempt at a personal record.",sys:"Phosphagen",rest:[120,180],setSec:182,desc:"Throws, bounds, jumps, light ballistics."},{id:"max",name:"Maximal Strength",lo:87,hi:100,reps:[1,3],sets:[3,6],rir:"1\u20133",rpe:"7\u20139",intent:"Move a maximal load. Grinding permitted on the final rep only.",sys:"Phosphagen",rest:[180,300],setSec:266,desc:"Neural. Low reps, full recovery, no metabolic residue."},{id:"strength",name:"Strength",lo:80,hi:88,reps:[3,6],sets:[3,6],rir:"2\u20133",rpe:"7\u20138",intent:"Maximal concentric force against a submaximal load.",sys:"Phosphagen",rest:[150,240],setSec:227,desc:"The everyday driver. Repeatable week to week with low technical decay."},{id:"sh",name:"Strength\u2013Hypertrophy",lo:70,hi:80,reps:[6,10],sets:[3,5],rir:"1\u20133",rpe:"7\u20139",intent:"Fast concentric, controlled 2\u20133 s eccentric.",sys:"Phosphagen \u2192 Glycolytic",rest:[90,180],setSec:179,desc:"Where bodyweight-on-the-bar usually lands for a trained lifter."},{id:"hyp",name:"Hypertrophy",lo:65,hi:75,reps:[8,12],sets:[3,5],rir:"0\u20132",rpe:"8\u201310",intent:"Tension through full range. Own the stretched position.",sys:"Glycolytic",rest:[60,120],setSec:140,desc:"Hard sets taken near failure are the currency."},{id:"meta",name:"Metabolite Hypertrophy",lo:50,hi:65,reps:[12,20],sets:[2,4],rir:"0\u20131",rpe:"9\u201310",intent:"Continuous tension. No resting at lockout.",sys:"Glycolytic",rest:[45,75],setSec:128,desc:"Occlusion-flavoured. Useful for joints that no longer tolerate heavy load."},{id:"end",name:"Muscular Endurance",lo:40,hi:55,reps:[15,25],sets:[2,4],rir:"1\u20133",rpe:"7\u20139",intent:"Repeatable pace. Posture should fail before the muscle does.",sys:"Glycolytic \u2192 Oxidative",rest:[30,60],setSec:125,desc:"Work capacity and tissue tolerance."},{id:"cond",name:"Conditioning",lo:30,hi:50,reps:[0,0],sets:[4,10],rir:"\u2014",rpe:"6\u20139",intent:"Hold the assigned pace. The interval decides the system, not the effort.",sys:"Set by work:rest",rest:[60,180],setSec:150,desc:"Intervals, carries, sled, erg."},{id:"restore",name:"Restoration",lo:30,hi:50,reps:[8,15],sets:[2,3],rir:"4+",rpe:"\u22645",intent:"Positional control and full-range breathing. Never approach failure.",sys:"Aerobic",rest:[30,60],setSec:100,desc:"Blood flow, range of motion, downregulation."}],Z=a=>ZONES.find(r=>r.id===a),QPRIO={power_ss:1,power_sp:2,max:3,strength:4,sh:5,hyp:6,meta:7,end:8,cond:9,restore:10},LIGHTER=["max","strength","sh","hyp","meta","end"],nextLighter=a=>{const r=LIGHTER.indexOf(a);return r===-1?"hyp":LIGHTER[Math.min(r+2,LIGHTER.length-1)]},EQUIP=[["barbell","Barbell + plates"],["rack","Rack / stands"],["bench","Bench"],["db","Dumbbells"],["kb","Kettlebells"],["pullup","Pull-up bar"],["bands","Bands"],["cable","Cable / machines"],["traps","Trap bar"],["rings","Rings / suspension"],["box","Box / plyo box"],["medball","Med ball"],["ghd","GHD / back-ext bench"],["sled","Sled / prowler"],["track","Track"],["turf","Turf strip / field"],["hill","Hill or stairs"],["road","Open road / trail"],["bike","Assault / air bike"],["rower","Rowing erg"],["ski","Ski erg"],["tread","Treadmill"],["curve","Curved treadmill"],["sandbag","Sandbag"],["ruck","Ruck / weighted pack"],["log","Log or axle"],["yoke","Yoke / frame"]],EQNAME=a=>{var r;return((r=EQUIP.find(b=>b[0]===a))==null?void 0:r[1])||a},PRESETS={"Full weight room":["barbell","rack","bench","db","kb","pullup","bands","cable","traps","rings","box","medball","ghd","sled","bike","rower","ski","tread","turf"],"Garage gym":["barbell","rack","bench","db","kb","pullup","bands","box","sandbag","road"],"Track & field":["track","turf","hill","medball","sled","bands","pullup"],"Tactical / austere":["ruck","sandbag","pullup","bands","road","hill","turf"],Strongman:["barbell","rack","log","yoke","sandbag","sled","db","kb","turf"],"Hotel / TDY":["db","bands","tread","bike"],"Bodyweight + bands":["bands","pullup"]},migrateEquip=a=>a.includes("erg")?[...new Set([...a.filter(r=>r!=="erg"),"bike","rower","ski","tread"])]:a,PAT={hpush:"Horizontal Push",vpush:"Vertical Push",hpull:"Horizontal Pull",vpull:"Vertical Pull",squat:"Squat / Knee",hinge:"Hinge / Hip",lunge:"Unilateral / Lunge",triple:"Triple Extension",carry:"Loaded Carry",rot:"Rotation / Anti-Rotation",antiext:"Anti-Extension",loco:"Locomotion",mob:"Mobility"},ANTAG={hpush:["hpull"],hpull:["hpush"],vpush:["vpull"],vpull:["vpush"],squat:["hinge"],hinge:["squat"],lunge:["hinge"],triple:["hpull","hinge"],carry:["rot"],rot:["antiext"],antiext:["rot"],loco:["antiext"],mob:["antiext"]},SYN={hpush:["hpush","vpush"],vpush:["vpush","hpush"],hpull:["hpull","vpull"],vpull:["vpull","hpull"],squat:["squat","lunge"],hinge:["hinge","lunge"],lunge:["lunge","squat"],triple:["squat","hinge","vpush"],carry:["carry","hinge"],rot:["rot","antiext"],antiext:["antiext","carry"],loco:["lunge","loco"],mob:["mob"]},AXIAL=["squat","hinge","triple","carry","vpush"],EX=[{i:"bench",n:"Barbell Bench Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:1,c:1,d:"Supine barbell press from chest to lockout. Shoulder blades retracted and pinned, feet driving the floor; the bar travels a shallow arc from the lower chest to over the shoulder, not straight up."},{i:"incline",n:"Incline Barbell Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:.85,c:1,d:"Bench press on a 30\u201345\xB0 incline. Shifts emphasis to the clavicular pec and anterior deltoid and typically runs 12\u201318% below a flat bench max."},{i:"floorpress",n:"Barbell Floor Press",p:"hpush",m:"strength",e:["barbell"],r:"bench",f:.92,c:1,d:"Bench press performed lying on the floor. The floor caps the eccentric near 90\xB0 of elbow flexion, removing the stretch reflex and loading the lockout half of the press."},{i:"dbbench",n:"Dumbbell Bench Press",p:"hpush",m:"strength",e:["db","bench"],r:"bench",f:.4,c:1,d:"Bench press with a dumbbell in each hand. Longer range of motion and independent limb loading, so each side must stabilize its own path. Prescribed load is per hand."},{i:"dbincline",n:"Dumbbell Incline Press",p:"hpush",m:"strength",e:["db","bench"],r:"bench",f:.35,d:"Incline press with dumbbells. The most shoulder-friendly way to add upper-chest volume once the barbell press has already been trained hard. Load is per hand."},{i:"dip",n:"Weighted Dip",p:"hpush",m:"calisthenics",e:["rings"],c:1,d:"Body lowered between bars or rings until the shoulder is level with or just below the elbow, then pressed to lockout. Forward torso lean biases the chest; a vertical torso biases the triceps."},{i:"pushup",n:"Push-Up",p:"hpush",m:"calisthenics",e:[],d:"Closed-chain horizontal press with the body held in one rigid line from ear to ankle. Scapulae must be allowed to protract at the top, which the bench press does not permit."},{i:"ringpush",n:"Ring Push-Up",p:"hpush",m:"calisthenics",e:["rings"],d:"Push-up on unstable rings. The rotational freedom lets the shoulder find its own path and demands far more serratus and rotator cuff control than a floor push-up."},{i:"plyopush",n:"Plyometric Push-Up",p:"hpush",m:"power",e:[],c:1,d:"Push-up driven hard enough that the hands leave the floor. Trains rate of force development in the press pattern. Land with soft, unlocked elbows and reset between reps."},{i:"mbchest",n:"Med Ball Chest Pass",p:"hpush",m:"power",e:["medball"],c:1,d:"Two-handed med ball drive off the chest into a wall or partner. Because the ball leaves the hands there is no deceleration phase, so intent stays maximal all the way through."},{i:"bandpress",n:"Band Chest Press",p:"hpush",m:"band",e:["bands"],d:"Standing press against band tension anchored behind you. Resistance rises as you approach lockout, which matches the strength curve of the press and spares the shoulder at the bottom."},{i:"cablefly",n:"Cable Fly",p:"hpush",m:"strength",e:["cable"],d:"Single-joint pec isolation with the elbows held at a fixed soft angle. Constant cable tension keeps load on the muscle at end-range, where free weights unload."},{i:"ohp",n:"Standing Overhead Press",p:"vpush",m:"strength",e:["barbell"],r:"press",f:1,c:1,d:"Strict press from the front rack to overhead with no leg drive. Ribs stay down and glutes stay tight; the head moves through as the bar passes the forehead so the bar finishes over the mid-foot."},{i:"pushpress",n:"Push Press",p:"vpush",m:"power",e:["barbell"],r:"press",f:1.25,c:1,d:"Overhead press initiated with a short vertical dip and aggressive leg drive. The legs move the bar past the sticking point, allowing roughly 20\u201330% more load than a strict press."},{i:"dbshoulder",n:"Seated DB Shoulder Press",p:"vpush",m:"strength",e:["db","bench"],d:"Seated vertical press with dumbbells. Removing the legs and lower back isolates the deltoid and lets each shoulder press in its own plane. Load is per hand."},{i:"kbpress",n:"Single-Arm KB Press",p:"vpush",m:"strength",e:["kb"],u:1,d:"One-arm overhead press with the bell resting on the back of the forearm. The offset load turns it into an anti-lateral-flexion trunk exercise as much as a shoulder press."},{i:"landmine",n:"Half-Kneeling Landmine Press",p:"vpush",m:"strength",e:["barbell"],u:1,d:"Barbell in a landmine pressed from a half-kneeling stance. The arcing bar path sits between horizontal and vertical, which is friendlier to shoulders that do not tolerate true overhead work."},{i:"hspu",n:"Pike / Handstand Push-Up",p:"vpush",m:"calisthenics",e:[],d:"Inverted vertical press, feet elevated for the pike version or against a wall for the full version. Demands overhead range of motion and heavy trunk bracing before load is ever added."},{i:"mbslam",n:"Overhead Med Ball Throw",p:"vpush",m:"power",e:["medball"],c:1,d:"Ball taken overhead and thrown forward or down with full body extension. Trains the finish of an overhead press pattern with no braking demand."},{i:"bandohp",n:"Band Overhead Press",p:"vpush",m:"band",e:["bands"],d:"Overhead press against a band anchored under the feet. Accommodating resistance loads the lockout and lets you train the pattern with negligible joint compression."},{i:"bbrow",n:"Barbell Bent-Over Row",p:"hpull",m:"strength",e:["barbell"],r:"bench",f:.78,c:1,d:"Bar rowed to the lower ribs from a hinged torso held near 45\xB0. The hinge position is the limiting factor: when the back rounds or the torso rises, the set is over."},{i:"pendlay",n:"Pendlay Row",p:"hpull",m:"strength",e:["barbell"],r:"bench",f:.72,c:1,d:"Row from a dead stop on the floor with the torso parallel to the ground. Every rep restarts from zero velocity, which removes momentum and makes it a genuine concentric strength exercise."},{i:"dbrow",n:"Single-Arm DB Row",p:"hpull",m:"strength",e:["db","bench"],u:1,d:"One-arm row supported on a bench. The free range of motion allows full scapular protraction and retraction, and the unilateral load exposes side-to-side differences."},{i:"csrow",n:"Chest-Supported Row",p:"hpull",m:"strength",e:["db","bench"],d:"Row from an inclined bench with the chest supported. Removing the lower back from the equation makes this the safest way to accumulate pulling volume late in a session."},{i:"invrow",n:"Inverted Row",p:"hpull",m:"calisthenics",e:["rings"],d:"Bodyweight row hanging beneath rings or a bar with the body rigid. Load is adjusted by changing foot position. The most direct horizontal counterbalance to push-up volume."},{i:"cablerow",n:"Seated Cable Row",p:"hpull",m:"strength",e:["cable"],d:"Seated row with constant cable tension. The torso should stay quiet; the movement is scapular retraction followed by elbow flexion, not a repeated hinge."},{i:"facepull",n:"Face Pull",p:"hpull",m:"band",e:["bands"],d:"High rope or band pulled to the face with the elbows above the wrists, finishing in external rotation. Targets the lower trap, rear delt, and external rotators that pressing volume tends to outpace."},{i:"bandrow",n:"Band Row",p:"hpull",m:"band",e:["bands"],d:"Horizontal row against band tension. Load rises through the contraction, so the hardest point is full retraction, which is where most lifters are weakest."},{i:"pullup",n:"Weighted Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],c:1,d:"Pronated-grip pull from a full dead hang to chin over bar, with load added at the waist. Initiate by depressing the scapulae before the elbows bend."},{i:"chinup",n:"Chin-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"Supinated-grip vertical pull. More biceps involvement and a generally stronger position than the pull-up, which makes it the better choice when accumulating volume."},{i:"pulldown",n:"Lat Pulldown",p:"vpull",m:"strength",e:["cable"],d:"Machine vertical pull that allows sub-bodyweight loading and precise progression. Useful for high-rep lat work or for lifters who cannot yet perform pull-ups."},{i:"bandpd",n:"Band Lat Pulldown",p:"vpull",m:"band",e:["bands"],d:"Vertical pull against a band anchored overhead. Best used as scapular activation before pressing or pulling, or for pulling volume with no equipment."},{i:"backsquat",n:"Back Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:1,c:1,d:"Bar on the upper back, hips descending to at least parallel and driving back up. The bar stays over the mid-foot the whole time; where the torso angle sits depends on high-bar versus low-bar placement."},{i:"frontsquat",n:"Front Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.85,c:1,d:"Bar racked on the anterior deltoids with elbows high. The upright torso shifts demand toward the quads and upper back, and the rack position self-limits load once posture fails."},{i:"boxsquat",n:"Box Squat",p:"squat",m:"strength",e:["barbell","rack","box"],r:"squat",f:.95,c:1,d:"Squat to a controlled touch on a box, then drive up. The box standardizes depth and can be used to pause and kill the stretch reflex, training pure starting strength out of the hole."},{i:"goblet",n:"Goblet Squat",p:"squat",m:"strength",e:["kb"],d:"Squat holding a kettlebell at the chest. The front-loaded position acts as a counterweight that makes depth and an upright torso easier, which is why it teaches the pattern so well."},{i:"bwsquat",n:"Tempo Bodyweight Squat",p:"squat",m:"calisthenics",e:[],d:"Unloaded squat performed on a deliberate count, typically 3 seconds down with a pause at the bottom. Builds position and tissue tolerance without any spinal load."},{i:"jumpsquat",n:"Loaded Jump Squat",p:"squat",m:"power",e:["db"],c:1,d:"Countermovement jump holding light load, roughly 20\u201330% of squat max or a pair of moderate dumbbells. Trains the speed-strength end of the squat pattern; stop the set when jump height drops."},{i:"boxjump",n:"Box Jump",p:"squat",m:"power",e:["box"],c:1,d:"Maximal jump onto a box, then step down. Landing on the box removes the eccentric cost, so it develops concentric power with little soreness. Never jump down."},{i:"rfess",n:"Rear-Foot-Elevated Split Squat",p:"lunge",m:"strength",e:["db","bench"],u:1,c:1,d:"Split squat with the rear foot on a bench. Roughly 85% of the load goes through the front leg, making it the highest-yield unilateral knee-dominant exercise available."},{i:"stepup",n:"Loaded Step-Up",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Step onto a knee-height box driving through the lead heel with no push-off from the trailing leg. Directly transferable to sprinting and stair work."},{i:"deadlift",n:"Conventional Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:1,c:1,d:"Bar pulled from the floor to standing with hips and knees locking together. The bar stays in contact with the legs; the back angle set at the start should not change until the bar clears the knee."},{i:"trapbar",n:"Trap Bar Deadlift",p:"hinge",m:"strength",e:["traps"],r:"dead",f:1.05,c:1,d:"Deadlift with the load centred around the body in a hex bar. Shorter moment arm on the spine and more knee flexion make it easier to load heavily with less technical risk."},{i:"rdl",n:"Romanian Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.72,c:1,d:"Hinge from standing with soft knees, lowering under control until the hamstrings reach end range, then returning. The bar drags the thighs; the set ends when the low back starts to round."},{i:"dbrdl",n:"Dumbbell RDL",p:"hinge",m:"strength",e:["db"],d:"RDL with dumbbells, which allows the load to travel slightly outside the legs and reach a deeper stretch. A good way to keep hinging when grip or low back limits barbell volume."},{i:"hipthrust",n:"Barbell Hip Thrust",p:"hinge",m:"strength",e:["barbell","bench"],r:"dead",f:.8,c:1,d:"Shoulders on a bench, bar across the hips, driving to full hip extension. Peak tension occurs at lockout rather than in the stretch, which is the opposite of the RDL."},{i:"goodmorning",n:"Good Morning",p:"hinge",m:"strength",e:["barbell","rack"],r:"dead",f:.5,d:"Bar on the back, hinging forward against a long lever arm. Extremely demanding on the spinal erectors and hamstrings relative to the load on the bar \u2014 start much lighter than expected."},{i:"swing",n:"Kettlebell Swing",p:"hinge",m:"power",e:["kb"],c:1,d:"Ballistic hip snap that projects the bell forward. The arms are ropes; all force comes from a violent hip extension and an equally hard glute and abdominal lockout at the top."},{i:"sldl",n:"Single-Leg RDL",p:"lunge",m:"strength",e:["kb"],u:1,d:"Hinge on one leg with the free leg extending behind as a counterbalance. Trains hamstring strength at length plus hip rotational stability, which no bilateral hinge covers."},{i:"nordic",n:"Nordic Hamstring Curl",p:"hinge",m:"calisthenics",e:[],d:"Kneeling with ankles anchored, lowering the torso under hamstring control as slowly as possible. One of the strongest interventions for hamstring strain risk. Regress with a band until control is possible."},{i:"backext",n:"Back Extension",p:"hinge",m:"calisthenics",e:[],d:"Hip or spinal extension from a bench, GHD, or floor. Trains the posterior chain in the low-load, high-rep range that heavy hinging leaves untouched."},{i:"pullthrough",n:"Band Pull-Through",p:"hinge",m:"band",e:["bands"],d:"Hinge with a band pulled between the legs from behind. Resistance is horizontal, so it teaches the hip drive of a deadlift with almost no spinal compression."},{i:"broadjump",n:"Standing Broad Jump",p:"hinge",m:"power",e:[],c:1,d:"Maximal horizontal jump for distance from a two-foot start. A clean field test of hip extension power and a useful potentiator before heavy hinging."},{i:"walklunge",n:"Walking Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Continuous forward lunges. The forward travel adds a deceleration demand each step that a stationary split squat does not have."},{i:"revlunge",n:"Reverse Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Stepping backward into the lunge. Easier on the knee than a forward lunge and biases the glute of the front leg because the shin stays more vertical."},{i:"latlunge",n:"Lateral Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Lunge in the frontal plane, sitting into one hip while the other leg stays straight. Trains adductors and frontal-plane hip control that sagittal-only training misses."},{i:"skater",n:"Skater Bound",p:"lunge",m:"power",e:[],u:1,d:"Lateral bound from one leg to the other with a stuck landing. Trains single-leg elastic power and frontal-plane deceleration, which is where most non-contact knee injuries occur."},{i:"cossack",n:"Cossack Squat",p:"lunge",m:"mobility",e:[],u:1,d:"Deep lateral squat shifting side to side with one leg extended. Doubles as adductor and ankle mobility work and as a frontal-plane strength exercise at end range."},{i:"powerclean",n:"Power Clean",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:1,c:1,d:"Bar pulled from the floor and received on the shoulders in a partial squat. The highest-power full-body expression available with a barbell; technique degrades fast under fatigue, so keep sets short."},{i:"hangclean",n:"Hang Power Clean",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.9,c:1,d:"Clean initiated from above the knee rather than the floor. Removing the first pull shortens the learning curve and concentrates the work in the explosive second pull."},{i:"powersnatch",n:"Power Snatch",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.78,c:1,d:"Wide-grip pull from floor to overhead in one movement, received in a partial squat. The highest bar velocity of any lift, and the most demanding of overhead mobility."},{i:"pushjerk",n:"Push Jerk",p:"triple",m:"olympic",e:["barbell","rack"],r:"clean",f:1.05,c:1,d:"Dip, drive, and re-bend under the bar to receive it overhead with locked arms. Trains overhead power and the ability to accept force in a fixed position."},{i:"cleanpull",n:"Clean Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:1.15,d:"The pull of a clean taken to full extension with no catch. Allows supramaximal loading of the pull without the technical demand of receiving the bar."},{i:"highpull",n:"Barbell High Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.85,d:"Explosive pull finishing with elbows high and the bar near chest height. A useful bridge for lifters who need the extension pattern but not the catch."},{i:"kbclean",n:"Single-Arm KB Clean",p:"triple",m:"olympic",e:["kb"],u:1,d:"Bell swung and received in the front rack in one motion. Teaches triple extension and a soft receiving position with far less technical risk than a barbell clean."},{i:"mbscoop",n:"Med Ball Rotational Scoop Toss",p:"triple",m:"power",e:["medball"],c:1,d:"Ball swung low across the body and released up and out. Combines hip extension with rotation, which is how most sporting power is actually produced."},{i:"farmer",n:"Farmer Carry",p:"carry",m:"core",e:["db"],d:"Walk with heavy load in both hands, ribs stacked over pelvis. Trains grip, trap, and trunk endurance simultaneously and is nearly impossible to perform with bad technique."},{i:"suitcase",n:"Suitcase Carry",p:"carry",m:"core",e:["kb"],u:1,d:"Carry with load in one hand only. The offset load forces the opposite-side obliques and quadratus lumborum to resist lateral flexion for the whole walk."},{i:"frontrack",n:"Front-Rack Carry",p:"carry",m:"core",e:["kb"],d:"Carry with bells racked at the shoulders. The anterior load drives the ribs up, so the abdominals must work continuously to keep them down."},{i:"ohcarry",n:"Overhead Carry",p:"carry",m:"core",e:["kb"],d:"Carry with load locked out overhead. Demands the most shoulder stability and the most rib-down control of any carry variation. Start very light."},{i:"sledpush",n:"Sled Push",p:"carry",m:"conditioning",e:["sled"],d:"Horizontal push against a loaded sled. Pure concentric work with no eccentric component, so it produces conditioning and leg drive with minimal soreness."},{i:"abwheel",n:"Ab Wheel Rollout",p:"antiext",m:"core",e:[],d:"Rolling forward while resisting lumbar extension, then returning. Range should only extend as far as the ribs can stay down and the low back flat."},{i:"hollow",n:"Hollow Body Hold",p:"antiext",m:"core",e:[],d:"Supine hold with the low back pressed flat and the limbs extended. The foundational anti-extension position; shorten the levers by tucking the knees to regress."},{i:"deadbug",n:"Weighted Dead Bug",p:"antiext",m:"core",e:[],d:"Supine alternating limb lowering with the low back kept flat throughout. Adding load or a band increases the anti-extension demand without adding spinal motion."},{i:"plankreach",n:"Plank with Reach",p:"antiext",m:"core",e:[],d:"Front plank with one arm reaching forward. The reach turns a static hold into an anti-rotation and anti-extension task at the same time."},{i:"hlr",n:"Hanging Leg Raise",p:"antiext",m:"core",e:["pullup"],d:"Legs raised from a dead hang with a deliberate posterior pelvic tilt at the top. Without the tilt it becomes a hip flexor exercise rather than an abdominal one."},{i:"sideplank",n:"Side Plank with Row",p:"antiext",m:"core",e:["bands"],u:1,d:"Side plank while rowing a band with the top arm. Anti-lateral-flexion under an added rotational challenge \u2014 a strong pairing with any unilateral carry."},{i:"copenhagen",n:"Copenhagen Plank",p:"antiext",m:"core",e:["bench"],u:1,d:"Side plank with the top leg supported on a bench, adductors holding the hips up. One of the few loaded adductor exercises and a well-supported groin injury reducer."},{i:"pallof",n:"Pallof Press",p:"rot",m:"core",e:["bands"],d:"Band or cable pressed straight out from the sternum while resisting the pull toward the anchor. The trunk does not move; the work is entirely in refusing to rotate."},{i:"chop",n:"Half-Kneeling Cable Chop",p:"rot",m:"core",e:["cable"],u:1,d:"Diagonal pull from high to low in a half-kneeling stance. Trains rotation through the thoracic spine while the pelvis stays locked by the kneeling position."},{i:"lift",n:"Half-Kneeling Cable Lift",p:"rot",m:"core",e:["cable"],u:1,d:"The chop reversed: a diagonal drive from low to high. Pairs with the chop to train both rotational directions across the full diagonal."},{i:"lmtwist",n:"Landmine Rotation",p:"rot",m:"core",e:["barbell"],d:"Barbell end swung in an arc across the body with the arms mostly straight. Load rotation with a long lever; keep the range moderate and let the hips turn with the bar."},{i:"mbrot",n:"Med Ball Rotational Throw",p:"rot",m:"power",e:["medball"],u:1,c:1,d:"Ball thrown sideways into a wall with hip drive leading and the arms last. The clearest way to train rotational power because the ball leaves the hands at peak velocity."},{i:"birddog",n:"Bird Dog",p:"rot",m:"core",e:[],d:"Quadruped opposite arm and leg extension with the spine held still. Low-load anti-rotation and a reliable way to re-establish trunk control between heavy sets."},{i:"ergint",n:"Erg / Bike Intervals",p:"loco",m:"conditioning",e:["erg"],c:1,d:"Timed intervals on a rower, bike, or ski erg. The work-to-rest ratio decides the system: 1:5 or longer stays phosphagen, 1:2 to 1:1 is glycolytic, and continuous work is oxidative."},{i:"tempo",n:"Tempo Runs",p:"loco",m:"conditioning",e:[],c:1,d:"Submaximal runs at roughly 70\u201380% of top speed with walk-back recovery. Builds aerobic capacity and running mechanics without the soreness of true sprinting."},{i:"rope",n:"Jump Rope Intervals",p:"loco",m:"conditioning",e:[],c:1,d:"Timed skipping intervals. Low equipment cost, high ankle stiffness benefit, and easily scaled by changing interval length or adding double-unders."},{i:"kbcomplex",n:"Kettlebell Complex",p:"loco",m:"conditioning",e:["kb"],c:1,d:"A fixed sequence of kettlebell lifts performed without setting the bell down. Loaded conditioning that also accumulates hinge and press volume. Choose a weight the weakest lift can handle."},{i:"sleddrag",n:"Sled Drag Intervals",p:"loco",m:"conditioning",e:["sled"],c:1,d:"Forward, backward, or lateral sled drags in timed intervals. Backward drags load the quads concentrically and are widely used for knee rehabilitation and conditioning at once."},{i:"9090",n:"90/90 Hip Switch",p:"mob",m:"mobility",e:[],for:["squat","hinge","lunge","triple"],d:"Seated rotation between 90/90 hip positions, switching sides without using the hands. Trains internal and external hip rotation, which limits squat depth more often than ankles do."},{i:"couch",n:"Couch Stretch",p:"mob",m:"mobility",e:[],for:["squat","hinge","lunge","triple"],d:"Rear foot elevated against a wall in a half-kneeling position with the pelvis tucked. Opens hip flexors and quads; the pelvic tuck is what makes it work."},{i:"ankle",n:"Banded Ankle Rock",p:"mob",m:"mobility",e:["bands"],for:["squat","lunge","triple"],d:"Knee driven forward over the toes with a band pulling the ankle back into the joint. Improves dorsiflexion, the most common hard limit on squat depth."},{i:"tspine",n:"Thoracic Extension over Bench",p:"mob",m:"mobility",e:[],for:["hpush","vpush","vpull","triple"],d:"Elbows on a bench, sinking the chest toward the floor while exhaling. Restores the thoracic extension needed for overhead positions and front rack."},{i:"wallslide",n:"Wall Slide with Exhale",p:"mob",m:"mobility",e:[],for:["hpush","vpush","vpull"],d:"Forearms sliding up a wall while exhaling fully and keeping the ribs down. Trains upward scapular rotation, the missing piece in most cranky overhead shoulders."},{i:"dislocate",n:"Band Shoulder Pass-Through",p:"mob",m:"mobility",e:["bands"],for:["vpush","vpull","hpush","triple"],d:"Band taken from in front of the body to behind with straight arms. Narrow the grip gradually over weeks. Best used as a warm-up rather than a static stretch."},{i:"catcow",n:"Segmental Cat-Cow",p:"mob",m:"mobility",e:[],for:["hinge","antiext","rot","hpull"],d:"Quadruped spinal flexion and extension moved one segment at a time. Restores the ability to move the spine deliberately, which heavy bracing tends to erode."},{i:"hipflow",n:"World's Greatest Stretch",p:"mob",m:"mobility",e:[],for:["squat","hinge","lunge","loco","hpull"],d:"Deep lunge with a thoracic rotation and a hamstring sweep. Covers hip flexors, adductors, hamstrings, and thoracic rotation in one sequence."},{i:"cgbench",n:"Close-Grip Bench Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:.88,d:"Bench with hands roughly shoulder-width. Shifts load to the triceps and shortens the bar path, which usually makes it the strongest bench variation for lockout work."},{i:"spoto",n:"Spoto Press",p:"hpush",m:"strength",e:["barbell","bench"],r:"bench",f:.9,d:"Bench paused an inch off the chest without touching. Kills the stretch reflex and exposes control in the exact range most lifters rush."},{i:"pinpress",n:"Pin Press",p:"hpush",m:"strength",e:["barbell","rack"],r:"bench",f:.95,c:1,d:"Press starting from dead stop on pins set at the sticking point. Pure concentric strength with no elastic contribution."},{i:"kbfloor",n:"KB Floor Press",p:"hpush",m:"strength",e:["kb"],u:1,d:"Floor press with a kettlebell, the mass hanging behind the wrist. The offset load demands far more shoulder packing than a dumbbell."},{i:"archerpush",n:"Archer Push-Up",p:"hpush",m:"calisthenics",e:[],u:1,d:"Push-up shifting weight onto one arm while the other stays straight. The most accessible bridge toward a one-arm push-up."},{i:"bandpushup",n:"Band-Resisted Push-Up",p:"hpush",m:"band",e:["bands"],d:"Push-up with a band across the back. Resistance climbs toward lockout, so it loads the top of the press without loading the shoulder at the bottom."},{i:"deficitpush",n:"Deficit Push-Up",p:"hpush",m:"calisthenics",e:["db"],d:"Push-up with hands elevated on dumbbells so the chest drops below them. Adds the stretched range a floor push-up can't reach."},{i:"sbfloor",n:"Sandbag Floor Press",p:"hpush",m:"strongman",e:["sandbag"],d:"Floor press with a shifting, unstable load. Grip and stabilizers fail well before the pecs do, which is the point."},{i:"zpress",n:"Z Press",p:"vpush",m:"strength",e:["barbell"],r:"press",f:.7,d:"Overhead press seated on the floor with legs straight. With no lower body to brace against, it ruthlessly exposes thoracic extension and trunk control."},{i:"logpress",n:"Log Clean & Press",p:"vpush",m:"strongman",e:["log"],c:1,d:"Log cleaned to the chest and pressed overhead. The neutral grip and thick diameter change the rack position entirely \u2014 expect well below your barbell press."},{i:"bupress",n:"KB Bottoms-Up Press",p:"vpush",m:"strength",e:["kb"],u:1,d:"Press with the bell inverted, handle squeezed hard. Irreplaceable for rotator cuff and grip reflexes; the load stays trivial and that's fine."},{i:"arnold",n:"Arnold Press",p:"vpush",m:"strength",e:["db"],d:"Dumbbell press rotating from palms-in to palms-out. Adds humeral rotation under load and hits all three deltoid heads in one path."},{i:"sbg2o",n:"Sandbag Ground-to-Overhead",p:"vpush",m:"strongman",e:["sandbag"],c:1,d:"Bag taken from floor to overhead by any means. A full-body expression that doubles as conditioning when done for reps."},{i:"hshold",n:"Wall-Supported Handstand Hold",p:"vpush",m:"calisthenics",e:[],d:"Inverted hold against a wall, ribs down and shoulders pushed to the ears. Builds the overhead position isometrically before pressing strength is there."},{i:"sealrow",n:"Seal Row",p:"hpull",m:"strength",e:["barbell","bench"],r:"bench",f:.7,d:"Row lying prone on an elevated bench. Removes every ounce of body english, so the back does exactly as much as it can and no more."},{i:"meadows",n:"Meadows Row",p:"hpull",m:"strength",e:["barbell"],u:1,d:"Single-arm row on the end of a landmine from a staggered stance. The arcing path reaches a strong stretch at the bottom."},{i:"kroc",n:"Kroc Row",p:"hpull",m:"strength",e:["db","bench"],u:1,d:"Heavy, high-rep single-arm dumbbell row with controlled body english. Built for grip, upper back mass, and work capacity rather than strict form."},{i:"pullapart",n:"Band Pull-Apart",p:"hpull",m:"band",e:["bands"],d:"Band pulled apart at chest height with straight arms. Cheap, high-rep rear delt and mid-trap work that offsets almost any pressing volume."},{i:"sbrow",n:"Sandbag Bent Row",p:"hpull",m:"strongman",e:["sandbag"],d:"Bent row hugging a sandbag. The wide, shifting load forces a stronger brace than a barbell row at the same weight."},{i:"ytw",n:"Prone Y-T-W Raise",p:"hpull",m:"core",e:[],d:"Prone scapular raises through three arm positions. Low load, high value for the lower trap, which quietly limits overhead work."},{i:"ngpullup",n:"Neutral-Grip Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"Palms facing each other. Usually the most shoulder-comfortable vertical pull and the best default for high-volume weeks."},{i:"scappull",n:"Scapular Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],d:"From a dead hang, depress the shoulder blades without bending the elbows. Teaches where a pull-up actually starts."},{i:"archerpull",n:"Archer Pull-Up",p:"vpull",m:"calisthenics",e:["pullup"],u:1,d:"Pull toward one hand with the other arm straight along the bar. The practical step toward a one-arm chin."},{i:"sapulldown",n:"Straight-Arm Pulldown",p:"vpull",m:"band",e:["bands"],d:"Lat work with the elbow locked, so the biceps can't take over. Excellent as a pre-activation before heavy pulling."},{i:"pausesquat",n:"Pause Back Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.88,c:1,d:"Squat with a two to three second pause at depth. Removes elastic energy and builds confidence in the bottom position."},{i:"pinsquat",n:"Pin Squat",p:"squat",m:"strength",e:["barbell","rack"],r:"squat",f:.85,d:"Squat starting from a dead stop on pins. The hardest possible way to train the bottom, and honest about weak points."},{i:"zercher",n:"Zercher Squat",p:"squat",m:"strongman",e:["barbell"],r:"squat",f:.65,c:1,d:"Bar carried in the crooks of the elbows. Brutal on the upper back and trunk, and the most transferable squat to carrying awkward loads."},{i:"ohsquat",n:"Overhead Squat",p:"squat",m:"olympic",e:["barbell"],r:"squat",f:.45,d:"Squat with the bar locked out overhead. Less a strength exercise than a diagnostic \u2014 it reveals every mobility restriction you have at once."},{i:"sbfront",n:"Sandbag Front Squat",p:"squat",m:"strongman",e:["sandbag"],d:"Squat bear-hugging a bag. The anterior shifting load turns it into a trunk exercise disguised as a squat."},{i:"dkbfront",n:"Double KB Front Squat",p:"squat",m:"strength",e:["kb"],d:"Front squat with two bells racked. The rack position limits load before the legs do, which makes it self-regulating."},{i:"heelsel",n:"Heels-Elevated Goblet Squat",p:"squat",m:"strength",e:["kb"],d:"Goblet squat with heels on a plate. Biases the quads and lets lifters with stiff ankles reach real depth today rather than in six weeks."},{i:"pistol",n:"Pistol Squat",p:"lunge",m:"calisthenics",e:[],u:1,d:"Full single-leg squat with the free leg extended. Demands ankle range, single-leg strength, and balance simultaneously."},{i:"wallsit",n:"Wall Sit",p:"squat",m:"calisthenics",e:[],d:"Isometric hold at ninety degrees. Cheap quad endurance and a useful finisher when no load is available."},{i:"sissy",n:"Sissy Squat",p:"squat",m:"calisthenics",e:[],d:"Knees travel forward while hips stay extended. Loads the quads and the patellar tendon at long lengths \u2014 build up slowly."},{i:"deficitdl",n:"Deficit Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.88,c:1,d:"Deadlift standing on a one to two inch platform. Lengthens the pull and directly attacks weakness off the floor."},{i:"rackpull",n:"Rack Pull",p:"hinge",m:"strength",e:["barbell","rack"],r:"dead",f:1.15,c:1,d:"Deadlift from pins above the knee. Allows supramaximal loading of the lockout and heavy upper-back exposure."},{i:"sgdl",n:"Snatch-Grip Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:.82,d:"Deadlift with a wide grip. Increases range of motion and upper back demand at a lower absolute load."},{i:"sumodl",n:"Sumo Deadlift",p:"hinge",m:"strength",e:["barbell"],r:"dead",f:1,c:1,d:"Wide stance, hands inside the knees. Shorter range and a more upright torso; strong hips and adductors favour it."},{i:"glutebridge",n:"Glute Bridge",p:"hinge",m:"calisthenics",e:[],d:"Floor-based hip extension. The regression that lets you keep training the pattern when the low back has had enough."},{i:"slhipthrust",n:"Single-Leg Hip Thrust",p:"lunge",m:"strength",e:["bench"],u:1,d:"Hip thrust on one leg. Exposes glute asymmetry that the bilateral version hides completely."},{i:"ghr",n:"Glute-Ham Raise",p:"hinge",m:"strength",e:["ghd"],d:"Knee-flexion hamstring work under body weight. Trains the hamstring at the knee, which every hip-hinge variation neglects."},{i:"backext45",n:"45\xB0 Back Extension",p:"hinge",m:"strength",e:["ghd"],d:"Hip extension from an angled bench. Loads the posterior chain with minimal compression and is easy to progress by holding a plate."},{i:"kbswing1",n:"Single-Arm KB Swing",p:"hinge",m:"power",e:["kb"],u:1,d:"Swing with one hand. Adds a rotational resistance demand to the hip snap and doubles as conditioning."},{i:"kbsnatch",n:"Kettlebell Snatch",p:"hinge",m:"power",e:["kb"],u:1,c:1,d:"Bell driven from between the legs to overhead in one motion. The backbone of kettlebell conditioning tests; punishing on grip and lungs together."},{i:"sbshoulder",n:"Sandbag Shouldering",p:"hinge",m:"strongman",e:["sandbag"],c:1,d:"Bag lifted from the ground onto one shoulder, alternating sides. As close as training gets to lifting a casualty or an awkward load."},{i:"staggerdl",n:"Staggered-Stance RDL",p:"lunge",m:"strength",e:["db"],u:1,d:"RDL with one foot back on the toe for balance only. A bridge between bilateral and true single-leg hinging."},{i:"jeffcurl",n:"Jefferson Curl",p:"hinge",m:"mobility",e:[],for:["hinge","antiext"],d:"Slow segmental spinal flexion under a light load. Trains loaded spinal range deliberately. Start with almost nothing and progress over months."},{i:"ffess",n:"Front-Foot-Elevated Split Squat",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Split squat with the front foot raised. Deepens the front-leg range while staying far easier to balance than a rear-foot-elevated version."},{i:"deficitlunge",n:"Deficit Reverse Lunge",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Reverse lunge stepping off a plate or box. Extra range at the hip makes it a strong glute builder."},{i:"curtsy",n:"Curtsy Lunge",p:"lunge",m:"strength",e:["db"],u:1,d:"Lunge stepping diagonally behind. Loads the glute medius in a way sagittal lunges never reach."},{i:"latstepup",n:"Lateral Step-Up",p:"lunge",m:"strength",e:["db","box"],u:1,d:"Step up sideways onto a box. Frontal-plane single-leg strength, valuable for anyone who changes direction under load."},{i:"slboxsquat",n:"Single-Leg Box Squat",p:"lunge",m:"strength",e:["box"],u:1,d:"Sit to a box on one leg and stand. The controllable regression on the way to a pistol."},{i:"hangsnatch",n:"Hang Power Snatch",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.7,c:1,d:"Snatch from above the knee. Highest-velocity lift most athletes can learn safely, and less technical than from the floor."},{i:"splitjerk",n:"Split Jerk",p:"triple",m:"olympic",e:["barbell","rack"],r:"clean",f:1.1,c:1,d:"Jerk receiving the bar in a split stance. More overhead stability than a push jerk and heavier loads, at the cost of footwork."},{i:"cleanjerk",n:"Clean & Jerk",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.95,c:1,d:"Full lift, floor to overhead in two movements. The most complete single expression of barbell power."},{i:"snatchpull",n:"Snatch Pull",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.95,d:"Snatch-grip pull to full extension without a catch. Allows heavy extension work without overhead demand."},{i:"jumpshrug",n:"Jump Shrug",p:"triple",m:"olympic",e:["barbell"],r:"clean",f:.7,d:"Explosive extension and shrug with the feet leaving the floor. The simplest entry point to triple extension training."},{i:"dbsnatch",n:"Dumbbell Snatch",p:"triple",m:"power",e:["db"],u:1,c:1,d:"Single dumbbell floor to overhead in one motion. Nearly all the power benefit of a barbell snatch with a fraction of the learning curve."},{i:"kbjerk",n:"Kettlebell Jerk",p:"triple",m:"power",e:["kb"],d:"Bells driven overhead with leg drive from the rack. Built for repeat efforts, which makes it conditioning as much as power."},{i:"sbclean",n:"Sandbag Clean to Shoulder",p:"triple",m:"strongman",e:["sandbag"],c:1,d:"Bag cleaned from floor to chest. Awkward, gripless, and about as sport-specific as tactical lifting gets."},{i:"yokewalk",n:"Yoke Walk",p:"carry",m:"strongman",e:["yoke"],c:1,d:"Heavy frame carried across the upper back for distance. Trains whole-body rigidity under load better than anything else. Short distances, heavy."},{i:"sbcarry",n:"Sandbag Bear-Hug Carry",p:"carry",m:"strongman",e:["sandbag"],d:"Bag hugged to the chest and carried. Constant anterior load makes breathing hard and the brace non-negotiable."},{i:"ruckmarch",n:"Ruck March",p:"carry",m:"conditioning",e:["ruck"],any:["road","track","hill","tread"],c:1,d:"Loaded walking for distance. The most transferable tactical conditioning there is, and the most commonly overdone \u2014 treat load and distance as separate progressions."},{i:"waiter",n:"Waiter Walk",p:"carry",m:"core",e:["kb"],u:1,d:"Single-arm overhead carry. Ruthless on overhead stability and shoulder endurance; keep the load light and the ribs down."},{i:"bucarry",n:"Bottoms-Up KB Carry",p:"carry",m:"core",e:["kb"],u:1,d:"Carry with the bell inverted at the rack. Grip and cuff work with almost no systemic cost."},{i:"logcarry",n:"Log Carry",p:"carry",m:"strongman",e:["log"],d:"Thick, front-loaded implement carried for distance. Breathing under an anterior load is the limiting factor."},{i:"tgu",n:"Turkish Get-Up",p:"carry",m:"core",e:["kb"],u:1,d:"Floor to standing and back with a bell locked overhead. Half mobility screen, half stability exercise, and it exposes exactly where you lose position."},{i:"backdrag",n:"Backward Sled Drag",p:"carry",m:"conditioning",e:["sled"],d:"Sled dragged walking backward. Purely concentric quad work, widely used for knee rehabilitation and conditioning simultaneously."},{i:"rkc",n:"RKC Plank",p:"antiext",m:"core",e:[],d:"Plank with maximal full-body tension \u2014 glutes, quads, and abs braced hard. Ten seconds done properly beats two minutes of sagging."},{i:"bodysaw",n:"Body Saw",p:"antiext",m:"core",e:[],d:"Plank sliding forward and back at the feet. Adds a moving lever to the anti-extension demand."},{i:"stirpot",n:"Stir the Pot",p:"antiext",m:"core",e:[],d:"Plank on a ball, elbows drawing circles. Anti-extension plus anti-rotation in a single continuous demand."},{i:"lsit",n:"L-Sit",p:"antiext",m:"calisthenics",e:[],d:"Supported hold with legs extended horizontally. Extreme hip flexor and abdominal demand; tuck the knees to regress."},{i:"dragonflag",n:"Dragon Flag",p:"antiext",m:"calisthenics",e:["bench"],d:"Body lowered as one rigid unit from the shoulders. Advanced anti-extension \u2014 earn it with a solid hollow hold first."},{i:"t2b",n:"Toes-to-Bar",p:"antiext",m:"calisthenics",e:["pullup"],d:"Hanging, feet driven to the bar. Combines grip endurance with a full-range abdominal contraction."},{i:"revcrunch",n:"Reverse Crunch",p:"antiext",m:"core",e:[],d:"Pelvis curled toward the ribs with the legs light. Trains posterior pelvic tilt, the piece most people miss in ab work."},{i:"shotput",n:"Med Ball Shot-Put Throw",p:"rot",m:"power",e:["medball"],u:1,c:1,d:"Ball driven from the shoulder with hip and trunk rotation. Trains the rotational power sequence with a clean release."},{i:"antirothold",n:"Anti-Rotation Hold",p:"rot",m:"core",e:["bands"],d:"Pallof position held statically rather than pressed. Time under tension exposes the trunk's endurance rather than its peak strength."},{i:"windmill",n:"Kettlebell Windmill",p:"rot",m:"mobility",e:["kb"],u:1,for:["vpush","hinge","rot"],d:"Hinge and rotate under an overhead bell. Combines thoracic rotation, hamstring range, and shoulder stability in one loaded position."},{i:"sprint40",n:"Short Sprints (30\u201350 m)",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["alp"],d:"Maximal accelerations from a static start. The purest alactic stimulus available; full recovery between reps is not optional."},{i:"sprint100",n:"Sprints (60\u2013100 m)",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["alp","alc"],d:"Near-maximal runs long enough to reach and hold top speed. Requires a genuine warm-up \u2014 this is where hamstrings get hurt."},{i:"run150",n:"150 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glp"],d:"Hard runs that finish just as glycolysis peaks. Long enough to hurt, short enough to repeat with quality."},{i:"run200",n:"200 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glp","glc"],d:"The classic lactate builder. Pace should be even across all reps; a fast first rep and a crawl at the end means the pace was wrong."},{i:"run400",n:"400 m Repeats",p:"loco",m:"conditioning",e:[],any:["track"],c:1,sup:["glc","aep"],d:"Deeply uncomfortable and highly effective. Rest ratio decides whether it trains lactate tolerance or aerobic power."},{i:"run800",n:"800 m Repeats",p:"loco",m:"conditioning",e:[],any:["track","road"],c:1,sup:["aep"],d:"Long intervals at roughly 90\u201395% of max heart rate. Among the most reliable ways to raise VO\u2082max."},{i:"tempo100",n:"Tempo 100s",p:"loco",m:"conditioning",e:[],any:["track","turf"],c:1,sup:["tmp"],d:"Repeat 100 m runs at about 70% effort with short walk recoveries. Builds capacity and running mechanics with almost no residual soreness."},{i:"strides",n:"Strides",p:"loco",m:"conditioning",e:[],any:["track","turf","road"],sup:["alp","tmp"],d:"Relaxed accelerations of 60\u2013100 m building to near top speed. Excellent as a potentiator or a warm-down for the nervous system."},{i:"shuttle",n:"5-10-5 Shuttle",p:"loco",m:"conditioning",e:[],any:["turf","track"],c:1,sup:["alp"],d:"Change-of-direction sprint. Trains deceleration and re-acceleration, which straight-line running never touches."},{i:"shuttle25",n:"25 yd Shuttle Repeats",p:"loco",m:"conditioning",e:[],any:["turf","track"],c:1,sup:["glp","glc"],d:"Repeated down-and-backs. The turns make it far more taxing than the equivalent distance run straight."},{i:"sledsprint",n:"Sled Sprint",p:"loco",m:"conditioning",e:["sled"],any:["turf","track"],c:1,sup:["alp","glp"],d:"Maximal sprint against sled resistance. Loads acceleration mechanics; keep the load light enough that stride pattern survives."},{i:"bearcrawl",n:"Bear Crawl",p:"loco",m:"calisthenics",e:[],any:["turf"],sup:["glc"],d:"Quadrupedal locomotion with knees just off the ground. Trunk and shoulder conditioning disguised as cardio."},{i:"hillsprint",n:"Hill Sprints",p:"loco",m:"conditioning",e:[],any:["hill"],c:1,sup:["alp","alc"],d:"Uphill maximal efforts. The incline limits stride length, which makes them far safer on hamstrings than flat sprinting."},{i:"stairrepeat",n:"Stair Repeats",p:"loco",m:"conditioning",e:[],any:["hill"],c:1,sup:["glc","aep"],d:"Repeated climbs at a hard pace. High aerobic demand with low impact on the way up; walk down for recovery."},{i:"easyrun",n:"Easy Run",p:"loco",m:"conditioning",e:[],any:["road","track","tread"],c:1,sup:["aeb"],d:"Continuous running at conversational pace. Should feel almost too easy \u2014 that is the sign you are in the right zone."},{i:"threshrun",n:"Threshold Run",p:"loco",m:"conditioning",e:[],any:["road","track","tread"],c:1,sup:["aet"],d:"Sustained running at comfortably hard effort. Raises the pace you can hold before lactate accumulates faster than you clear it."},{i:"fartlek",n:"Fartlek Run",p:"loco",m:"conditioning",e:[],any:["road","track","turf"],c:1,sup:["aep","aet"],d:"Continuous run with unstructured surges. Useful when terrain or time makes precise intervals impractical."},{i:"longrun",n:"Long Run",p:"loco",m:"conditioning",e:[],any:["road","tread"],c:1,sup:["aeb"],d:"Extended easy-pace run. Builds the aerobic base that determines how fast you recover between every hard effort you do."},{i:"inclinewalk",n:"Weighted Incline Walk",p:"loco",m:"conditioning",e:["tread"],sup:["aeb","aet"],d:"Steep treadmill walking, loaded or unloaded. Ruck-march stimulus without the joint cost of pavement."},{i:"bikesprint",n:"Air Bike Sprints",p:"loco",m:"conditioning",e:["bike"],c:1,sup:["alp","glp"],d:"All-out efforts on an air bike. Resistance scales with output, so there is nowhere to hide and no eccentric cost at all."},{i:"bikeint",n:"Air Bike Intervals",p:"loco",m:"conditioning",e:["bike"],c:1,sup:["glc","aep","aet"],d:"Structured work-rest intervals. The most controllable conditioning tool available and the easiest to prescribe by the watt."},{i:"rowint",n:"Rowing Intervals",p:"loco",m:"conditioning",e:["rower"],c:1,sup:["glp","glc","aep","aet"],d:"Interval work by distance or time. Split times give objective feedback, so pacing errors show up immediately."},{i:"rowsteady",n:"Steady-State Row",p:"loco",m:"conditioning",e:["rower"],c:1,sup:["aeb","aet"],d:"Continuous rowing at a controlled rate. Full-body aerobic work with no impact, useful on days when legs need a break from running."},{i:"skiint",n:"Ski Erg Intervals",p:"loco",m:"conditioning",e:["ski"],c:1,sup:["glp","glc","aep"],d:"Upper-body-dominant intervals. Valuable when the lower body is already fatigued from lifting."},{i:"curvesprint",n:"Curved Treadmill Sprints",p:"loco",m:"conditioning",e:["curve"],c:1,sup:["alp","glp"],d:"Self-powered sprints where you set the speed. Safer than an outdoor sprint for less-trained athletes and easy to keep to strict intervals."},{i:"kbswingint",n:"KB Swing Intervals",p:"loco",m:"conditioning",e:["kb"],c:1,sup:["glp","glc"],d:"Timed swing sets on the minute. Loaded conditioning that keeps hinging volume up when running is not an option."},{i:"sbcarryint",n:"Sandbag Carry Intervals",p:"loco",m:"conditioning",e:["sandbag"],c:1,sup:["glc","aet"],d:"Repeat carries for distance or time. Grip and breathing fail first, which is exactly what makes it tactically relevant."},{i:"sledpushint",n:"Sled Push Intervals",p:"loco",m:"conditioning",e:["sled"],c:1,sup:["alp","glp","glc"],d:"Repeated heavy pushes. Purely concentric, so it delivers hard conditioning with minimal next-day soreness."},{i:"burpee",n:"Burpee Intervals",p:"loco",m:"conditioning",e:[],c:1,sup:["glc","aet"],d:"Timed sets of burpees. Requires nothing at all, which is its entire argument. Pace it \u2014 the first minute lies to you."},{i:"hipairplane",n:"Hip Airplane",p:"mob",m:"mobility",e:[],for:["squat","hinge","lunge"],u:1,d:"Single-leg hinge with the pelvis rotating open and closed. Trains hip rotational control under balance demand."},{i:"deepsquathold",n:"Deep Squat Hold",p:"mob",m:"mobility",e:[],for:["squat","lunge","triple"],d:"Sit in the bottom of a squat and breathe. Restores end-range comfort; hold a light counterweight if balance is the limiter."},{i:"soleus",n:"Soleus Wall Stretch",p:"mob",m:"mobility",e:[],for:["squat","lunge","loco"],d:"Bent-knee calf stretch against a wall. Targets the soleus specifically, which limits both squat depth and running mechanics."},{i:"adductor",n:"Adductor Rock-Back",p:"mob",m:"mobility",e:[],for:["squat","lunge","hinge"],d:"Quadruped rocking with one leg abducted. Opens the adductors before wide-stance or lateral work."},{i:"scapcars",n:"Shoulder CARs",p:"mob",m:"mobility",e:[],for:["vpush","vpull","hpush","triple"],d:"Slow, controlled full-circle shoulder rotations. Maps and maintains active range rather than passively stretching it."},{i:"deadhang",n:"Dead Hang",p:"mob",m:"mobility",e:["pullup"],for:["vpull","vpush","hpush"],d:"Passive hang from a bar. Decompresses the shoulder and builds grip endurance at the same time."},{i:"couchbreath",n:"Half-Kneeling Breathing",p:"mob",m:"mobility",e:[],for:["*"],d:"Half-kneeling with a full exhale and a tucked pelvis. Resets rib position before overhead or hinge work."},{i:"breath",n:"90/90 Crocodile Breathing",p:"mob",m:"mobility",e:[],for:["*"],d:"Supine with feet on a wall, hips and knees at 90\xB0, breathing into the back and sides of the ribcage with a long exhale. Shifts you out of sympathetic drive so the session converts to adaptation."}],MODALITIES=[["strength","Strength"],["olympic","Olympic"],["power","Power / Plyo"],["calisthenics","Calisthenics"],["core","Core & Stability"],["band","Band work"],["strongman","Strongman / Odd object"],["conditioning","Conditioning"],["mobility","Mobility"]],MOD=a=>{var r;return((r=MODALITIES.find(b=>b[0]===a))==null?void 0:r[1])||a},vidUrl=a=>`https://www.youtube.com/results?search_query=${encodeURIComponent(a+" exercise technique tutorial")}`,PROTOCOLS=[{id:"alp",n:"Alactic Power",sys:"Phosphagen",work:"8\u201312 s",rest:"1:12 \u2014 2\u20133 min",rounds:"6\u201310",hr:null,d:"Maximal-velocity efforts with full recovery. You are training speed, not tolerance. When times drop off, the session is over \u2014 pushing further trains a different quality badly."},{id:"alc",n:"Alactic Capacity",sys:"Phosphagen",work:"15\u201320 s",rest:"1:8 \u2014 2\u20133 min",rounds:"6\u20138",hr:null,d:"Extends how long peak output holds before glycolysis takes over. Still near-maximal, still long rests."},{id:"glp",n:"Glycolytic Power",sys:"Glycolytic",work:"30\u201345 s",rest:"1:4 \u2014 2\u20133 min",rounds:"5\u20138",hr:[90,100],d:"Hard efforts with enough rest to repeat them nearly as hard. The classic 'shuttle' quality for tactical work."},{id:"glc",n:"Glycolytic Capacity",sys:"Glycolytic",work:"60\u2013120 s",rest:"1:1 \u2014 1:2",rounds:"4\u20138",hr:[90,100],d:"Lactate tolerance. Deeply uncomfortable by design, and expensive to recover from \u2014 cap it at once or twice a week."},{id:"aep",n:"Aerobic Power (VO\u2082)",sys:"Oxidative",work:"3\u20135 min",rest:"1:1",rounds:"4\u20136",hr:[90,95],d:"Raises the aerobic ceiling. Pace should be the fastest you can repeat evenly across every round."},{id:"aet",n:"Aerobic Threshold",sys:"Oxidative",work:"8\u201320 min",rest:"2\u20133 min",rounds:"2\u20134",hr:[80,88],d:"Comfortably hard and conversational only in short sentences. Raises the pace you can hold before lactate accumulates."},{id:"aeb",n:"Aerobic Base",sys:"Oxidative",work:"30\u201390 min continuous",rest:"\u2014",rounds:"1",hr:[65,75],d:"Nasal-breathing easy work. Builds the engine that pays for every other quality, and the one most people skip."},{id:"tmp",n:"Tempo / Work Capacity",sys:"Phosphagen \u2194 Oxidative",work:"~15 s at 70\u201375% effort",rest:"30\u201345 s",rounds:"10\u201320",hr:[70,85],d:"Submaximal repeats that build capacity and mechanics with minimal soreness. The safest way to add running volume to a lifting week."}],P_=a=>PROTOCOLS.find(r=>r.id===a)||PROTOCOLS[0],EMPHASES=[{id:"upperpp",n:"Upper \u2014 Push & Pull",pats:["hpush","vpush","hpull","vpull"],d:"Balanced press and row volume."},{id:"push",n:"Upper \u2014 Push",pats:["hpush","vpush"],d:"Press leads; pulling still balances it downstream."},{id:"pull",n:"Upper \u2014 Pull",pats:["hpull","vpull"],d:"Row or chin leads."},{id:"knee",n:"Lower \u2014 Knee dominant",pats:["squat","lunge"],d:"Squat pattern leads, hinge balances."},{id:"post",n:"Lower \u2014 Posterior chain",pats:["hinge","lunge"],d:"Hinge leads, quads support."},{id:"tbpower",n:"Total body \u2014 Power",pats:["triple","squat","hinge"],d:"Triple extension first, everything downstream supports it."},{id:"tbgen",n:"Total body \u2014 General",pats:["squat","hinge","hpush","hpull","triple"],d:"One big lift, full-body support."},{id:"cores o the load matters less than where you stop.",rx:a=>[["Sets","3\u20134"],["Reps","8\u201320"],["Load",`${a.lb(a.rm*.6)}\u2013${a.lb(a.rm*.75)} lb`],["RIR","0\u20131"],["Last set","AMRAP"],["Rest","60\u201390 s"]],cue:"Technical failure, not absolute failure \u2014 the set ends when the rep slows or the position breaks.",cost:4},{id:"cluster",n:"Cluster Sets",steps:0,needs:!0,zones:["max","strength","power_ss"],d:"Heavy singles broken by very short intra-set rests. Restoring phosphagen between reps lets you accumulate heavy volume at a load you couldn't hold for straight reps.",rx:a=>[["Clusters","4\u20135"],["Structure","3 \xD7 1"],["Intra-rest","15\u201320 s"],["Load",`${a.lb(a.rm*.85)}\u2013${a.lb(a.rm*.9)} lb`],["% 1RM","85\u201390%"],["Rest","3 min between clusters"]],cue:"Re-set the brace and the bar path on every single. Each rep is a first rep.",cost:5},{id:"contrast",n:"Complex / Contrast",steps:0,needs:!0,zones:["power_ss","max","strength"],d:"A heavy set paired with a matched explosive movement. The heavy set potentiates the ballistic one; the ballistic one is where the adaptation you're after actually lives.",rx:a=>[["Pairs","3\u20134"],["Heavy",`3 @ ${a.lb(a.rm*.85)}\u2013${a.lb(a.rm*.9)} lb`],["Ballistic","3\u20135 matched pattern"],["Intra-pair","30 s \u2013 2 min"],["Rest","3\u20135 min between pairs"]],cue:"Stronger athletes need the longer intra-pair rest to express potentiation; less-trained athletes get more from the shorter end. The research spread here is wide \u2014 test both on yourself.",cost:6},{id:"triphasic",n:"Tri-Phasic",steps:3,stepLabel:"Phase",stepNames:["Eccentric","Isometric","Concentric"],needs:!0,zones:["strength","max","sh"],d:"Three blocks that train each phase of the muscle action in turn \u2014 slow lowering, then a held position, then maximal concentric intent. Typically two weeks per phase.",rx:a=>a.step===1?[["Sets","3\u20134"],["Reps","3\u20135"],["Load",`${a.lb(a.rm*.8)}\u2013${a.lb(a.rm*.85)} lb`],["Tempo","5\u20136 s ec
